name: beekeepingit_client
description: "BeekeepingIT field app — Flutter Web PWA (D-5, D-10)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  go_router: ^17.2.3
  intl: 0.20.3
  http: ^1.6.0
  powersync: ^2.3.2
  # Direct dependency so powersync_local_store.dart can import
  # package:sqlite3/common.dart (the Row type) directly — powersync 2.x
  # deprecated its package:powersync/sqlite3_common.dart re-export;
  # otherwise only a transitive dep of powersync.
  sqlite3: ^3.5.0
  crypto: ^3.0.7
  meta: ^1.18.0
  web: ^1.1.1
  uuid: ^4.6.0
  # Provider-agnostic OIDC: discovery (`Issuer.discover`) + Authorization Code
  # + PKCE (`Flow.authorizationCodeWithPKCE`) driven behind the AuthPlatform
  # seam. Deliberately NOT openid_client_browser (that's the implicit flow).
  # See docs/architecture/oidc-integration.md §7.
  openid_client: ^0.4.10
  # Map view (D-16, #34): flutter_map + MapLibre/OSM tiles per tech-stack.md;
  # latlong2 is flutter_map's LatLng type.
  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  # Device location — for both #34's map "Você" marker and #33's offline
  # proximity ordering (FR-AP-2): permission request + last-known/current
  # position, with a working web (PWA) implementation via the browser
  # Geolocation API — matches D-5/D-10's Flutter Web PWA target, not just
  # native. Graceful permission handling required by both ACs.
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Direct dev dependency so tests can fake GeolocatorPlatform.instance
  # (apiary_map_screen_test.dart, #34) — otherwise only a transitive dep of
  # geolocator.
  geolocator_platform_interface: ^4.2.8
  # Fake time for tests of code whose behavior IS a schedule — SyncGate's
  # probe → exponential-backoff loop (sync_gate_test.dart, FR-OF-3, #697).
  # Asserting such a schedule against a real `Future.delayed` window makes the
  # test a race the runner loses under load; `fakeAsync` makes it exact.
  # `flutter_test` does not re-export it, so it is a direct dev dependency
  # rather than the transitive one it was.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true # regenerate lib/l10n/gen from l10n.yaml + lib/l10n/arb/*.arb

  # The one brand mark (#686, FR-UX-1). `app-icon-512.png` is a byte-identical
  # copy of `web/icons/Icon-512.png` — the Melargil bee the installed app shows
  # in its title bar, taskbar and home screen (#233/#681) — so the in-app mark
  # and the app icon are the same artwork rather than two lookalikes that can
  # drift apart. `test/brand_mark_asset_test.dart` pins that byte-for-byte.
  #
  # A COPY rather than a reference into `web/`: `web/` is the web platform
  # folder, not an asset root, and pointing lib code at it would couple the
  # widget tree to one platform's scaffolding. Bundled, never fetched — the
  # login screen is the first thing an offline cold boot paints (FR-OF-1,
  # D-10); the built bundle's copy is precached by
  # `tool/build_app_shell_cache.dart` along with the rest of the shell.
  assets:
    - assets/brand/app-icon-512.png

  # Melargil brand typography (FR-UX-1, FR-AX-1, D-18, #243), bundled as
  # assets — offline-first, NO runtime font fetching (no google_fonts, no CDN).
  # Static per-weight TTFs from Google Fonts (the two BRAND families are OFL
  # 1.1, with the license file beside each under fonts/<Family>/OFL.txt; the
  # Roboto below is not a brand face and carries its own — see its block).
  # Archivo is the app-wide
  # default (AppTheme.bodyFontFamily); Playfair Display is applied to
  # display/headline/title styles (AppTheme.displayFontFamily). See
  # docs/design/prototype.md §Type and client/lib/theming/app_theme.dart.
  fonts:
    - family: Archivo
      fonts:
        - asset: fonts/Archivo/Archivo-Regular.ttf
          weight: 400
        - asset: fonts/Archivo/Archivo-Medium.ttf
          weight: 500
        - asset: fonts/Archivo/Archivo-SemiBold.ttf
          weight: 600
        - asset: fonts/Archivo/Archivo-Bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: fonts/PlayfairDisplay/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: fonts/PlayfairDisplay/PlayfairDisplay-Bold.ttf
          weight: 700
    # Roboto is NOT a brand font and no style references it. It is here purely
    # to be CanvasKit's default glyph fallback (NFR-CMP, FR-OF-1, C-2, #620).
    #
    # The web engine hard-requires a family literally named `Roboto`: if
    # FontManifest.json has none, it downloads one on EVERY cold load, from
    # `${fontFallbackBaseUrl}roboto/v32/…woff2` — i.e. fonts.gstatic.com by
    # default (flutter_web_sdk .../engine/canvaskit/fonts.dart,
    # `if (!loadedRoboto)`). `--no-web-resources-cdn` does not suppress that;
    # it only localises the CanvasKit engine payload. That request put every
    # user's IP address in front of Google on a screen the app must also paint
    # with no signal at all. Declaring the family here makes `loadedRoboto`
    # true, so the branch never runs — and it is what keeps the engine with a
    # default family at all now that web/flutter_bootstrap.js has pinned that
    # base URL to our own origin.
    #
    # It also widens glyph coverage: Archivo and Playfair Display map ~230
    # code points each (Latin-1 + a little punctuation), Roboto maps ~896 —
    # Latin Extended, Greek, Cyrillic and Vietnamese — so free text outside
    # pt-PT/en-GB (D-34) still renders instead of falling through to a
    # network-only Noto fallback.
    #
    # Apache-2.0, not OFL like the two brand families above: this is the exact
    # binary the Flutter SDK itself ships (bin/cache/artifacts/material_fonts/
    # roboto-regular.ttf, sha256
    # 79e851404657dac2106b3d22ad256d47824a9a5765458edb72c9102a45816d95), so
    # fonts/Roboto/LICENSE.txt is that build's licence, copied beside it.
    - family: Roboto
      fonts:
        - asset: fonts/Roboto/Roboto-Regular.ttf
          weight: 400
