# --- MIME types the stock map is missing (#688, NFR-PER-1, FR-OF-1, C-2) ---
#
# `nginx:1.31-alpine`'s `mime.types` has no entry for `.ttf` or `.otf`, so every
# bundled font face fell through to the `application/octet-stream` `default_type`
# — which `gzip_types` deliberately does not list (see the compression block
# below) — and 461 KB of precached, ~46%-compressible bytes went over the wire
# whole after every release.
#
# THIS BLOCK IS AT HTTP LEVEL, AND THAT IS THE ENTIRE POINT. `types` does not
# extend an inherited map, it REPLACES it: nginx inherits a context's type map
# only when that context declares no `types` of its own, so the same two lines
# placed inside the `server {}` below would discard every type the base image
# defines — `text/html`, both `.js` spellings, `.css`, `.wasm`, the `.png` icons
# — and serve the whole bundle as `application/octet-stream`. `nginx -t` green,
# pod Ready, nothing red anywhere.
#
# Two `types` blocks in the SAME context do not replace each other; the second
# appends to the map the first built. `client/Dockerfile` COPYs this file to
# `/etc/nginx/conf.d/default.conf`, and the stock `nginx.conf` `include`s that
# directory from inside `http {}` — the same context its own
# `include /etc/nginx/mime.types;` populates. So these two entries are ADDED to
# the stock map, and every server and location still inherits all of it. That
# also makes the fix order-independent: appending is what happens whichever of
# the two includes nginx reaches first.
#
# Should a future base image start mapping `.ttf`/`.otf` itself, nginx logs a
# "duplicate extension" WARNING and the LAST mapping parsed wins — it does not
# refuse to start, and the outcome (a real font type, so `gzip_types` matches)
# is the same either way. Verified against nginx's own `ngx_http_core_types` /
# `ngx_http_core_type`, which is also where the append-in-the-same-context
# behaviour above comes from: the type array is allocated only when the context
# does not already have one.
#
# Types per RFC 8081. `.woff2` is deliberately NOT mapped-and-compressed: it is
# already a compressed container, and a CanvasKit `flutter build web` emits none
# in any case (Flutter bundles `.ttf`/`.otf`). `assets/NOTICES` has no extension
# at all, so no `types` entry can reach it — it is typed by an exact-match
# `location` in the server block below.
types {
    font/ttf ttf;
    font/otf otf;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PowerSync's web worker + wasm SQLite need cross-origin isolation for
    # OPFS/SharedArrayBuffer.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # --- Security headers (EPIC-14 #89, NFR-SEC-1) ---
    #
    # X-Content-Type-Options: stop the browser from MIME-sniffing responses into
    # a more dangerous type than the server declared (classic stored-XSS vector
    # via a mis-typed upload).
    add_header X-Content-Type-Options nosniff always;
    # Referrer-Policy: never leak the full URL (which can carry an OIDC `code`/
    # `state` query param mid-login) to a third-party origin via the Referer
    # header; still send it on same-origin navigation for basic diagnostics.
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Content-Security-Policy, scoped to what this Flutter web build actually
    # loads — verified against client/web/index.html + the build pipeline
    # (client/README.md), not a generic template:
    #   - `flutter build web` always runs with `--no-web-resources-cdn`
    #     (client/README.md, build-publish.yml) — the CanvasKit engine payload
    #     and PowerSync's wasm/worker assets are bundled into build/web/ and
    #     served same-origin, so script-src/worker-src need no third-party
    #     host. That flag does NOT cover fonts; see font-src below (#620).
    #   - `script-src 'self' 'wasm-unsafe-eval'`: Flutter's bootstrap loader +
    #     CanvasKit/skwasm and PowerSync's SQLite all compile/instantiate wasm
    #     modules same-origin — 'wasm-unsafe-eval' is the CSP3 keyword scoped to
    #     wasm compilation (unlike 'unsafe-eval', it does NOT allow JS eval()).
    #   - `worker-src 'self'`: Flutter's web worker + PowerSync's sync worker are
    #     both bundled same-origin.
    #   - `connect-src 'self' https://auth.beekeepingit.local:8443`: the app
    #     fetches OIDC discovery (`.well-known`) and posts to the token endpoint
    #     on the auth host (client/lib/core/auth/auth_controller.dart), plus its
    #     own gateway APIs / PowerSync sync-stream (same-origin, `'self'`).
    #     This directive is NOT yet complete: the map's tile layers fetch from
    #     server.arcgisonline.com and tile.openstreetmap.org (D-16), and
    #     flutter_map fetches tiles through package:http — i.e. under
    #     connect-src, not img-src — so enforcing this policy as written would
    #     blank every map view. Tracked on #671, together with the NFR-CMP
    #     question those requests raise (a tile URL *is* the apiary's
    #     coordinates). The auth host is the ONLY
    #     hardcoded value here — today it's the sole real value in the repo (the
    #     staging/prod Helm overlays don't yet define a different one, see
    #     environments/{staging,prod}.yaml). If/when a real non-local auth host
    #     ships, this file needs to become environment-templated (envsubst at
    #     container start, matching how other static configs would parameterize)
    #     rather than a hardcoded string — tracked on issue #89.
    #   - `style-src 'self' 'unsafe-inline'`: Flutter web injects its own <style>
    #     tags/inline styles at runtime for text layout; there is no external
    #     stylesheet to scope this down further.
    #   - `img-src 'self' data:`: app icons/favicon are bundled; `data:` covers
    #     Flutter's inlined image assets (e.g. semantic placeholders).
    #   - `font-src 'self'`: belt-and-braces. This app declares no @font-face,
    #     and CanvasKit fetches font BYTES with window.fetch — so connect-src,
    #     not this directive, is what governs the engine's font requests. The
    #     property the directive names is nonetheless true as of #620, and it
    #     was NOT before: `--no-web-resources-cdn` covers only the CanvasKit
    #     engine payload, and the engine reached fonts.gstatic.com two ways.
    #       (a) On EVERY cold load it downloaded Roboto — the family NAME it
    #           hardcodes as its default — unless FontManifest.json already
    #           declared one. `client/pubspec.yaml` now bundles it.
    #       (b) For a code point no registered font covers, it downloads a Noto
    #           font from `fontFallbackBaseUrl`, which defaults to
    #           `https://fonts.gstatic.com/s/`.
    #           `client/web/flutter_bootstrap.js` pins that to the relative path
    #           `font-fallback/`, served by the location block below.
    #     The two overlap deliberately: (a)'s URL is built on the same base URL,
    #     so (b) alone would turn the boot fetch into a 404 and leave CanvasKit
    #     with no default family at all — which is why the font is bundled too.
    #     Nothing is bundled under `font-fallback/`, so a code point outside
    #     Archivo/Playfair/Roboto renders as the missing-glyph box, and the
    #     engine re-requests (and re-404s) it while such text stays on screen.
    #     That is the deliberate trade (NFR-CMP, C-2) against disclosing every
    #     user's IP address to Google on a boot path that must also work with no
    #     signal (FR-OF-1) — revisited for emoji specifically on #673.
    #     Guarded by client/test/fonts_local_fallback_test.dart
    #     and, against the real deployed bundle in CI, by
    #     client/e2e/tests/same-origin-boot.spec.ts.
    #   - `object-src 'none'`, `base-uri 'self'`, `frame-ancestors 'none'`: no
    #     plugin content, no <base> injection, and the app is never meant to be
    #     framed (defense in depth alongside COOP above).
    #
    # NOTE (rollout): shipped as Content-Security-Policy-Report-Only for the
    # first release. This repo's CI cannot exercise a real browser against the
    # built app (no live cluster in CI, #89), so a directive that's subtly wrong
    # for the actual CanvasKit/skwasm/PowerSync wasm loading path would silently
    # break the app rather than just report. Report-only ships the exact same
    # policy without enforcing it, so it can be validated against a real browser
    # (dev/staging) before flipping to the enforcing `Content-Security-Policy`
    # header — tracked on issue #89.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://auth.beekeepingit.local:8443; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # --- Cache policy for the whole bundle (#621, FR-PL-1) ---
    # `flutter build web` emits NO content-hashed filenames: main.dart.js,
    # flutter_bootstrap.js, canvaskit/*, sqlite3.wasm, powersync_db.worker.js and
    # the (per-build tree-shaken) MaterialIcons-Regular.otf are stable names whose
    # bytes change every release — so `max-age=…, immutable` has no safe target
    # here and would pin users to a stale build. `no-cache` = store but revalidate:
    # ETag/Last-Modified make repeat loads cheap 304s, and a new release is picked
    # up immediately. Server level, NOT inside a location {} — an add_header there
    # cancels inheritance of all of the above (#89).
    #
    # The offline app shell is the service worker's job, not this header's:
    # `no-cache` means a stored response may not be reused without a SUCCESSFUL
    # revalidation, and with no connectivity that revalidation fails, so the
    # browser has nothing it is allowed to serve. `client/web/service_worker.js`
    # (#619) is what makes the app start with no signal, and it needs nothing
    # special here — this default is exactly right for it. It is also the file
    # where staleness would be total, since the browser's update check on that
    # script is what swaps the whole cached shell.
    add_header Cache-Control "no-cache" always;

    # --- Compression (#670, NFR-PER-1, FR-OF-1, C-2) ---
    #
    # Nothing compressed this bundle before: this file never enabled gzip, the
    # nginx:1.31-alpine base ships it commented out, and the Traefik in front of
    # it has no compress middleware. So a cold load pulled `main.dart.js`
    # (~4.4 MB) and the CanvasKit `.wasm` (~5.8 MB) whole — on an app whose
    # premise is a beekeeper on a weak mobile connection (FR-OF-1, C-2), paid
    # again after every release invalidates the service worker's shell.
    #
    # ON-THE-FLY, NOT `gzip_static`. The alternative #670 asks to weigh is
    # pre-compressed `.gz` twins served by `gzip_static`, and for files that are
    # byte-identical on every request that is normally the better trade — pay
    # once at build time, at level 9, instead of per cold load. It is rejected
    # HERE for a concrete reason: `client/tool/build_app_shell_cache.dart` walks
    # EVERY file under `build/web` and puts each one in the service worker's
    # PRECACHE manifest. A `.gz` next to each asset would be precached as its
    # own entry, so every install would download the shell twice — once decoded,
    # once as opaque gzip bytes — which is the exact opposite of this change.
    # Generating them in `client/Dockerfile` instead (after the COPY, by which
    # point the generator has already run) would dodge that, but it breaks the
    # invariant that image and ADR-0026 both state — it "only COPYs the prebuilt
    # artifact" — and replaces a coupling that is visible with one that is not:
    # pre-compress one step earlier and the offline shell silently doubles with
    # every gate green.
    #
    # The cost of choosing runtime compression is bounded, but it is NOT free,
    # and the shape of the budget is what picks the level below. `Cache-Control:
    # no-cache` above turns repeat loads into 304s (empty body, nothing to
    # compress) and the service worker precaches the shell once per release, so
    # this runs roughly once per client per RELEASE rather than per page view.
    # The catch is that those events are synchronised: this file's bytes feed
    # BUILD_REVISION (below), so a release re-primes every installed shell at
    # once, against a `pwa` Deployment that is one replica with no HPA and a
    # 100m CPU limit in dev and staging (infra/helm/beekeepingit/values.yaml,
    # charts/pwa/values.yaml) whose liveness/readiness probes share that cgroup.
    # gzip also ends `sendfile` for these responses — the filter needs the bytes
    # in user space — so this is the pod's first real CPU load.
    #
    # If CPU ever does become the constraint beyond what the level below
    # concedes, `gzip_static` is the fix, and it needs exactly two things: a
    # `.gz` exclusion in build_app_shell_cache.dart (plus its unit test) and a
    # generation step at every `flutter build web` site —
    # scripts/check-app-shell-precache-wired.sh enumerates them.
    #
    # No Brotli: `ngx_brotli` is not compiled into the official nginx image, and
    # #670 scopes Brotli to "if the base image supports it without a custom
    # build". Maintaining a custom nginx build to save another ~15% is not that
    # trade.
    #
    # The re-prime named above is required, not incidental: the worker stores
    # responses AS RECEIVED, so without a new BUILD_REVISION every installed
    # client would keep serving itself the uncompressed-era responses it cached,
    # indefinitely.
    gzip on;
    # nginx skips compression for a request it considers PROXIED, which it
    # decides by the presence of a `Via` header. Traefik does not add one, so
    # today the default (`off`) would compress anyway and this directive is
    # inert. It is here for the day that stops being true: one more hop that set
    # `Via` would otherwise turn compression off for every request at once,
    # silently, with nothing red.
    #
    # `any` rather than one of the narrower keywords, and the justification is
    # NOT that they would match anyway: everything this server answers is the
    # public static bundle, so there is no case where compressing a proxied
    # response would be wrong. The gateway peels `/v1/*` and `/sync-stream` off
    # before nginx ever sees them, and nothing here reflects a request parameter
    # into a response body — so no response compressed here mixes a secret with
    # attacker-controlled input, which is the BREACH precondition.
    gzip_proxied any;
    # A compressed and an uncompressed answer for the same URL are different
    # bytes, and a shared cache has to key on that. It does not change what the
    # app-shell worker matches: `Accept-Encoding` is a forbidden header name, so
    # neither the stored nor the queried Request can carry it and the Cache API
    # compares null against null. (The worker passes `ignoreVary: true` anyway.)
    gzip_vary on;
    # 2, and the reason is the CPU cap above rather than the compression curve.
    # Measured on this bundle:
    #
    #     main.dart.js  4,441,974 B    canvaskit.wasm  5,760,502 B
    #       L1  1,508,778  (66.0%)       L1  2,463,783  (57.2%)
    #       L2  1,458,316  (67.2%)       L2  2,401,322  (58.3%)
    #       L5  1,283,056  (71.1%)       L5  2,208,118  (61.7%)
    #       L9  1,248,305  (71.9%)       L9  2,185,812  (62.1%)
    #
    # Level 2 captures 94% of the bytes level 9 could. The sizes above are
    # measured; the CPU is not — deflate's cost is well known to climb steeply
    # with level while the curve above flattens after 5, and #693 is what
    # actually measures it on the pod. The 6% given up is ~0.47 MB on a cold
    # load: real, but not worth spending the only pwa replica's 100m budget on
    # during the post-release re-prime this very change synchronises. Raising
    # this is a one-line change the day that pod is sized for it.
    gzip_comp_level 2;
    # A floor, because below it the gzip framing plus the extra `Vary` costs
    # about what it saves — version.json (108 B) actually grows to 109 B. But
    # 256, not the kilobyte a stock config uses: manifest.json is 856 B and
    # compresses 56.9%, and on the connection this app is for, bytes are scarcer
    # than the CPU a file that small costs.
    gzip_min_length 256;
    # `text/html` is ALWAYS compressed by nginx and must NOT be listed here —
    # listing it logs a duplicate-MIME-type warning. Both `.js` spellings are
    # present because nginx's own mime.types has changed which one it maps `.js`
    # to across releases, and neither is worth depending on.
    #
    # The allow-list IS the exclusion mechanism — there is no negative
    # directive to write. `image/png` and `font/woff2` are already-compressed
    # formats (re-compressing Icon-512.png buys 4.9% for a full pass over
    # 24 KB), so they are simply never named. `application/octet-stream` is
    # unnamed for a sharper reason: it is nginx's `default_type`, so listing it
    # would sweep in every file the mime.types map does not recognise, PNGs
    # among them.
    #
    # That last one used to cost ~1.5 MB: the stock mime.types has no
    # `.ttf`/`.otf` entry and `assets/NOTICES` has no extension, so the bundled
    # font faces (461 KB, precached) and NOTICES (1.45 MB, runtime-tier) went
    # over the wire whole. #688 fixed that where the problem actually is — the
    # MIME map, not this list: the http-level `types` block at the top of this
    # file, and the exact-match `location = /assets/NOTICES` below. `font/ttf`,
    # `font/otf` and `text/plain` are named here as the other half of that fix.
    # `application/octet-stream` stays unnamed, and that is still what keeps the
    # `.png` icons out.
    #
    # ONE property of this list can only be checked against the file, never
    # against the wire, and `client/test/nginx_compression_test.dart` pins it:
    # `text/html` must stay absent, because it is compressed either way and no
    # live probe can tell the difference. `application/octet-stream` used to be
    # in the same category and no longer is — since #688 the e2e watches it live
    # through `assets/shaders/ink_sparkle.frag`, which inherited the
    # "unrecognised extension, served as the default_type" role from `.ttf` and
    # is the biggest such file the bundle still has that a browser would
    # plausibly request. The unit test keeps its own assertion on it anyway: the
    # e2e needs a live cluster, this one costs a second.
    #
    # `text/css` and `image/svg+xml` are listed for the acceptance criteria of
    # #670 and for the day the bundle emits them; a CanvasKit `flutter build
    # web` emits neither today, which is why nothing asserts them.
    gzip_types
        application/javascript
        text/javascript
        application/json
        application/manifest+json
        application/wasm
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/plain;

    # CanvasKit's glyph-fallback prefix (#620, see font-src above). It is NOT a
    # client-side route, so it must not fall through to the SPA rule — that
    # would answer a font request with index.html, and the engine would spend a
    # download parsing HTML as a font on every uncovered code point. `=404` lets
    # it fail fast, while still serving anything actually bundled under
    # `client/web/font-fallback/`. (Longest-prefix wins in nginx, so this beats
    # `location /` regardless of order; `^~` additionally stops a future regex
    # location from hijacking font requests by extension.)
    #
    # Root-absolute, while the value it mirrors is document-relative. They line
    # up only because no build passes `--base-href` (verified across the
    # workflows, taskfiles and scripts); under a non-root base href the engine
    # would request `/<base>/font-fallback/…` and miss this block. Change both
    # together, or make this a regex location, if that day comes.
    location ^~ /font-fallback/ {
        try_files $uri =404;
    }

    # The bundled licence text (#688). At 1.45 MB it is the single largest
    # compressible file the bundle serves, and it compresses 89.2% — but it has
    # NO extension, so the http-level `types` map at the top of this file cannot
    # reach it and it would keep falling through to `application/octet-stream`.
    #
    # An `=` (exact-match) location is how one extensionless file gets a type
    # without a blanket rule. A bare `default_type text/plain;` at server level
    # would be the blunt version of this and is wrong: it would re-type every
    # file the mime.types map does not recognise — today `assets/shaders/*.frag`
    # and `.last_build_id`, tomorrow whatever a future Flutter release emits —
    # which is the same "sweep in everything unrecognised" mistake that keeps
    # `application/octet-stream` out of `gzip_types` above. Exact match keeps
    # the blast radius at one URI. (`assets/AssetManifest.bin` would NOT be
    # caught: the stock map does list `bin`, as `application/octet-stream` —
    # recognised, and merely mapped to the default type's value. See
    # `client/e2e/tests/cache-headers.spec.ts`.)
    #
    # NOTHING in here may be an `add_header`. This block inherits all six of the
    # server-level headers above — COOP, COEP, nosniff, Referrer-Policy, the
    # report-only CSP and Cache-Control — and a single `add_header` here would
    # cancel every one of them for this URI (#89). `default_type` and
    # `try_files` are not `add_header` and take nothing away.
    #
    # `=404` rather than the SPA fallback below, for the same reason the
    # font-fallback block above uses it: answering a licences fetch with
    # index.html would hand the app an HTML document to render as licence text
    # instead of a loud, diagnosable miss.
    location = /assets/NOTICES {
        default_type text/plain;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes (go_router) resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
