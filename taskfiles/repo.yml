# Repo-hygiene tasks — cross-cutting linters/formatters that run with zero code packages.
# These give `task lint` / the pre-commit hook something real to enforce from day one.
version: "3"

silent: true

tasks:
  lint:
    desc: "Repo hygiene: format + Markdown + Actions + shell + secrets + deploy URLs + scope mappings"
    cmds:
      - task: format-check
      - task: markdown
      - task: actions
      - task: shell
      - task: secrets
      - task: deploy-urls
      - task: admin-audience-mapping
      - task: platform-operator-mapping
      - task: federation-source-posture

  format:
    desc: "Format Markdown / YAML / JSON with Prettier (writes changes)"
    cmds:
      - prettier --write "**/*.{md,yml,yaml,json}"

  format-check:
    desc: "Verify Markdown / YAML / JSON are Prettier-clean"
    cmds:
      - prettier --check "**/*.{md,yml,yaml,json}"

  markdown:
    desc: "Lint Markdown (markdownlint-cli2, config in .markdownlint-cli2.yaml)"
    cmds:
      - markdownlint-cli2 "**/*.md"

  actions:
    desc: "Lint GitHub Actions workflows (actionlint)"
    cmds:
      - |
        if [ -d .github/workflows ]; then actionlint; else echo "› [repo] no workflows — skipping"; fi

  shell:
    desc: "Lint shell scripts anywhere in the repo (shellcheck)"
    cmds:
      - |
        files=$(find . -type f -name '*.sh' \
          -not -path './node_modules/*' -not -path './.git/*' \
          -not -path './.claude/worktrees/*' -not -path '*/.dart_tool/*' \
          2>/dev/null || true)
        if [ -z "$files" ]; then echo "› [repo] no shell scripts — skipping"; exit 0; fi
        # -x: follow `# shellcheck source=path` directives into sourced files
        # outside this invocation's own file list — infra/cluster's
        # scw-common.sh/scw-cluster-prereqs.sh (#539) are sourced by several
        # scaleway-*.sh scripts and declare vars/functions those scripts use,
        # which shellcheck can only see by actually following the source.
        shellcheck -x $files

  secrets:
    desc: "Scan the working tree for committed secrets (gitleaks)"
    cmds:
      - gitleaks detect --no-git --no-banner --redact

  deploy-urls:
    desc: "Verify the PWA URLs in release-deploy.yml match the helm env overlays (#369, D-27)"
    cmds:
      - ./scripts/check-deploy-url-drift.sh

  admin-audience-mapping:
    desc: "Verify the admin iss/aud override mapping is attached to ONLY the admin provider (#460, NFR-SEC-1)"
    cmds:
      - ./scripts/check-admin-audience-mapping.sh

  platform-operator-mapping:
    desc: "Verify the platform-operator claim mapping is attached to ONLY the admin provider (#465, NFR-SEC-1)"
    cmds:
      - ./scripts/check-platform-operator-mapping.sh

  federation-source-posture:
    desc: "Verify federation sources stay subject-matched + !Env-credentialed, enrollment-open only via the guarded flow (#363/#365, NFR-SEC-1)"
    cmds:
      - ./scripts/check-federation-source-posture.sh
