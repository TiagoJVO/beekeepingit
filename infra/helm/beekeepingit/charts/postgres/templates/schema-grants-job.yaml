{{/*
D-6's "schema per service" SCHEMA-level grants — split from bootstrap
(cluster.yaml) because spec.managed.roles is reconciled *after* initdb's
postInitApplicationSQL runs, so the per-service roles don't exist yet at
bootstrap time. This hook runs post-install/post-upgrade as the `beekeepingit`
app owner, which owns every schema per cluster.yaml's `AUTHORIZATION
beekeepingit` and can therefore `GRANT ... ON SCHEMA` without superuser.

WHY beekeepingit STILL OWNS THE SCHEMAS AFTER #545. It would look tidier to
hand each schema to its own `<schema>_migrator` along with the tables. It is
not: a non-owner cannot `GRANT ... ON SCHEMA`, so moving schema ownership would
break exactly this Job, and it buys nothing — a schema's owner cannot read or
alter a table it does not own. So schema ownership stays here and TABLE
ownership is what #545 moves. ADR-0024 says so explicitly rather than leaving
it to look like an oversight.

HOOK WEIGHT 0, moved down from 1 to free a slot for the gated adopt Job:

  0  THIS JOB               powersync DB grant + schema USAGE/CREATE
  1  migrator-adopt-job     [gated] per-schema ownership transition
  2  charts/services migrate-job.yaml
  3  table-grants-job       table DML grants, history/ledger REVOKEs

The powersync grant runs FIRST and stays free of any dependency on migrations.
PowerSync's rollout genuinely blocks on it (infra/README.md step 4/7), so a
slow or stuck migration must never be able to stall it — that independence is
ADR-0023 §3's rule, and the ~55-minute retry incident recorded in the deleted
audit-immutability-job.yaml is what it was learned from. Weight 0 rather than
"first among the weight-1 hooks" because Helm gives no ordering guarantee
WITHIN a weight.

WHY THE BLIND `until psql ...; do sleep 5; done` IS GONE. See
_helpers.tpl's `postgres.waitForRoleShellFn` for the full account: that shape
cannot distinguish "not reconciled yet" from "permanently denied", and it once
burned a whole live CI run to its deadline (#62, run 29146587211) on a
permission error it retried 60 times. Here the async precondition (does the
role exist yet) is polled on its own, and the grants then run ONCE under
ON_ERROR_STOP=1 so a real error surfaces as a real error.

THE SCHEMA ACL THIS ESTABLISHES, per schema:
  <schema>_migrator  USAGE, CREATE   — it creates and owns every relation here
  <schema>_svc       USAGE           — CREATE explicitly revoked, so the
                                       runtime role can never create (and
                                       therefore never own) a table. That is
                                       the whole basis of the append-only
                                       guarantee since #541: there is nothing
                                       to take away because it never had it.
*/}}
{{- if .Values.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres.fullname" . }}-schema-grants
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "beekeepingit.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "0"
spec:
  backoffLimit: 30
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "beekeepingit.labels" . | nindent 8 }}
        # Keeps this pod inside the `postgres-jobs-to-postgres` NetworkPolicy
        # edge (charts/networkpolicy/values.yaml). default-deny is
        # namespace-wide, so a pod identity with no matching edge cannot reach
        # Postgres at all — a failure this repo has hit repeatedly.
        app.kubernetes.io/name: postgres
    spec:
      restartPolicy: OnFailure
      # Hardened to match table-grants-job.yaml and charts/services' workloads.
      # This was the LAST unhardened Job in the chart, and after #545 it also
      # holds the last cross-schema credential left in the hook path
      # (`beekeepingit` still owns all seven schemas), which makes it the
      # highest-value target here — no longer a defensible place to leave the
      # gap "tracked separately". The postgres image runs as uid 26
      # (`postgres`).
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
      containers:
        - name: schema-grants
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: {{ .Values.image }}
          env:
            - name: PGHOST
              value: {{ include "postgres.fullname" . }}-rw
            - name: PGDATABASE
              value: beekeepingit
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-app
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              {{- include "postgres.waitForRoleShellFn" . | nindent 14 }}

              # powersync_storage (PowerSync's bucket-storage DB, ADR-0005) is
              # created and owned by beekeepingit at postInitSQL time — before
              # the `powersync` role exists — so it can't own it at creation
              # time either; same reason as the schema grants below. GRANT ON
              # DATABASE doesn't require being connected to that database.
              # Deliberately the FIRST thing this Job does: it is what unblocks
              # PowerSync's readiness probe, and nothing below it may delay it.
              wait_for_role "EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'powersync')" "role powersync"
              psql -v ON_ERROR_STOP=1 \
                -c "GRANT ALL PRIVILEGES ON DATABASE powersync_storage TO powersync;"
              echo "powersync_storage: database grant applied."

              {{- range .Values.schemas }}

              wait_for_role "EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ . }}_migrator')" "role {{ . }}_migrator"
              wait_for_role "EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ . }}_svc')" "role {{ . }}_svc"
              psql -v ON_ERROR_STOP=1 --single-transaction \
                -c "GRANT USAGE, CREATE ON SCHEMA {{ . }} TO {{ . }}_migrator;" \
                -c "GRANT USAGE ON SCHEMA {{ . }} TO {{ . }}_svc;" \
                -c "REVOKE CREATE ON SCHEMA {{ . }} FROM {{ . }}_svc;"
              echo "{{ . }}: schema grants applied."
              {{- end }}
{{- end }}
