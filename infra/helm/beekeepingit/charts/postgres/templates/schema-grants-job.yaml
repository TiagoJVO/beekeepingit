{{/*
D-6's "schema per service" grants — split from bootstrap (cluster.yaml) because
spec.managed.roles is reconciled *after* initdb's postInitApplicationSQL runs,
so the per-service roles don't exist yet at bootstrap time. This hook runs
post-install/post-upgrade, connecting as the `beekeepingit` app owner (which
owns every schema per cluster.yaml's `AUTHORIZATION beekeepingit`, so it can
GRANT without needing superuser access) — and retries each grant until the
matching role exists, since the operator's role reconciliation is async
relative to this hook firing.

#62's audit-immutability lock-down (history.md §7.1) is a SEPARATE Job —
see audit-immutability-job.yaml — deliberately not folded in here: it needs a
much longer/looser retry budget (it waits on each service's own migration,
which runs on pod startup, not on anything this install/upgrade directly
controls) and must not delay or risk failing the powersync grant below, which
PowerSync's rollout genuinely blocks on (infra/README.md step 4/7).

That other Job needs `beekeepingit` to act with each `<schema>_svc` role's
own privileges (the only way a non-superuser can `ALTER TABLE ... OWNER TO`
a table it doesn't yet own) — its membership in every `<schema>_svc` role is
granted DECLARATIVELY in cluster.yaml's `managed.roles` (an entry for
`beekeepingit` itself, with `inRoles`), not by a manual GRANT run from this
Job. A manual `GRANT <schema>_svc TO beekeepingit` executed BY beekeepingit
does NOT work — confirmed the hard way (CI's live k3d/helm-e2e run failed
with the schema-grants Job spinning its retry loop until
`activeDeadlineSeconds` killed it): Postgres requires CREATEROLE + ADMIN
OPTION on the target role to grant its membership, which beekeepingit (a
plain login role, not superuser) has neither of, so every attempt returned a
permission error indistinguishable (to the `until ... done` retry loop) from
"role not ready yet" — it retried a permanent failure until the deadline. Only
CNPG's own operator reconciliation connection is privileged enough to grant
role membership unconditionally, which is why this now goes through
`managed.roles` instead — see cluster.yaml's comment on the `beekeepingit`
entry for the full mechanism and services/shared/dbaccess/
audit_immutability_test.go for the testcontainers proof of the ALTER/GRANT
sequence that membership then enables.
*/}}
{{- if .Values.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgres.fullname" . }}-schema-grants
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "beekeepingit.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "1"
spec:
  # FAILURE BUDGET (#551). The waiting this Job exists to do now happens inside
  # the loop below, which carries its own deadline, so activeDeadlineSeconds is
  # a backstop rather than the budget. It used to be the budget — and that budget
  # included image pull, because Kubernetes starts the clock when the Job is
  # created. #551 records that shape killing charts/services' migrate Job on
  # staging; here the exposure is a cold cluster pulling the PostGIS operand
  # image, which is a far bigger pull than a distroless Go service, out of the
  # same 300s the role reconciliation was supposed to get.
  #
  # Unlike that Job, this one could never be caught by backoffLimit at all: the
  # retry loop below does not exit on a permanent failure, so nothing but the pod
  # deadline could stop it. That is exactly how the incident in the header
  # comment played out — a permission error indistinguishable from "not ready
  # yet", retried in silence and finally reported as a timeout, with the reason
  # nowhere in the Job's own outcome. A deadline in the loop ends that: it gives
  # up on purpose, and says what it was still failing at.
  #
  # backoffLimit drops to 1 for the same reason. With the wait bounded where the
  # waiting happens, a Job-level retry is not a waiting mechanism — it is one
  # free restart for a container that crashed, and thirty of them would only put
  # the unbounded budget back by another route.
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "beekeepingit.labels" . | nindent 8 }}
        app.kubernetes.io/name: postgres
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-grants
          image: {{ .Values.image }}
          env:
            - name: PGHOST
              value: {{ include "postgres.fullname" . }}-rw
            - name: PGDATABASE
              value: beekeepingit
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}-app
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # ONE deadline for the whole wait, not one per grant. Everything
              # below is waiting on the same single event — CNPG's operator
              # reconciling spec.managed.roles — so a slow reconciliation must
              # not get its budget multiplied by however many schemas happen to
              # be listed in values.yaml. 300s is what this Job was nominally
              # given before; the difference is that it is now 300s of waiting
              # rather than 300s shared with an image pull (#551).
              budget=300
              deadline=$(( $(date +%s) + budget ))

              # Retry until the role exists — but give up on purpose rather than
              # spinning until the pod is killed. A permission error and "the
              # operator hasn't got there yet" are indistinguishable to this
              # loop (see the header comment), so the only honest way to end it
              # is a deadline plus the failing psql output, which stays on
              # stderr above whatever we print here.
              grant_when_ready() {
                what="$1"
                shift
                until psql -v ON_ERROR_STOP=1 "$@"; do
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "giving up on ${what}: still failing after ${budget}s of WAITING (image pull excluded, #551) — the psql error above is the real one, not a readiness delay" >&2
                    exit 1
                  fi
                  echo "${what} not ready yet, retrying in 5s..."
                  sleep 5
                done
              }

              {{- range .Values.schemas }}
              grant_when_ready "role {{ . }}_svc" -c "GRANT USAGE ON SCHEMA {{ . }} TO {{ . }}_svc;" -c "REVOKE CREATE ON SCHEMA {{ . }} FROM {{ . }}_svc;"
              {{- end }}
              # powersync_storage (PowerSync's bucket-storage DB, ADR-0005) is
              # created and owned by beekeepingit at postInitSQL time — before
              # the `powersync` role exists — so it can't own it at creation
              # time either; same reason as the schema grants above. GRANT ON
              # DATABASE doesn't require being connected to that database.
              grant_when_ready "role powersync" -c "GRANT ALL PRIVILEGES ON DATABASE powersync_storage TO powersync;"
{{- end }}
