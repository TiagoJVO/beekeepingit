{{/*
TWO credential Secrets per schema (D-6 "schema per service"), one per role:

  <schema>-svc-credentials       the RUNTIME role. DML only, owns nothing.
  <schema>-migrator-credentials  the DEPLOY-TIME role (#545). Owns every
                                 relation in its own schema, and nothing at
                                 all outside it.

CNPG's declarative role management (spec.managed.roles in cluster.yaml) does
NOT auto-generate passwords — it requires a pre-existing kubernetes.io/basic-auth
Secret named after the role with `username`/`password` keys, labelled
cnpg.io/reload so the operator picks up changes. Generated once via `lookup` +
`randAlphaNum` (preserved across `helm upgrade`, never a literal value in git —
NFR-SEC) rather than pre-created out of band.

WHY THE MIGRATOR NEEDS ITS OWN SECRET PER SCHEMA, rather than reusing the
`<postgres.fullname>-app` (`beekeepingit`) Secret the way #541 did: the migrate
Job runs the SERVICE'S OWN application image — the same artifact that serves
untrusted HTTP — so whatever credential is mounted there is reachable by
anything that compromises that image. `beekeepingit` owns all seven schemas, so
one compromised image reached every other service's data and audit_log. Seven
separate credentials, each with authority over exactly one schema, is what
bounds that (#545, NFR-SEC-1). A per-service OVERRIDE for this name is
deliberately not offered anywhere: a service pointing at another schema's
migrator Secret is precisely the bug being removed, so charts/services derives
the name from `$svc.db.schema` and it is unrepresentable.
*/}}
{{- if .Values.enabled }}
{{- range .Values.schemas }}
{{- $schema := . }}
{{- range $role := list "svc" "migrator" }}
{{- $secretName := printf "%s-%s-credentials" $schema $role }}
{{- $existing := lookup "v1" "Secret" $.Values.global.namespace $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "beekeepingit.labels" $ | nindent 4 }}
    app.kubernetes.io/name: postgres
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ printf "%s_%s" $schema $role }}
  password: {{ $password | quote }}
---
{{- end }}
{{- end }}
{{/*
PowerSync's combined replication/storage role (cluster.yaml's managed.roles).
Also carries pre-composed connection URIs (PowerSync's config wants full
postgresql:// URIs, and CNPG's own generated Secrets — like this one — only
ever hold username/password parts, so we compose them once here rather than
inventing a URI-assembly step in the powersync subchart's Deployment).
*/}}
{{- $psSecretName := "powersync-credentials" }}
{{- $psExisting := lookup "v1" "Secret" .Values.global.namespace $psSecretName }}
{{- $psPassword := "" }}
{{- if $psExisting }}
{{- $psPassword = index $psExisting.data "password" | b64dec }}
{{- else }}
{{- $psPassword = randAlphaNum 32 }}
{{- end }}
{{- $psHost := printf "%s-rw" (include "postgres.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $psSecretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "beekeepingit.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: powersync
  password: {{ $psPassword | quote }}
  replication-uri: {{ printf "postgresql://powersync:%s@%s:5432/beekeepingit" $psPassword $psHost | quote }}
  storage-uri: {{ printf "postgresql://powersync:%s@%s:5432/powersync_storage" $psPassword $psHost | quote }}
{{- end }}
