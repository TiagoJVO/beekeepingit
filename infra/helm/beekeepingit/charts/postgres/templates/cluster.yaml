{{/*
Assumes the CloudNativePG operator is already installed on the cluster (a
cluster-scoped prerequisite provisioned by infra/cluster/up.sh, not this chart
— see ADR-0010). One instance (no HA yet — single small dev cluster, NFR-ARC-3).
*/}}
{{- if .Values.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "postgres.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "beekeepingit.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  instances: {{ .Values.instances | default 1 }}
  imageName: {{ .Values.image }}
  storage:
    size: {{ .Values.storageSize }}
  resources:
    {{- index .Values.global.resources .Values.resourceTier | toYaml | nindent 4 }}
  postgresql:
    # Logical replication, required by the PowerSync sync engine (D-6, ADR-0005)
    # to stream the `powersync` publication (below) to its self-hosted service.
    parameters:
      wal_level: "logical"
      max_wal_senders: "10"
      max_replication_slots: "10"
  bootstrap:
    initdb:
      database: beekeepingit
      owner: beekeepingit
      # Runs once, as superuser, connected to the default `postgres` database,
      # *before* the `beekeepingit` application database above is even created
      # — the only bootstrap hook that can CREATE DATABASE. Used for PowerSync's
      # bucket-storage database (ADR-0005: "a SEPARATE database, so the
      # `powersync` publication below never captures it") — deliberately not a
      # schema in `beekeepingit` like the domain services below.
      postInitSQL:
        - CREATE DATABASE powersync_storage OWNER beekeepingit;
      # Runs once, as superuser, inside the `beekeepingit` application database
      # (postInitApplicationSQL — not postInitSQL/postInitTemplateSQL, which run
      # against `postgres`/`template1` instead), *before* spec.managed.roles
      # below is reconciled — so this can only create schemas (owned by the
      # `beekeepingit` app user, so it — not just a superuser — can later GRANT
      # on them), not GRANT to the per-service roles yet: they don't exist at
      # bootstrap time. See templates/schema-grants-job.yaml for the grants.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        {{- range .Values.schemas }}
        - CREATE SCHEMA IF NOT EXISTS {{ . }} AUTHORIZATION beekeepingit;
        {{- end }}
        # Scoped to the SYNCABLE schemas only — NOT `FOR ALL TABLES`
        # (walking-skeleton.md §5.3, sync.md §3.4): PowerSync's bucket-storage
        # DB must not become a shadow copy of non-synced data (identity, ai,
        # invitations, …). `FOR TABLES IN SCHEMA` (PG15+) is createable at
        # bootstrap because the schemas already exist (above) even though their
        # tables don't yet, and it auto-includes future additive tables in
        # those schemas — so a new syncable service only extends the
        # `syncedSchemas` list here, no post-migration ALTER PUBLICATION.
        - CREATE PUBLICATION powersync FOR TABLES IN SCHEMA {{ join ", " .Values.syncedSchemas }};
  managed:
    roles:
      {{- range .Values.schemas }}
      # The RUNTIME role. DML on its own schema's domain tables, INSERT/SELECT
      # on its history tables, nothing on the goose ledger, and it owns
      # nothing anywhere — which is what makes the append-only guarantee
      # durable rather than something the owner could self-GRANT away
      # (history.md §7.1, ADR-0023 §2). Deliberately NOT a member of anything.
      - name: {{ . }}_svc
        ensure: present
        login: true
        passwordSecret:
          name: {{ . }}-svc-credentials
      # The DEPLOY-TIME role (#545, ADR-0024). Owns every relation in
      # {{ . }} — domain tables, audit_log, sync_conflict_log, indexes and
      # {{ . }}.goose_db_version — and has USAGE/CREATE on that schema and
      # nothing else. Like `<schema>_svc` it is a member of NO other role,
      # which is the entire point: the migrate Job that carries this
      # credential runs the service's own application image, so its authority
      # must stop at its own schema boundary. On a fresh install that
      # ownership needs no separate step — the Job connects as this role with
      # DB_SEARCH_PATH={{ . }}, so goose creates the ledger and every table
      # under it from the start. templates/migrator-adopt-job.yaml exists only
      # to reach the same end state on a cluster that already deployed #541.
      #
      # A migrator role stays present even for a schema whose service does not
      # exist yet (ai, and every schema before its service ships): CNPG
      # reconciles roles from this list, not from what happens to be deployed,
      # and an unused login role with USAGE/CREATE on one empty schema grants
      # its holder nothing until someone holds it.
      - name: {{ . }}_migrator
        ensure: present
        login: true
        passwordSecret:
          name: {{ . }}-migrator-credentials
      {{- end }}
      # WHAT beekeepingit IS NOW, and what it no longer is. It stays the
      # database owner and the owner of all seven SCHEMAS, so it remains the
      # principal for schema-grants-job.yaml (a non-owner cannot
      # `GRANT ... ON SCHEMA`) and for the gated adopt Job. It is NEVER again
      # a migrate Job's credential — that is #545's entire point, and schema
      # ownership is deliberately left here rather than handed to the
      # migrators, because moving it would break those schema grants and buy
      # nothing: a schema's owner cannot read or alter a table it does not own
      # (ADR-0024).
      #
      # HISTORY OF THIS `inRoles` FIELD, because it has now meant three
      # different things and the current meaning is the narrowest:
      #   - #62 (history.md §7.1) needed `<schema>_svc` membership so
      #     beekeepingit could `ALTER TABLE ... OWNER TO beekeepingit` an
      #     audit_log that the service's own startup migration had created.
      #   - #541 deleted that dance (migrations moved to a Job running as
      #     beekeepingit, which owned every table from creation) but kept the
      #     membership for the pre-#541 REASSIGN and for migrating
      #     not-yet-reassigned legacy tables.
      #   - #545 removes it from steady state entirely. Nothing beekeepingit
      #     does now requires the privileges of any other role, and a
      #     permanent membership in all seven `<schema>_svc` roles is exactly
      #     the cross-schema bridge ADR-0024 sets out to delete.
      #
      # The `migratorTransition` block below is therefore TEMPORARY and OFF by
      # default. It exists for one release on an already-deployed cluster:
      # migrator-adopt-job.yaml has to `ALTER ... OWNER TO <schema>_migrator`
      # relations beekeepingit currently owns, and Postgres satisfies that
      # ownership check through inherited membership — plain membership, no
      # adminOption/SET ROLE session needed (verified empirically in
      # services/shared/dbaccess/audit_immutability_test.go). beekeepingit
      # cannot grant itself that membership: Postgres requires CREATEROLE +
      # ADMIN OPTION on the target role, which a plain login role has neither
      # of, and shipping that as a `psql` retry loop once already burned a
      # live CI run to its `activeDeadlineSeconds` — see
      # TestAuditImmutability_SvcRoleGrantingSelfMembershipToOwnerFails and
      # `powersync`'s own inRoles below, which exists for the same reason.
      # Only CNPG's operator connection is privileged enough, which is why
      # this is declarative here rather than a GRANT run from a Job.
      #
      # Turning the flag back off REALLY revokes: CNPG's role reconciler
      # (internal/management/controller/roles) diffs the declared `inRoles`
      # against `pg_auth_members` and issues `REVOKE <role> FROM beekeepingit`
      # for anything dropped, so the bridge closes without a manual step.
      # Membership is one-way and inert for the migrator roles either way —
      # they never gain beekeepingit's privileges from it (Postgres role
      # membership does not flow backward).
      #
      # CAUTION verified against CNPG's own reconciler source
      # (internal/management/controller/roles/postgres.go's Update/
      # appendRoleOptions): every reconcile issues a FULL `ALTER ROLE
      # beekeepingit <every boolean attribute>`, so this entry must explicitly
      # restate every attribute beekeepingit actually needs — an omitted
      # boolean (e.g. `login`) is NOT "leave as-is", it reconciles to its
      # Postgres/Go zero-value (NOLOGIN), which would break every Job using
      # the `beekeepingit` credential. `login: true` below is therefore
      # required, not redundant. The one exception is the password: per
      # RoleConfiguration.PasswordSecret's doc ("if null, the password will be
      # ignored unless DisablePassword is set") and confirmed in
      # roles.go's DatabaseRoleFromConfiguration, omitting `passwordSecret`
      # (as below) safely leaves beekeepingit's existing password — the
      # `{{ include "postgres.fullname" . }}-app` Secret the remaining Jobs
      # authenticate with — untouched.
      #
      # `beekeepingit` already exists (created by bootstrap.initdb.owner
      # above, not by this managed.roles list) — CNPG reconciles managed.roles
      # by role NAME against actual Postgres state, not by "who created it",
      # so listing an already-existing role here is supported and simply
      # extends what is reconciled for it (confirmed: CNPG's own docs example
      # lists `app`, its default initdb-owner role name, in
      # `status.managedRolesStatus.reconciled` alongside user-defined roles —
      # cloudnative-pg.io/documentation/current/declarative_role_management).
      - name: beekeepingit
        ensure: present
        login: true
        {{- if .Values.migratorTransition.enabled }}
        inRoles:
          {{- range .Values.schemas }}
          - {{ . }}_migrator
          {{- end }}
        {{- end }}
      # One combined role for the PowerSync service: `replication` to open a
      # logical-replication connection to `beekeepingit` (the `powersync`
      # publication above), and it also owns/uses `powersync_storage` (granted
      # by templates/schema-grants-job.yaml, since that DB is created — at
      # postInitSQL time, above — before this role exists). No isolation
      # benefit to splitting these into two roles; one process uses both.
      - name: powersync
        ensure: present
        login: true
        replication: true
        # Member of each synced schema's owning service role, so it inherits
        # SELECT on those tables for the initial replication snapshot — they're
        # owned by the least-privilege per-service `*_svc` roles, which neither
        # the app owner nor a non-superuser can GRANT on (#23 deploy).
        inRoles:
          {{- range .Values.syncedSchemas }}
          - {{ . }}_svc
          {{- end }}
        passwordSecret:
          name: powersync-credentials
{{- end }}
