# Defaults for standalone `helm template`/`helm lint` of this subchart in
# isolation. When installed as part of the umbrella, these are overridden by the
# `postgres:` key in the parent's values.yaml/environments/*.yaml.
enabled: true

# CNPG's own maintained PostGIS operand image (cloudnative-pg/postgis-containers).
image: ghcr.io/cloudnative-pg/postgis:18.4-3.6.4-system-trixie
instances: 1
storageSize: 1Gi
resourceTier: medium

# One-shot switch for the #545 ownership transition on an ALREADY-DEPLOYED
# cluster. Default OFF, and it must stay off in steady state — everything it
# turns on is a temporary weakening of the isolation #545 exists to create.
#
# When true, two things happen together (they are useless apart):
#   - templates/migrator-adopt-job.yaml renders (hook weight 1), moving every
#     relation in each schema from `beekeepingit` to `<schema>_migrator` and
#     re-establishing the runtime ACLs under the new owner, one transaction
#     per schema.
#   - cluster.yaml gives `beekeepingit` `inRoles: [<schema>_migrator, ...]`,
#     which is the ONLY way that Job can `ALTER ... OWNER TO` a role it is not
#     — Postgres satisfies the ownership check through inherited membership,
#     and a plain login role cannot GRANT itself membership (proven in
#     services/shared/dbaccess/audit_immutability_test.go's
#     TestAuditImmutability_SvcRoleGrantingSelfMembershipToOwnerFails).
#
# So DURING a transition release `beekeepingit` is a member of every migrator
# role, i.e. the cross-schema reach #545 removes is briefly back. Per-schema
# isolation is a STEADY-STATE property, not an every-instant one — see
# docs/adr/0024-per-schema-migrator-roles.md, which states this plainly rather
# than pretending the transition is free.
#
# Turning it back off genuinely removes the memberships: CNPG's
# `UpdateMembership` issues a REVOKE for any role dropped from `inRoles`, so
# no manual cleanup step is owed. Fresh installs never need this at all — the
# migrate Job creates every table AS `<schema>_migrator`, so there is nothing
# to adopt. Runbook: infra/README.md, "Transitioning an existing cluster".
migratorTransition:
  enabled: false

# One schema per future domain service (docs/architecture/data-model.md §4) —
# D-6 "schema per service", provisioned ahead of the services that will own
# them. Each schema gets TWO login roles and TWO credentials Secrets (#545):
# `<schema>_migrator`, which owns every relation in that schema and is the
# credential the deploy-time migrate Job uses, and `<schema>_svc`, the runtime
# role, which owns nothing and holds DML only.
schemas:
  - identity
  - organizations
  - apiaries
  - activities
  - journeys
  - todos
  - ai

# Schemas whose tables are streamed to devices via the `powersync` publication
# (walking-skeleton.md §5.3, sync.md §3.2). Deliberately a SUBSET of `schemas`
# — non-synced schemas (identity, ai, …) stay out of PowerSync's replication so
# its bucket storage never shadows them. Grows as syncable services land.
# activities (#39): the client declares a local `activities` table and expects
# to sync it down (client/lib/core/sync/powersync_schema.dart), so its rows
# must replicate — otherwise an offline-created activity never reconciles to
# other devices, breaking #39's offline AC (FR-OF-1). Adding it here puts the
# activities schema in the `powersync` publication and makes the powersync
# role a member of activities_svc (cluster.yaml managed.roles inRoles).
# journeys (#45): same rationale — the client declares local `journeys`/
# `journey_plan_items` tables (client/lib/core/sync/powersync_schema.dart)
# so a journey created/edited offline (FR-OF-1) reconciles across devices.
# todos (#50): same rationale — the client declares a local `todos` table
# (client/lib/core/sync/powersync_schema.dart) and needs it replicated for
# FR-OF-1. NOTE (operational, not a code/CI concern): the publication itself
# is created ONCE, at cluster bootstrap, by `postInitApplicationSQL`'s
# `CREATE PUBLICATION ... FOR TABLES IN SCHEMA` (cluster.yaml) — adding a
# schema here only takes effect on a FRESH cluster bootstrap. An
# already-bootstrapped/running cluster needs a one-time
# `ALTER PUBLICATION powersync ADD TABLES IN SCHEMA todos;` run by hand
# (the `powersync` role's membership in `todos_svc` below, by contrast, IS
# continuously reconciled by CNPG's managed.roles, so that half self-heals).
# Not blocking for CI/merge — the dev cluster is torn down/rebuilt via
# infra/cluster scripts, which re-bootstraps from scratch.
syncedSchemas:
  - apiaries
  - organizations
  - activities
  - journeys
  - todos

# The append-only history tables (history.md §7.1, FR-HIS-1) — ONE list for
# every schema, because the history mechanism is deliberately uniform across
# schemas (history.md §5): each service keeps its own `audit_log` and
# `sync_conflict_log` inside its own schema, same shape everywhere. Rendered
# into `postgres.runtimeGrantsPsqlArgs` (_helpers.tpl), which both
# table-grants-job.yaml and the gated migrator-adopt-job.yaml apply, so this is
# the single place the classification lives.
#
# This list is FAIL-CLOSED (#553): a table whose name ends `_log` that is not
# listed here FAILS the release at deploy time, by name, inside the same
# transaction as the blanket DML grant — it never becomes mutable, not even on
# the failed release. So adding a history table to a service means adding its
# name here in the same change; forgetting produces a loud deploy failure, not
# a silently mutable audit trail. A domain table must simply not take the
# `_log` suffix — it is reserved for append-only history.
historyTables:
  - audit_log
  - sync_conflict_log

# Placeholder for standalone rendering only — the umbrella always injects the
# real global.* via its own values.yaml.
global:
  namespace: beekeepingit
  resources:
    medium:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
