{{/*
`beekeepingit-authentik-config` — the Secret the Authentik server/worker read via
`authentik.existingSecret.secretName` (set on the Flux HelmRelease). Carries the
server secret key, the bootstrap admin identity (seeded on first boot), and the
bundled-Postgres connection (host/name/user/password/port as AUTHENTIK_POSTGRESQL__*
env keys). Values are generated/persisted by the shared helper (see _helpers.tpl).
The Postgres host is the Service the bundled chart creates under the pinned
`releaseName: authentik` → `authentik-postgresql`.
*/}}
{{- if .Values.enabled }}
{{- include "authentik.secrets" . }}
{{- $gen := .Values.__authentikGenerated }}
apiVersion: v1
kind: Secret
metadata:
  name: beekeepingit-authentik-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "beekeepingit.labels" . | nindent 4 }}
    app.kubernetes.io/name: authentik
type: Opaque
stringData:
  AUTHENTIK_SECRET_KEY: {{ $gen.secretKey | quote }}
  AUTHENTIK_BOOTSTRAP_PASSWORD: {{ $gen.bootstrapPassword | quote }}
  AUTHENTIK_BOOTSTRAP_TOKEN: {{ $gen.bootstrapToken | quote }}
  AUTHENTIK_BOOTSTRAP_EMAIL: {{ .Values.bootstrapEmail | quote }}
  AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: {{ $gen.pgPassword | quote }}
  AUTHENTIK_POSTGRESQL__PORT: "5432"
  {{- /*
  Outbound email (SMTP), #361 (NFR-SEC-1). The upstream chart mounts EVERY key of
  this Secret as env on both the server and the worker (envFrom.secretRef via
  authentik.existingSecret), so adding AUTHENTIK_EMAIL__* here wires Authentik's
  global email connection with zero changes to the external HelmRelease.
  Non-secret connection values come from values.yaml (per-environment
  overridable; dev/CI point at the Mailpit sink subchart). Username/password are
  deliberately NOT values (no secrets in git): when a real relay needs
  authentication, ops create the out-of-band Secret
  `beekeepingit-authentik-email-credentials` (keys: username, password) in the
  target namespace, and the next render merges it in via `lookup` — same
  cluster-state-not-git idiom as the generated credentials above. Mailpit needs
  no auth, so dev/CI simply never create that Secret.
  */}}
  {{- with .Values.email }}
  AUTHENTIK_EMAIL__HOST: {{ .host | quote }}
  AUTHENTIK_EMAIL__PORT: {{ .port | quote }}
  {{- /*
  Sender identity (#648). `fromName`/`fromAddress` replaced a single `from:` in this
  chart's values; an overlay still setting the old key would otherwise be silently
  ignored and ship the DEFAULT sender to a real relay, so the rename fails loudly
  instead. (The environments/*.yaml overlays in this repo were updated with the
  rename; this catches the ones that are not in this repo.)
  */}}
  {{- if .from }}
  {{- fail "authentik.email.from was replaced by authentik.email.fromName + authentik.email.fromAddress (#648) — update the overlay; leaving `from` set would silently ship the default sender." }}
  {{- end }}
  {{- /*
  The display name goes into an RFC 5322 header, so it may not carry a character that
  restructures one. Not an attack path — `fromName` is operator config from a values file,
  never user input — but the failure modes are both quiet and both remote from the edit:
  a CR/LF survives Helm's `quote` (emitted as `\n`, decoded back to a real newline in
  `stringData`, carried into the env), where Django's `forbid_multi_line_headers` then
  raises `BadHeaderError` and every verification mail stops — an outage discovered by a
  user who never gets their link. A comma, `<`, `>`, `;`, `:` or `"` in an UNQUOTED display
  name is the likelier one: it silently reshapes the address list rather than erroring.
  Rejecting at render time keeps the discovery here, in the diff, rather than in the mail
  log. (Reviewer finding, #648.)
  */}}
  {{- if regexMatch "[\r\n,<>;:\"]" (toString .fromName) }}
  {{- fail (printf "authentik.email.fromName %q contains a character that is not legal unquoted in an RFC 5322 display name (CR, LF, or one of , < > ; : \") — it would reshape or break the From header." .fromName) }}
  {{- end }}
  AUTHENTIK_EMAIL__FROM: {{ printf "%s <%s>" (required "authentik.email.fromName must be set (#648)" .fromName) (required "authentik.email.fromAddress must be set — a placeholder until #417 provisions a real relay/domain" .fromAddress) | quote }}
  AUTHENTIK_EMAIL__USE_TLS: {{ .useTls | quote }}
  AUTHENTIK_EMAIL__USE_SSL: {{ .useSsl | quote }}
  AUTHENTIK_EMAIL__TIMEOUT: {{ .timeout | quote }}
  {{- /*
  Template-override search dir (#648) — see values.yaml. Set explicitly rather than
  relying on Authentik's default so the value the ConfigMap mount has to match is
  stated in one place this repo owns.
  */}}
  AUTHENTIK_EMAIL__TEMPLATE_DIR: {{ required "authentik.email.templateDir must be set (#648) — an empty value makes Django's template DIRS [\"\"], resolved against the process CWD, and the branded email template silently never loads" .templateDir | quote }}
  {{- end }}
  {{- $emailCreds := lookup "v1" "Secret" .Values.global.namespace "beekeepingit-authentik-email-credentials" }}
  {{- if $emailCreds }}
  AUTHENTIK_EMAIL__USERNAME: {{ index $emailCreds.data "username" | b64dec | quote }}
  AUTHENTIK_EMAIL__PASSWORD: {{ index $emailCreds.data "password" | b64dec | quote }}
  {{- end }}
  {{- /*
  Google federation credentials, #363 (NFR-SEC-1). Exact same
  cluster-state-not-git idiom as the SMTP relay credentials above: ops create
  the out-of-band Secret `beekeepingit-authentik-google-credentials` (keys:
  client-id, client-secret) in the target namespace and the next render merges
  it in via `lookup`. Nothing about Google is a value, and nothing is in git.

  Why they land HERE and not in the blueprint ConfigMap: the blueprint is
  rendered into a ConfigMap, and a ConfigMap is not a Secret — interpolating a
  client secret there would make it readable to anything in the namespace and
  visible in `helm get manifest`. Instead the upstream chart env-mounts every
  key of THIS Secret on the server and the worker, and the blueprint's own
  `!Env` tag reads them inside the worker at import time. The blueprint entry
  is gated on the same two variables, so a cluster without them skips the
  source entirely and still deploys cleanly (see the blueprint's comments for
  why that matters — an invalid entry invalidates the WHOLE blueprint).

  Setup steps (Google Cloud OAuth client, the exact redirect URI authentik
  expects, creating the Secret): infra/README.md.
  */}}
  {{- $googleCreds := lookup "v1" "Secret" .Values.global.namespace "beekeepingit-authentik-google-credentials" }}
  {{- if $googleCreds }}
  BEEKEEPINGIT_GOOGLE_CLIENT_ID: {{ index $googleCreds.data "client-id" | b64dec | quote }}
  BEEKEEPINGIT_GOOGLE_CLIENT_SECRET: {{ index $googleCreds.data "client-secret" | b64dec | quote }}
  {{- end }}
  {{- /*
  Dev/CI federation stand-in (#363) — NOT a credential, just the on/off flag the
  blueprint's stand-in entry gates on. Enabled only in environments/dev.yaml.
  */}}
  {{- if .Values.federationStub.enabled }}
  BEEKEEPINGIT_FEDERATION_STUB_ENABLED: "true"
  {{- end }}
{{- end }}
