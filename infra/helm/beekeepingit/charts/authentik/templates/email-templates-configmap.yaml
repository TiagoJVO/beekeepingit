{{/*
`beekeepingit-authentik-email-templates` — the BeekeepingIT-branded Django templates for
Authentik's outbound flow email (#648, FR-ONB-1, FR-UX-1, NFR-SEC-1).

Same shape as the blueprint ConfigMap next door: this chart owns no workload (Authentik is
an external Flux HelmRelease — ADR-0012/ADR-0016), so it ships the CONTENT and the external
release mounts it. Since #858 it does: `beekeepingit-gitops`'s
`apps/<env>/authentik-helmrelease.yaml` declares this ConfigMap under the upstream chart's
`global.volumes`/`global.volumeMounts`, which that chart concatenates into BOTH the server
and the worker deployment — the worker is what actually sends, the server renders previews.

Keys are FLAT (`account_confirmation.html`) but the file must land at `email/…` inside the
directory named by `AUTHENTIK_EMAIL__TEMPLATE_DIR` (templates/config-secret.yaml, `/templates`),
because Django resolves it by the name the email stage asks for
(`email/account_confirmation.html`). A ConfigMap key cannot contain `/`, so the mount goes one
directory DEEPER — `mountPath: /templates/email` — and every flat key lands at `email/<key>`
with no `items:`/`path:` list to keep in sync. That is why a second template is shipped by
dropping a file in `files/email/` and nothing in the other repo has to change.

`/templates` is therefore a cross-repo contract, and `scripts/check-authentik-brand-posture.sh`
pins the value for that reason. Getting the mount wrong is silent in the safe direction: the
built-in template keeps rendering, so mail still goes out, just unbranded. Verify with a
captured mail, not with a running pod.

`.Files.Glob` rather than a hardcoded list so a second template (a future password-reset or
notification mail) is shipped by dropping the file in `files/email/`, with no template edit.
`AsConfig` renders the whole glob as `key: |`-style data entries keyed by BASE NAME, which is
exactly the flat-key shape above.
*/}}
{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: beekeepingit-authentik-email-templates
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "beekeepingit.labels" . | nindent 4 }}
    app.kubernetes.io/name: authentik
data:
  {{- (.Files.Glob "files/email/*.html").AsConfig | nindent 2 }}
{{- end }}
