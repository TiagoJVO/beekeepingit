      sources: []

  # === Federated account resolution (#364, FR-ONB-1, FR-TEN-1, NFR-SEC-1, D-7) =
  #
  # THE ONE PLACE that decides which local account an upstream identity may
  # reach. #363 shipped federation with `user_matching_mode: identifier`, which
  # links ONLY on a connection that already exists — so "Continue with Google"
  # worked only for someone who had first connected Google from authentik's own
  # "Connected services" page. This closes that, WITHOUT reintroducing the
  # unverified-email link that #363 deliberately refused (the #170 shape).
  #
  # ---------------------------------------------------------------------------
  # HOW IT PLUGS IN (authentik 2026.5.4, source-verified)
  # ---------------------------------------------------------------------------
  # `SourceFlowManager.__init__` builds `user_properties` through
  # `SourceMapper.build_object_properties`, which starts from the source type's
  # `get_base_user_properties(info=...)` and then MERGES each attached user
  # property mapping over it (`MERGE_LIST_UNIQUE`, mappings ordered by name),
  # finally dropping every None-valued key (`delete_none_values`). Then
  # `SourceMatcher.get_action` runs, in this order:
  #   1. a UserSourceConnection for (source, identifier) exists -> Action.AUTH.
  #      `identifier` is the upstream's stable SUBJECT (Google: the `id` from
  #      its userinfo; the stand-in: `sub`). So a once-linked account is reached
  #      by SUBJECT ALONE — the email plays no part, which is exactly why an
  #      upstream address change never loses the account (#364 AC1/AC5).
  #   2. otherwise, with `user_matching_mode: username_link`, it requires
  #      `properties["username"]` to be non-empty — MISSING/EMPTY IS
  #      Action.DENY, not enroll — and matches `User.objects.filter(
  #      username__exact=...)`.
  #
  # So this mapping is the resolver: it REPLACES `username` with the local
  # account it resolved, or sets it to None so the whole attempt is DENIED.
  # `username` (not `email`) because it is the only matchable property authentik
  # declares UNIQUE — `matching_objects.first()` can therefore never pick an
  # arbitrary account out of several, which `email_link` demonstrably can (this
  # deployment ALLOWS duplicate emails by design, auth.md §8.11).
  #
  # ---------------------------------------------------------------------------
  # WHY THIS IS NOT #363's REFUSED `email_link`
  # ---------------------------------------------------------------------------
  # `email_link` matches the RAW upstream email straight out of
  # `get_base_user_properties`. For Google that value is unverified —
  # `GoogleType.get_base_user_properties` returns only {email, name} and DROPS
  # the verification flag. The correction #363 could not make (it never needed
  # the raw payload) is that the flag is NOT gone: `get_base_user_properties`
  # drops it, but the FULL upstream payload is handed to property mappings as
  # `info`. Google's configured `profile_url`
  # (https://www.googleapis.com/oauth2/v1/userinfo — hardcoded on GoogleType,
  # not customizable) returns `verified_email`; an OIDC upstream returns
  # `email_verified`. This mapping reads them itself, STRICTLY: only a JSON
  # `true` counts. A string "true", a missing key, junk -> refuse.
  #
  # ---------------------------------------------------------------------------
  # FAIL CLOSED, EVERY BRANCH
  # ---------------------------------------------------------------------------
  #   * upstream verification flag not strictly True -> DENY
  #   * no usable email in the payload -> DENY
  #   * zero candidate accounts -> ENROLL (#365): the one deliberately open
  #     branch. A GENERATED, collision-checked username is returned — a value
  #     matching no local account, which under `username_link` is
  #     Action.ENROLL, never a link — together with every property the
  #     source-enrollment flow below may write. See that flow's section
  #     comment for the full design; the absurd uuid collision fails closed.
  #   * MORE THAN ONE candidate -> DENY. Never guess; duplicate emails exist.
  #   * the candidate has not itself proven inbox control locally
  #     (`attributes.email_verified is True`, #361) -> DENY. This keeps #361's
  #     invariant ("no session before inbox control") true on the federated path
  #     too — #363's argument for it (federation was only reachable AFTER a
  #     password login) stops holding the moment this mapping links a stranger.
  #     It also makes email squatting harmless rather than a denial-of-service:
  #     an unverified account registered at a victim address is not a candidate,
  #     so it cannot make the victim ambiguous.
  #   * inactive / superuser / service accounts are never candidates. The
  #     superuser exclusion is deliberate blast-radius reduction: ops accounts
  #     link deliberately via Connected services, never by an inbound match.
  #   * ANY exception -> DENY. A raising property mapping propagates out of
  #     `SourceFlowManager.__init__` (mapper.py re-raises
  #     PropertyMappingExpressionException) and would 500 the callback, so the
  #     whole body is guarded.
  # The mapping ALWAYS returns a dict containing `username` — never None and
  # never {}: `iter_eval` skips a None return and `build_object_properties`
  # skips a falsy one, either of which would leave the source type's own
  # (upstream-controlled) `username` standing.
  #
  # DENY is the single outcome for every refusal on purpose: it leaks no
  # account-existence oracle (an ambiguous address, an unverified candidate
  # and a superuser are indistinguishable) and renders authentik's own
  # AccessDeniedResponse rather than #363's raw 400. Since #365 an UNKNOWN
  # verified address is no longer a refusal at all — it enrolls — so the
  # oracle surface shifts accordingly: a deny now implies "exists but is not
  # reachable this way", which is inherent to opening registration (the same
  # signal #366's duplicate-username rejection already leaks) and was accepted
  # with it.
  #
  # KNOWN-EMAIL HISTORY (`attributes.known_emails`). Written ONLY by
  # `beekeepingit-mark-email-verified` above, at the one moment inbox control is
  # proven for an address; read here. It is what reunites a returning user whose
  # CURRENT address has since changed with their existing account. Its scope is
  # honest and bounded: it holds addresses this deployment itself saw verified —
  # it can never learn an upstream address we have never seen, and it is not a
  # way to guess.
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    id: mapping-federation-account-link
    identifiers: { name: "BeekeepingIT Source Mapping: federated account resolution" }
    attrs:
      name: "BeekeepingIT Source Mapping: federated account resolution"
      expression: |
        from authentik.core.models import User, UserTypes

        # Addresses are compared case-insensitively and length-bounded (RFC 5321
        # caps a path at 256 and a full address at 320 octets). Since #365 this
        # value is not only a lookup key but the EMAIL PERSISTED on a new
        # account, so the shape check is structural rather than "contains @".
        MAX_ADDRESS_LENGTH = 320
        # Display names are upstream-controlled and land on the created account
        # (#365). Bounded and stripped of non-printable characters — control,
        # bidi-override and zero-width codepoints are all `not isprintable()`
        # — so a Google profile name cannot render as somebody else's in any
        # member list. Cosmetic-impersonation defense in depth; it grants no
        # authority either way (roles are app-side, NFR-ROL-1).
        MAX_NAME_LENGTH = 128

        try:
            payload = info if isinstance(info, dict) else {}

            # The upstream's OWN verification signal. `email_verified` is the
            # OIDC claim; `verified_email` is what Google's v1 userinfo (the
            # endpoint GoogleType hardcodes) returns. Strictly boolean True.
            verified = payload.get("email_verified")
            if verified is None:
                verified = payload.get("verified_email")
            if verified is not True:
                return {"username": None}

            address = payload.get("email")
            if not isinstance(address, str):
                return {"username": None}
            address = address.strip().lower()
            if len(address) > MAX_ADDRESS_LENGTH or address.count("@") != 1:
                return {"username": None}
            local_part, _, domain_part = address.partition("@")
            if not local_part or not domain_part:
                return {"username": None}
            if not address.isprintable() or any(ch.isspace() for ch in address):
                return {"username": None}

            candidates = {}
            # `is_superuser` is NOT a column on User — it is a PROPERTY derived
            # from group membership (core/models.py: `all_groups().filter(
            # is_superuser=True).exists()`; the column lives on Group). Passing
            # it to `.filter()` raises FieldError, which the blanket `except`
            # below would swallow into "deny everyone" — silently disabling this
            # whole feature while every negative test still passed. Found live.
            # The superuser test is therefore applied to the MATCHED INSTANCE
            # further down, where the property works — and that spelling is also
            # the more correct one, since the property honours superuser
            # inherited through PARENT groups, which a flat
            # `ak_groups__is_superuser` exclusion would miss.
            reachable = User.objects.filter(is_active=True).exclude(
                type__in=[UserTypes.SERVICE_ACCOUNT, UserTypes.INTERNAL_SERVICE_ACCOUNT]
            )

            # (a) the account's CURRENT address.
            for candidate in reachable.filter(email__iexact=address):
                if (candidate.email or "").strip().lower() == address:
                    candidates[candidate.pk] = candidate

            # (b) an address this account previously PROVED inbox control of.
            # The JSONB containment query narrows; the Python check below is
            # what actually decides, so a looser lookup can never widen the
            # match. NOTE the narrowing is real in one direction: Postgres `@>`
            # is CASE-SENSITIVE, so a history entry stored in mixed case would
            # never be reached. Entries are lowercase by construction — the
            # stamp policy is the only writer and normalizes — and the seeded
            # ones above are lowercase for the same reason. Keep it that way.
            for candidate in reachable.filter(attributes__known_emails__contains=[address]):
                history = (candidate.attributes or {}).get("known_emails")
                if not isinstance(history, list):
                    continue
                for entry in history:
                    if isinstance(entry, str) and entry.strip().lower() == address:
                        candidates[candidate.pk] = candidate
                        break

            if len(candidates) == 0:
                # --- #365: self-service registration via the upstream ------
                # A strictly-verified address nobody holds locally ENROLLS.
                # The generated username is the enroll signal AND the takeover
                # guard: under `username_link` a value matching no account is
                # Action.ENROLL, while a colliding value would silently LINK —
                # so non-existence is proven, and the absurd uuid collision
                # fails closed like every other branch. The returned dict also
                # authors EVERYTHING the source-enrollment flow's user_write
                # may persist; nothing upstream-controlled survives the merge
                # (this mapping is the source's only one, guard-enforced).
                from uuid import uuid4

                display_name = payload.get("name")
                if not isinstance(display_name, str):
                    display_name = ""
                display_name = "".join(
                    ch for ch in display_name if ch.isprintable()
                ).strip()[:MAX_NAME_LENGTH]
                if not display_name:
                    display_name = address
                for _attempt in range(3):
                    generated = "federated-" + uuid4().hex
                    if not User.objects.filter(username__exact=generated).exists():
                        return {
                            "username": generated,
                            "email": address,
                            "name": display_name,
                            "attributes": {
                                # sub_mode=user_upn: this becomes the OIDC
                                # `sub` — assigned at creation, the same
                                # forward-requirement #366's upn policy
                                # satisfies for password enrollment.
                                "upn": str(uuid4()),
                                # Carried from the upstream's strict boolean
                                # (checked above). The second, deliberate
                                # writer of this attribute (#365 decision);
                                # known_emails is NOT seeded — #361's stamp
                                # policy stays its only writer.
                                "email_verified": True,
                            },
                        }
                return {"username": None}
            if len(candidates) != 1:
                return {"username": None}
            matched = list(candidates.values())[0]

            # Blast radius: an upstream address must never reach a privileged
            # account. Applied HERE, on the instance, because `is_superuser` is
            # a computed property rather than a column (see the note on the
            # `reachable` query above). Narrowing after the match rather than
            # before it is also strictly safer: a superuser SHARING the address
            # now makes the match ambiguous — two candidates — and ambiguity
            # already denies, where excluding them up front would have quietly
            # linked the other account.
            if matched.is_superuser:
                return {"username": None}

            # The account must itself have proven inbox control (#361).
            if (matched.attributes or {}).get("email_verified", False) is not True:
                return {"username": None}

            # The value handed back must identify EXACTLY this account. Django
            # declares `username` unique, so this is an invariant check, not a
            # search — it is the assumption the whole design rests on, so it is
            # asserted rather than trusted.
            if not matched.username:
                return {"username": None}
            if User.objects.filter(username__exact=matched.username).count() != 1:
                return {"username": None}
            return {"username": matched.username}
        except Exception:
            # Never raise: see FAIL CLOSED above.
            return {"username": None}

  # === Self-service registration via a federation source (#365, FR-ONB-1/2/3,
  # === FR-AU-1, FR-TEN-1, NFR-SEC-1, D-7, D-3) ================================
  #
  # #364 closed "reach an EXISTING account"; this opens "create a NEW one": an
  # upstream identity whose strictly-verified address matches no local account
  # now ENROLLS instead of being denied. The resolver above authors the entire
  # payload (generated username, normalized email, fresh `attributes.upn`,
  # `attributes.email_verified: true` from the upstream's strict boolean);
  # this flow is the write path for it, and nothing else.
  #
  # DESIGN, in three properties:
  #   * NO PROMPT STAGE. Every written property is resolver-authored and
  #     arrives via the plan's prompt_data (the documented user_write
  #     contract, the same channel #366's upn policy uses). A registrant
  #     types nothing; Google's consent screen is the only interaction.
  #   * TWO GATES keep the flow unreachable outside a federated sign-in:
  #       1. an SSO-only policy on the FLOW (the upstream
  #          default-source-enrollment idiom, `return ak_is_sso_flow`): a
  #          browser walking straight into
  #          /if/flow/beekeepingit-source-enrollment/ is denied at plan time
  #          — e2e-pinned in client/e2e/tests/federation.spec.ts;
  #       2. a guard policy on the user_write BINDING re-checks the plan
  #          carries a resolver-shaped payload (non-empty username/email, an
  #          assigned upn, email_verified strictly True) and SKIPS the write
  #          otherwise — the same failure_result mechanics #366's upn policy
  #          relies on, and the same outcome: no account is created, so there
  #          is no pending user for the login stage to seat and enrollment
  #          simply fails. Fail closed, never a half-formed account. The
  #          guard's refusals are probe-asserted directly (the real flow
  #          cannot produce a malformed plan to drive it with).
  #   * NO EMAIL STAGE. The address arrived verified or the resolver denied
  #     the whole attempt — that genuine upstream signal is exactly what #365
  #     was gated on (D-7 amendment, D-3's org-creation precondition). The
  #     `email_verified` stamp here is the SECOND writer of that attribute
  #     (#361's restored-token policy is the first) — a deliberate,
  #     user-confirmed #365 decision: #364 already trusts the same signal for
  #     the STRONGER operation of linking into an existing verified account.
  #     `known_emails` is NOT seeded — it records addresses THIS deployment
  #     proved, and its single writer stays #361's stamp policy.
  #
  # Write-safety unchanged: the source AUTHENTICATION flow still has no
  # user_write stage, so a RETURNING federated login can never overwrite
  # email/upn/email_verified — enrollment writes exactly once, at creation.
  # The flow manager appends its own post-source stage, which persists the
  # UserSourceConnection: every later sign-in resolves on the SUBJECT.
  #
  # Verified by: scripts/check-federation-source-posture.sh (static — every
  # source references THIS flow by !KeyOf, a policy binding gates it),
  # infra/ci/authentik-federation-probe.py (live — a real enrollment driven
  # end to end, created account shape asserted), federation.spec.ts (browser —
  # the direct-entry denial).
  - model: authentik_flows.flow
    id: flow-source-enrollment
    identifiers: { slug: beekeepingit-source-enrollment }
    attrs:
      name: beekeepingit-source-enrollment
      # Untranslated DB string, like the other flow titles above.
      title: Create your account
      designation: enrollment
      # An already-authenticated user has no business re-enrolling; a signed-in
      # user connects a source via Connected services instead (auth.md §8.13).
      authentication: require_unauthenticated
  - model: authentik_policies_expression.expressionpolicy
    id: policy-source-enrollment-sso-only
    identifiers: { name: beekeepingit-source-enrollment-sso-only }
    attrs:
      name: beekeepingit-source-enrollment-sso-only
      expression: |
        # Only a flow planned by a SourceFlowManager — an in-progress
        # federated sign-in — may enter. A raising policy evaluates to the
        # binding's default failure_result (false) -> denied: fail closed.
        return ak_is_sso_flow
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-source-enrollment-sso-only
      target: !KeyOf flow-source-enrollment
      order: 0
  - model: authentik_stages_user_write.userwritestage
    id: stage-source-enrollment-user-write
    identifiers: { name: beekeepingit-source-enrollment-user-write }
    attrs:
      name: beekeepingit-source-enrollment-user-write
      user_creation_mode: always_create
      # Active immediately — unlike #366 there is no verification leg to hold
      # the account for: an unverified upstream address never reaches this
      # flow at all (the resolver denies the attempt outright).
      create_users_as_inactive: false
  # The write guard — gate 2 of the section comment. Read-only on purpose: it
  # asserts, never repairs. A missing upn or verification stamp here means the
  # resolver did not author this plan, and creating an account anyway is
  # exactly the half-formed outcome to refuse.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-source-enrollment-write-guard
    identifiers: { name: beekeepingit-source-enrollment-write-guard }
    attrs:
      name: beekeepingit-source-enrollment-write-guard
      expression: |
        flow_plan = request.context.get("flow_plan")
        if not flow_plan:
            return False
        prompt_data = flow_plan.context.get("prompt_data")
        if not isinstance(prompt_data, dict):
            return False
        username = prompt_data.get("username")
        if not isinstance(username, str) or not username:
            return False
        address = prompt_data.get("email")
        if not isinstance(address, str) or "@" not in address:
            return False
        attributes = prompt_data.get("attributes")
        if not isinstance(attributes, dict):
            return False
        if attributes.get("email_verified") is not True:
            return False
        upn = attributes.get("upn")
        if not isinstance(upn, str) or not upn:
            return False
        return True
  - model: authentik_flows.flowstagebinding
    id: binding-source-enrollment-user-write
    identifiers:
      target: !KeyOf flow-source-enrollment
      stage: !KeyOf stage-source-enrollment-user-write
      order: 20
    attrs:
      # Stage-time evaluation (same flags/rationale as the #361/#366 bindings
      # above): prompt_data exists only once the flow manager planned it.
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-source-enrollment-write-guard
      target: !KeyOf binding-source-enrollment-user-write
      order: 0
  # REUSED default login stage, like #366's enrollment — session behavior
  # matches a normal login (auth.md §8.11).
  - model: authentik_flows.flowstagebinding
    id: binding-source-enrollment-user-login
    identifiers:
      target: !KeyOf flow-source-enrollment
      stage:
        !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100

  # === Source AUTHENTICATION flow, owned HERE (#594, NFR-TST-1, NFR-SEC-1) ====
  #
  # The flow a RETURNING federated identity is signed in through — the sibling
  # of the enrollment flow above, and now owned by this file for the same
  # reason.
  #
  # WHY THIS IS NOT `!Find [authentik_flows.flow, [slug,
  # default-source-authentication]]` ANY MORE (#594). That spelling was a
  # cross-blueprint dependency with NO ordering guarantee, and it failed
  # SILENTLY:
  #   * authentik's own defaults are ordinary blueprint FILES
  #     (`/blueprints/default/flow-default-source-authentication.yaml`),
  #     discovered by the same `blueprints_discovery` pass as this one, and each
  #     is applied by a SEPARATE ASYNC actor
  #     (`apply_blueprint.send_with_options`, blueprints/v1/tasks.py). Nothing
  #     orders theirs before ours — on a fresh cluster the default files'
  #     `last_applied` timestamps are interleaved and spread over minutes.
  #   * `Find.resolve` (blueprints/v1/common.py) returns `None` when the query
  #     matches nothing — no exception, no log line — and the entry still
  #     validates, because `authentication_flow` is an OPTIONAL FK. The source
  #     was then created with a NULL authentication flow, PERMANENTLY: authentik
  #     skips the re-apply while the file hash is unchanged, so nothing ever
  #     repaired it for that cluster's life.
  #   * The only outward symptom was `handle_auth` 400ing with "Configured flow
  #     does not exist." on the next federated sign-in — two steps from the
  #     cause. It red-lit `helm-e2e` on unrelated PRs (#594).
  # Owning the flow REMOVES the dependency rather than re-ordering it, and
  # `!KeyOf` is the loud spelling: it resolves against ids in THIS file, in file
  # order, and RAISES `EntryInvalidError` if the referenced entry is missing or
  # failed to apply — which marks the BlueprintInstance ERROR (and, since
  # `last_applied_hash` is only stored on success, gets retried) instead of
  # quietly shipping a half-wired source. Same reasoning as #365's
  # `enrollment_flow`.
  #
  # It is a faithful copy of upstream's `default-source-authentication` — on
  # purpose, so the write-safety property #363/#364/#365 lean on is unchanged,
  # and now OURS to pin:
  #   * exactly ONE `user_login` stage and nothing else. NO `user_write` stage,
  #     which is what guarantees a RETURNING federated login can never overwrite
  #     the local user's `email`, `attributes.upn` (the app-facing `sub`) or
  #     `attributes.email_verified`. Enrollment writes exactly once, through the
  #     guarded flow above.
  #   * `authentication: require_unauthenticated` plus an `ak_is_sso_flow` gate,
  #     exactly as upstream sets them: reachable only from inside a
  #     SourceFlowManager-planned sign-in, never by a browser walking into
  #     /if/flow/beekeepingit-source-authentication/.
  # The login stage is owned here too, for the same reason the flow is — an
  # upstream-owned stage reached by `!Find` would put the very race this fixes
  # back into the fix. It carries no attrs, so it is behaviourally identical to
  # the stage upstream creates with none (`session_duration: seconds=0`, i.e. a
  # session cookie): the SSO session a federated login creates stays the same
  # session object shape a password login creates.
  #
  # Verified by: scripts/check-federation-source-posture.sh (static — every
  # source references THIS flow by `!KeyOf`, and the flow carries its login
  # stage, its SSO gate and NO other stage), and
  # infra/ci/authentik-federation-probe.py (live — the deployed source points at
  # this flow, the flow's only stage is a user_login, and one sign-in is driven
  # through it end to end).
  - model: authentik_flows.flow
    id: flow-source-authentication
    identifiers: { slug: beekeepingit-source-authentication }
    attrs:
      name: beekeepingit-source-authentication
      # Untranslated DB string, like the other flow titles in this file.
      title: Signing you in
      designation: authentication
      # An already-authenticated user does not re-enter this flow; a signed-in
      # user connects a source via Connected services instead (auth.md §8.13).
      authentication: require_unauthenticated
  - model: authentik_policies_expression.expressionpolicy
    id: policy-source-authentication-sso-only
    identifiers: { name: beekeepingit-source-authentication-sso-only }
    attrs:
      name: beekeepingit-source-authentication-sso-only
      expression: |
        # Only a flow planned by a SourceFlowManager — an in-progress
        # federated sign-in — may enter. A raising policy evaluates to the
        # binding's default failure_result (false) -> denied: fail closed.
        return ak_is_sso_flow
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-source-authentication-sso-only
      target: !KeyOf flow-source-authentication
      order: 0
  - model: authentik_stages_user_login.userloginstage
    id: stage-source-authentication-login
    identifiers: { name: beekeepingit-source-authentication-login }
    attrs:
      name: beekeepingit-source-authentication-login
  - model: authentik_flows.flowstagebinding
    id: binding-source-authentication-login
    identifiers:
      target: !KeyOf flow-source-authentication
      stage: !KeyOf stage-source-authentication-login
      order: 0

  # === Google federation (#363, FR-ONB-1, FR-TEN-1, NFR-SEC-1, D-7, D-18) =====
  #
  # Google is added as an UPSTREAM federation source on Authentik. Domain
  # services are untouched: a federated login still resolves to a LOCAL
  # authentik user, and the provider still mints the same standard OIDC token
  # from OUR issuer with `sub` = that user's `attributes.upn` (sub_mode:
  # user_upn). That token invariance IS D-7's IdP-agnostic boundary
  # (auth.md §3.1) — see auth.md §8.13.
  #
  # ---------------------------------------------------------------------------
  # CREDENTIALS: not in git, and not in a ConfigMap either (NFR-SEC-1)
  # ---------------------------------------------------------------------------
  # The Google OAuth client id/secret arrive as PROCESS ENVIRONMENT via the
  # blueprint's own `!Env` tag, resolved by the authentik worker at import time
  # (blueprints/v1/common.py `class Env` — `getenv(key) or default`). They are
  # NOT Helm-interpolated: this file is rendered into a ConfigMap
  # (templates/blueprint-configmap.yaml), and a ConfigMap is not a Secret — a
  # `lookup`-interpolated client secret would be world-readable in-namespace and
  # visible in `helm get manifest`. Instead templates/config-secret.yaml merges
  # the out-of-band Secret `beekeepingit-authentik-google-credentials` (keys:
  # client-id, client-secret) into `beekeepingit-authentik-config` via `lookup`
  # — the exact cluster-state-not-git idiom #361 uses for the SMTP relay
  # credentials — and the upstream chart env-mounts every key of that Secret on
  # the server and the worker. Ops steps: infra/README.md.
  #
  # ---------------------------------------------------------------------------
  # WHY `conditions:` RATHER THAN A HELM `if` (this is load-bearing)
  # ---------------------------------------------------------------------------
  # `BlueprintEntry.conditions` are evaluated by `Importer._validate_single`
  # BEFORE the model is resolved or the serializer runs — an entry whose
  # conditions are falsy is skipped outright ("One or more conditions of this
  # entry are not fulfilled, skipping" -> `return None` -> `continue`). Two
  # consequences, both required:
  #   1. A cluster with no Google credentials deploys CLEANLY. `consumer_key` /
  #      `consumer_secret` are plain TextFields with no blank=True, so a rendered
  #      entry with empty credentials would raise a ValidationError — and one
  #      invalid entry marks the WHOLE blueprint invalid, so NOTHING in this file
  #      would apply (the PR #414 failure mode: OIDC discovery 404s forever).
  #   2. `OAuthSourceSerializer.validate` performs LIVE OUTBOUND HTTP for a
  #      `google` source — it falls back to the GoogleType's own
  #      `oidc_well_known_url`/`oidc_jwks_url` class constants even when this
  #      file sets neither, and fetches accounts.google.com + googleapis.com at
  #      apply time. Skipping the entry skips that fetch, so dev/CI bring-up
  #      never depends on Google being reachable.
  # Because the condition lives in the blueprint (not in Helm), THIS FILE STAYS
  # STATIC — `helm template` renders it byte-for-byte, which is what makes the
  # offline assertions in scripts/check-federation-source-posture.sh possible.
  #
  # ---------------------------------------------------------------------------
  # ACCOUNT POSTURE: identity keys on the provider's stable SUBJECT — never on
  # the email — and self-service registration is OPEN (#365), through exactly
  # one guarded flow
  # ---------------------------------------------------------------------------
  #   * `enrollment_flow: !KeyOf flow-source-enrollment` (#365). From #363
  #     until #365 this was deliberately absent — `handle_enroll` then 400s
  #     before `_prepare_flow`, so an unknown identity created no rows; that
  #     posture is preserved in git history. Now an unknown identity whose
  #     upstream address is STRICTLY verified enrolls through the dedicated
  #     flow above (resolver-authored properties only, SSO-gated, write
  #     guarded); everything else still creates NO User row and NO connection
  #     row, because the resolver withholds the username and the matcher
  #     DENIES.
  #   * `user_matching_mode: username_link` (#364): read as "match on the
  #     account key the resolver returns", never "trust the upstream's
  #     username". A once-linked identity resolves on its stored
  #     `UserSourceConnection.identifier` — the upstream's stable subject —
  #     before any property is consulted. `email_link` is REJECTED and must
  #     not be set here: at 2026.5.4 `sources/oauth/types/google.py`
  #     `get_base_user_properties` returns ONLY `{"email", "name"}` — Google's
  #     `verified_email` is dropped — so `email_link` would link an existing
  #     local account to an UNVERIFIED upstream address. That is the #170
  #     account-takeover shape the resolver exists to refuse.
  #   * Linking an EXISTING account: inbound via the resolver (#364 — exactly
  #     one local, active, non-superuser, locally-verified account claiming
  #     the strictly-verified upstream address, by current email or
  #     known-email history), or deliberately via authentik's native
  #     "Connected services" page (`/if/user/#/settings;page-sources`, the
  #     app's OIDC_ACCOUNT_URL target — auth.md §7), which requires a
  #     completed, #361-gated password login. Neither path adds an email
  #     stage to the source-authentication flow: on the inbound path the
  #     resolver already demanded proof on BOTH sides.
  #   * `authentication_flow: !KeyOf flow-source-authentication` (#594) — the
  #     faithful copy of upstream's `default-source-authentication` defined in
  #     this file, NOT an `!Find` at upstream's slug. It must be set:
  #     `handle_auth` passes it straight to `_prepare_flow`, which 400s with
  #     "Configured flow does not exist." when it is null — and `!Find` yielded
  #     exactly that null, silently, whenever this file happened to apply before
  #     authentik's own default blueprints (see that flow's section comment).
  #     It contains only a user_login stage (at order **0**) and the
  #     `ak_is_sso_flow` guard. It has NO user_write stage, which is the
  #     property that guarantees Google can never overwrite the local user's
  #     `email`, `attributes.upn` (the app-facing `sub`) or
  #     `attributes.email_verified`.
  - model: authentik_sources_oauth.oauthsource
    id: source-google
    conditions:
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_ID, ""]
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_SECRET, ""]
    identifiers: { slug: google }
    attrs:
      # `name` feeds the rendered button: the identification stage builds
      # `UILoginButton(name=self.name, ...)` and the web UI labels the button
      # "Continue with {name}" — so this is "Google", NOT "Continue with
      # Google". It is a DB string, so authentik applies no gettext lookup to
      # it; the surrounding "Continue with …" template IS localized, but only
      # into the web catalogs authentik ships, which at 2026.5.4 include pt-BR
      # and NOT pt-PT — the same limitation class as the enrollment prompts
      # (auth.md §8.11) and tracked with them in #412. The app's OWN button is
      # fully EN/PT via gen-l10n.
      name: Google
      slug: google
      enabled: true
      # Prominent block button rather than a small icon beside the password
      # form (drops the icon, shows the label text, sorts first).
      promoted: true
      provider_type: google
      # GoogleType hardcodes authorization/token/profile/jwks URLs and is NOT
      # `urls_customizable`, so setting them here would be dead config.
      # ALWAYS give `!Env` a two-element [VAR, default] form. authentik's `Env`
      # tag constructor reads `node.value[1]` unconditionally for a sequence
      # node, so the one-element `!Env [VAR]` spelling raises IndexError while
      # the file is being PARSED — which kills `blueprints_discovery` for the
      # whole file (no BlueprintInstance row is created at all, so nothing even
      # reports the file as invalid; the only symptom is OIDC discovery 404ing
      # forever, the PR #414 shape again). Found the hard way by this PR's
      # first CI run. `scripts/check-federation-source-posture.sh` now fails on
      # any single-element `!Env`.
      consumer_key: !Env [BEEKEEPINGIT_GOOGLE_CLIENT_ID, ""]
      consumer_secret: !Env [BEEKEEPINGIT_GOOGLE_CLIENT_SECRET, ""]
      # #364: read `username_link` as "match on the account key the resolver
      # returns", NOT as "trust Google's username" — Google sends none at all.
      # The mapping below is what supplies (or withholds) that value; without
      # it this source DENIES every unlinked login. See its section comment.
      user_matching_mode: username_link
      user_property_mappings: [!KeyOf mapping-federation-account-link]
      # #594: the source-authentication flow this file OWNS, by `!KeyOf` — an
      # `!Find` at upstream's `default-source-authentication` slug raced
      # authentik's own default blueprints and landed NULL, silently.
      authentication_flow: !KeyOf flow-source-authentication
      # #365: self-service registration via Google, through the dedicated,
      # SSO-gated flow only — see the ACCOUNT POSTURE comment above.
      enrollment_flow: !KeyOf flow-source-enrollment

  # --- Dev/CI federation stand-in (#363, NFR-TST-1) ---------------------------
  # A live e2e against real Google is not automatable (consent screen + bot
  # detection) and must never run in CI. This generic `openidconnect` source
  # exercises the SAME federation code path as Google — same source model, same
  # `OAuthRedirect` view, same `SourceFlowManager`, same matching mode, same
  # enrollment flow (#365) — so the wiring below (hint policy -> redirect stage
  # -> source redirect -> upstream authorize request) is genuinely proven in CI
  # rather than only asserted on paper. Only the upstream differs.
  #
  # Gated on BEEKEEPINGIT_FEDERATION_STUB_ENABLED, set from
  # `authentik.federationStub.enabled` (dev/CI true; staging/prod leave it
  # unset) — not on credentials, since there are none to hold.
  #
  # `openidconnect` IS `urls_customizable`, so all three URLs come from here.
  # With BOTH `oidc_well_known_url` AND `oidc_jwks_url` left empty,
  # `OAuthSourceSerializer.validate` makes ZERO outbound HTTP calls at apply
  # time (verified at 2026.5.4) — the stand-in is hermetic, unlike a `google`
  # entry. JWKS is only the id_token FALLBACK when the userinfo endpoint answers
  # nothing, so leaving it empty is safe for the outbound half this proves.
  #
  # The three URLs deliberately point at authentik's OWN liveness endpoint: a
  # reachable, side-effect-free URL on a host the e2e's host-map already
  # resolves. The spec asserts the outbound REQUEST to it carries the correct
  # OAuth parameters (client_id / redirect_uri / scope / state) — the complete
  # proof of the outbound half of the flow. It asserts the request rather than
  # the landing page on purpose: this endpoint answers 204, and a browser does
  # not commit a navigation to a 204, so asserting on the resulting URL is
  # asserting on undefined behaviour (it went flaky exactly that way on this
  # PR's first CI run). Nothing answers a token exchange, and nothing is meant
  # to: completing an upstream login needs a real upstream, which is the manual
  # verification checklist in infra/README.md.
  - model: authentik_sources_oauth.oauthsource
    id: source-federation-stub
    conditions:
      - !Env [BEEKEEPINGIT_FEDERATION_STUB_ENABLED, ""]
    identifiers: { slug: federation-stub }
    attrs:
      name: Stand-in IdP
      slug: federation-stub
      enabled: true
      promoted: true
      provider_type: openidconnect
      # Not credentials: no upstream ever validates these and no token exchange
      # is reached. They exist only because the serializer requires both fields
      # to be non-blank.
      consumer_key: beekeepingit-federation-stub
      consumer_secret: !Env [BEEKEEPINGIT_FEDERATION_STUB_CLIENT_SECRET, unused]
      authorization_url: "{{ .Values.federationStub.upstreamUrl }}"
      access_token_url: "{{ .Values.federationStub.upstreamUrl }}"
      profile_url: "{{ .Values.federationStub.upstreamUrl }}"
      # Identical posture to the Google source above — that is the whole point.
      # Note this source type DOES emit a `username` of its own (from the
      # upstream's `nickname`/`preferred_username`), so unlike Google it would
      # NOT fail closed if the resolver were ever detached — which is precisely
      # why scripts/check-federation-source-posture.sh asserts the attachment
      # rather than relying on the source type to be defensive for us.
      user_matching_mode: username_link
      user_property_mappings: [!KeyOf mapping-federation-account-link]
      # #594: identical to the Google source — the owned flow, by `!KeyOf`.
      authentication_flow: !KeyOf flow-source-authentication
      # #365: identical enrollment posture to the Google source — the probe
      # drives a real enrollment through this stand-in in CI.
      enrollment_flow: !KeyOf flow-source-enrollment

  # --- One-hop "Continue with <source>" from the app (#363, D-18) -------------
  # The app's sign-in screen must offer "Continue with Google" as its OWN
  # action, and that action has to reach Google in ONE hop and come back INTO
  # the app. authentik has no IdP-hint parameter, and the source login URL
  # cannot carry the return context by itself:
  #   * `OAuthRedirect.get_redirect_url` (sources/oauth/views/redirect.py) reads
  #     NO `?next` query parameter — `request.GET` appears nowhere in that file;
  #   * `SourceFlowManager._prepare_flow` computes the post-login landing as
  #     `self.request.session.get(SESSION_KEY_GET, {}).get(NEXT_ARG_NAME,
  #     "authentik_core:if-user")` — session state, only ever written by
  #     `FlowExecutorView.dispatch`.
  # So a browser sent straight to /source/oauth/login/<slug>/ dead-ends on the
  # IdP's user page. The supported way in is to arrive through the flow executor
  # (which stores `next`) and be redirected onward from INSIDE the flow.
  #
  # That is what this does, from stock authentik pieces only:
  #   1. The app appends ONE extra parameter to the STANDARD OIDC authorize URL
  #      (`beekeepingit_idp=<source slug>`). The app therefore still knows
  #      nothing but the discovery document — no vendor URL scheme in client
  #      code, which is what oidc-integration.md §1 requires (contract: §7).
  #   2. The authorize view is unauthenticated, so `PolicyAccessView
  #      .handle_no_permission` redirects into the authentication flow with
  #      `next=self.request.get_full_path()` — the authorize path INCLUDING our
  #      parameter, and RELATIVE (which matters: the PLAN_CONTEXT_REDIRECT
  #      branch of `_flow_done` has no is_url_absolute guard) — and the executor
  #      stores it in SESSION_KEY_GET.
  #   3. The policy below reads that stored `next`, extracts the slug, and
  #      accepts it ONLY if it names an ENABLED OAuthSource (a DB whitelist, so
  #      a crafted value cannot redirect anywhere else). It then sets
  #      `redirect_stage_target`, which `RedirectStageView.get_challenge`
  #      prioritises over the stage's static target.
  #   4. The redirect stage (order 5, before identification at 10) emits an
  #      `xak-flow-redirect` challenge, which the web executor's
  #      `ak-stage-redirect` component auto-follows — one hop, no extra click.
  #   5. After the upstream returns, `SourceFlowManager` restores `next` from
  #      the same session key, so the user lands back on the pending authorize
  #      request and finishes in the app.
  #
  # REJECTED ALTERNATIVE (recorded so it isn't re-litigated): authentik's native
  # auto-redirect (`AutoRedirectController` fires when an identification stage
  # has empty `user_fields`, exactly one source and no passwordless flow) driven
  # by a SECOND OAuth2 provider whose `authentication_flow` points at such a
  # flow. It needs no policy — but a second provider means a second client_id
  # and a second per-provider issuer, so its tokens would carry the wrong
  # `aud`/`iss` for the domain services unless the admin-client-style iss/aud
  # override mapping were duplicated onto it. That is a change to the FROZEN
  # token contract plus another public client, for a UX detail. This issue must
  # not touch the token contract (D-7, oidc-integration.md §4).
  #
  # SAFETY. This binds a stage into the DEFAULT AUTHENTICATION FLOW, so a
  # mistake here would hijack every login. Four independent guards:
  #   * `evaluate_on_plan: false` + `re_evaluate_policies: true` — the policy is
  #     evaluated when the stage is REACHED, not at plan time (SESSION_KEY_GET
  #     does not exist yet at plan time: the plan is built by
  #     `handle_no_permission`, one request earlier). Identical flags and
  #     rationale to the #361 email-verification bindings above.
  #   * The policy returns False on ANY doubt — no HTTP request, no flow plan,
  #     no stored `next`, no parameter, more than one value, an unknown slug, a
  #     disabled source — and a raising expression policy evaluates to the
  #     binding's default failure_result (false). False SKIPS the stage,
  #     leaving an ordinary password login untouched.
  #   * `target_static` is a deliberately unresolvable path. It is dead config
  #     by construction (the policy always sets the override before the stage
  #     runs); if the override were ever lost the user gets a 404 and the login
  #     fails — fail closed, never a silent redirect somewhere useful.
  #   * CI proves the negative case live: the stand-in source above makes this
  #     stage REAL in dev/CI, and slice/verification/registration specs drive
  #     plain password logins through it on every run. A policy that started
  #     returning true would turn those red immediately.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-idp-hint-redirect
    identifiers: { name: beekeepingit-idp-hint-redirect }
    attrs:
      name: beekeepingit-idp-hint-redirect
      expression: |
        from urllib.parse import parse_qs, urlsplit

        from authentik.flows.planner import PLAN_CONTEXT_REDIRECT_STAGE_TARGET
        from authentik.flows.views.executor import NEXT_ARG_NAME, SESSION_KEY_GET
        from authentik.sources.oauth.models import OAuthSource

        # The parameter the app appends to the standard OIDC authorize request.
        # Contract: docs/architecture/oidc-integration.md §7.
        HINT_PARAM = "beekeepingit_idp"

        flow_plan = request.context.get("flow_plan")
        http_req = request.http_request
        if not flow_plan or not http_req:
            return False

        # Written by FlowExecutorView.dispatch from the executor's `?query=`;
        # holds a QueryDict of the ORIGINAL authorize request's parameters.
        stored_get = http_req.session.get(SESSION_KEY_GET) or {}
        next_url = stored_get.get(NEXT_ARG_NAME, "")
        if not next_url:
            return False

        hints = parse_qs(urlsplit(next_url).query).get(HINT_PARAM, [])
        if len(hints) != 1:
            return False
        slug = hints[0]

        # DB whitelist: the hint may only ever name a source this deployment
        # actually enabled. An unknown or disabled slug is not an error to
        # report, it is simply not a hint — fall through to the normal
        # identification stage.
        if not OAuthSource.objects.filter(slug=slug, enabled=True).exists():
            return False

        flow_plan.context[PLAN_CONTEXT_REDIRECT_STAGE_TARGET] = f"/source/oauth/login/{slug}/"
        return True
  - model: authentik_stages_redirect.redirectstage
    id: stage-idp-hint-redirect
    identifiers: { name: beekeepingit-idp-hint-redirect }
    attrs:
      name: beekeepingit-idp-hint-redirect
      mode: static
      # Unreachable by construction — see the SAFETY note above. The serializer
      # rejects an empty target_static when mode is static, so this cannot be
      # blank; it is never used, because the policy always sets
      # `redirect_stage_target` first.
      target_static: /source/oauth/login/-unset-/
      keep_context: true
  - model: authentik_flows.flowstagebinding
    id: binding-auth-idp-hint-redirect
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-idp-hint-redirect
      order: 5
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-idp-hint-redirect
      target: !KeyOf binding-auth-idp-hint-redirect
      order: 0

  # --- Bind the enabled sources onto the login card (#363) --------------------
  # One conditional update entry PER COMBINATION of enabled sources, because
  # `!Find` resolves to None for a source whose own entry was skipped, and a
  # None in this M2M would invalidate the entry — and with it the whole
  # blueprint. Each entry therefore carries exactly the conditions of the
  # sources it names, and they are ordered least-specific first: entries apply
  # in file order and each one REPLACES `sources` wholesale (that is the same
  # mechanism the unconditional `sources: []` reset relies on), so the
  # both-enabled entry must come last to win.
  #
  # The both-enabled case is not hypothetical: following infra/README.md's
  # "Enabling Continue with Google" steps against the dev namespace turns Google
  # on in an environment where environments/dev.yaml already enables the
  # stand-in. Without the third entry the stand-in's would apply last and
  # silently unbind the Google button while leaving its source row enabled —
  # a failure whose only symptom is a missing button (review finding).
  #
  # All entries restate
  # `user_fields` and `enrollment_flow`: `IdentificationStageSerializer`
  # cross-validates "no user fields and no source" against the entry's OWN data,
  # and omitting `user_fields` is exactly what broke the blueprint in PR #414.
  # The unconditional entry earlier in this file resets `sources: []` first, so
  # an environment that loses its credentials also loses the button.
  # NOTE: `user_fields` must stay NON-empty here. An identification stage with
  # empty `user_fields` and exactly one source triggers authentik's
  # AutoRedirectController, which would send EVERY login straight to that source
  # with no way to reach the password form.
  - model: authentik_stages_identification.identificationstage
    conditions:
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_ID, ""]
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_SECRET, ""]
    identifiers: { name: default-authentication-identification }
    attrs:
      user_fields: [email, username]
      enrollment_flow: !KeyOf flow-enrollment
      sources:
        - !Find [authentik_core.source, [slug, google]]
  - model: authentik_stages_identification.identificationstage
    conditions:
      - !Env [BEEKEEPINGIT_FEDERATION_STUB_ENABLED, ""]
    identifiers: { name: default-authentication-identification }
    attrs:
      user_fields: [email, username]
      enrollment_flow: !KeyOf flow-enrollment
      sources:
        - !Find [authentik_core.source, [slug, federation-stub]]
  # Both enabled — must be LAST, so it wins over the two single-source entries
  # above. See this section's header comment.
  - model: authentik_stages_identification.identificationstage
    conditions:
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_ID, ""]
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_SECRET, ""]
      - !Env [BEEKEEPINGIT_FEDERATION_STUB_ENABLED, ""]
    identifiers: { name: default-authentication-identification }
    attrs:
      user_fields: [email, username]
      enrollment_flow: !KeyOf flow-enrollment
      sources:
        - !Find [authentik_core.source, [slug, google]]
        - !Find [authentik_core.source, [slug, federation-stub]]
