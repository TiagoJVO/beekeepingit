version: 1
metadata:
  name: beekeepingit
  labels: { blueprints.goauthentik.io/instantiate: "true" }
entries:
  - model: authentik_core.group
    id: group-platform-operator
    identifiers: { name: platform-operator }
    attrs: { name: platform-operator }
  - model: authentik_core.user
    id: user-test-beekeeper
    identifiers: { username: test.beekeeper@beekeepingit.local }
    attrs:
      username: test.beekeeper@beekeepingit.local
      name: Test Beekeeper
      email: test.beekeeper@beekeepingit.local
      is_active: true
      path: users
      # upn: sub_mode=user_upn => sub = this UUID (devseed pins it).
      # email_verified: seeded VERIFIED (#361) — this is a dev/CI-provisioned trusted
      # account (the address isn't a real inbox), and the walking-skeleton e2e's login
      # must not detour through the verification email stage below. Seeding the
      # attribute is also the documented escape hatch for ops-provisioned accounts
      # whose address was verified out-of-band.
      attributes: { upn: "11111111-1111-4111-8111-111111111111", email_verified: true }
      # In `platform-operator` since the Authentik cut-over (#191). Since #465 this
      # membership is LOAD-BEARING for CI: it is the POSITIVE half of the
      # platform-operator claim e2e (admin-token.spec.ts asserts this user's admin
      # access token carries `platform_operator: true`). Removing it here silently
      # turns that assertion red — pair any change with the spec.
      groups: [!KeyOf group-platform-operator]
      password: dev-password123
  # Second dev/CI seed user, deliberately UNVERIFIED (#361): the verification-flow
  # e2e (client/e2e/tests/verification.spec.ts) logs in as this user, expects the
  # email stage to gate the login, completes it via the Mailpit-captured link, and
  # asserts the id_token then carries email_verified=true. No group, no org
  # membership (devseed doesn't know it) — after verifying it lands on onboarding.
  - model: authentik_core.user
    id: user-unverified-beekeeper
    identifiers: { username: unverified.beekeeper@beekeepingit.local }
    attrs:
      username: unverified.beekeeper@beekeepingit.local
      name: Unverified Beekeeper
      email: unverified.beekeeper@beekeepingit.local
      is_active: true
      path: users
      attributes: { upn: "22222222-2222-4222-8222-222222222222" }
      password: dev-password123
  # Third dev/CI seed user, deliberately NOT in `platform-operator` (#465): the
  # NEGATIVE half of the platform-operator claim e2e
  # (client/e2e/tests/admin-token.spec.ts) logs into the ADMIN app as this user
  # and asserts the minted access token carries `platform_operator: false`.
  # Seeded VERIFIED for the same reason test.beekeeper is (see above): the claim
  # spec must not detour through the email-verification stage. No group, no org
  # membership (devseed doesn't know it) — after admin login it lands on the
  # admin app's "access required" screen, which is fine: the token is already
  # persisted by then and that is all the spec reads.
  - model: authentik_core.user
    id: user-non-operator
    identifiers: { username: non.operator@beekeepingit.local }
    attrs:
      username: non.operator@beekeepingit.local
      name: Non Operator
      email: non.operator@beekeepingit.local
      is_active: true
      path: users
      attributes: { upn: "33333333-3333-4333-8333-333333333333", email_verified: true }
      password: dev-password123
  # Custom `email` scope mapping (#361, NFR-SEC-1): emits the user's GENUINE
  # verification state instead of the built-in managed mapping's hardcoded value.
  # Note the built-in hardcodes `email_verified: False` on the pinned 2026.5.4
  # (changed from `True` in Authentik 2025.10) — either constant is cosmetic; this
  # mapping reads the `email_verified` user attribute that the verification flow
  # below sets on completion. The strict `is True` check fails closed on any
  # non-boolean junk an attribute could hold.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    identifiers: { name: "BeekeepingIT OAuth Mapping: OpenID 'email' (real email_verified)" }
    attrs:
      name: "BeekeepingIT OAuth Mapping: OpenID 'email' (real email_verified)"
      scope_name: email
      description: "Email address"
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("email_verified", False) is True,
        }
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-beekeepingit
    identifiers: { name: beekeepingit-pwa }
    attrs:
      name: beekeepingit-pwa
      client_type: public
      client_id: beekeepingit-pwa
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_upn
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=15
      refresh_token_validity: days=30
      # Explicit grant types — required on Authentik 2026.5.x (defaults to [] = no grants,
      # which rejects the authorization_code flow). The PWA uses auth-code + PKCE + refresh.
      grant_types: [authorization_code, refresh_token]
      # {{ .Values.global.appOrigin }} is this environment's browser-facing app
      # origin (dev: app.beekeepingit.local:8443 via k3d's host-port mapping;
      # staging/prod: the real Ingress host, no port) — rendered via `tpl` in
      # templates/blueprint-configmap.yaml, not a plain file include.
      redirect_uris:
        - { matching_mode: regex, url: "http://localhost:.*" }
        - { matching_mode: regex, url: '{{ .Values.global.appOrigin | replace "." "\\." }}/.*' }
        # The PWA sends the bare origin (no path) as its redirect_uri, and Authentik derives
        # CORS-allowed origins from redirect_uris — an Origin has no path, so the regex above
        # (which requires "/…") never matches it. This strict entry covers redirect + CORS.
        - { matching_mode: strict, url: "{{ .Values.global.appOrigin }}" }
        # Admin-origin CORS on THIS provider's OIDC metadata (#460 — gap in #456/#449).
        # The admin app authenticates as its OWN client (beekeepingit-admin) but is pointed
        # at the beekeepingit ISSUER (VITE_OIDC_ISSUER=.../application/o/beekeepingit/) so the
        # overridden token `iss` matches what oidc-client-ts validates against. That means the
        # admin app fetches THIS application's discovery + JWKS (both under
        # /application/o/beekeepingit/) cross-origin from the admin origin. Authentik gates
        # those with CORS derived from THIS (pwa) provider's redirect_uris — the admin
        # provider's own admin-origin entry does NOT help here (different application slug) —
        # so without this the discovery fetch is CORS-blocked (net::ERR_FAILED) and admin
        # login can't even start. Never surfaced before: the admin app was unreachable until
        # #460 added its NetworkPolicy edge + the first e2e that actually drives admin login.
        # It grants the admin origin nothing beyond reading public OIDC metadata: the admin
        # code exchange runs on the admin provider (client_id=beekeepingit-admin, its own
        # strict admin-origin entry), and a bare-origin redirect target that is a first-party
        # app we already serve is not a new trust surface (same redirect+CORS duality as the
        # appOrigin entry above). Does NOT touch OIDC_AUDIENCE / the frozen token contract.
        - { matching_mode: strict, url: "{{ .Values.global.adminOrigin }}" }
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        # The custom mapping above, NOT the managed scope-email built-in — the
        # built-in's email_verified is a hardcoded constant (#361, NFR-SEC-1).
        - !KeyOf scope-email-verified
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-offline_access],
          ]
  - model: authentik_core.application
    id: app-beekeepingit
    identifiers: { slug: beekeepingit }
    attrs: { name: BeekeepingIT, slug: beekeepingit, provider: !KeyOf provider-beekeepingit }

  # --- Admin app OIDC client (#456, D-7/ADR-0016, auth.md §3.2, NFR-ROL-2, NFR-SEC-1) ---
  # The React Admin App authenticates as its OWN public client `beekeepingit-admin`
  # (Authorization Code + PKCE S256, RS256), DISTINCT from the PWA's `beekeepingit-pwa`
  # (oidc-integration.md §3). But every domain service is pinned to ONE issuer and ONE
  # audience — `OIDC_ISSUER_URL=.../application/o/beekeepingit/` and
  # `OIDC_AUDIENCE=beekeepingit-pwa`, the aud checked by CONTAINMENT (oidc-integration.md
  # §4/§6, services/servicetemplate/authn) — and that is FROZEN: admin tokens must be
  # accepted with NO services-side change.
  #
  # Why a plain second provider isn't enough (verified against Authentik 2026.5.4):
  #   - `OAuth2Provider.get_issuer` derives the per_provider `iss` from the provider's OWN
  #     application slug, and the global /authorize endpoint mints the token for whichever
  #     provider owns the request's `client_id` — so a second provider necessarily emits
  #     `iss = .../application/o/beekeepingit-admin/` and a default `aud` of its own client id.
  #   - A BACKCHANNEL provider can't serve an interactive login at all: the authorize view
  #     resolves the app via `provider.application` (the PRIMARY OneToOne), and `get_issuer`
  #     returns None without one — backchannel is for LDAP/SCIM/RAC, not OIDC discovery.
  #   - `issuer_mode: global` would move BOTH providers off the frozen per-app issuer.
  # The mechanism that works WITHOUT touching the services is a scope mapping that OVERRIDES
  # the minted `iss`/`aud`: a mapping's returned dict is merged over the token's built-in
  # fields (`IDToken.to_dict` does `id_dict.update(claims)`; `get_claims` only evaluates
  # mappings whose `scope_name` is in the requested scopes — hence `openid`, always requested).
  # `include_claims_in_id_token: true` carries the override into the access token the services
  # read. `iss` is computed from the request exactly as `get_issuer` does, so it auto-adapts
  # per environment and is byte-identical to the PWA's. Attached ONLY to the admin provider,
  # so the frozen PWA provider is untouched. The admin app's own client (oidc-client-ts) does
  # not validate id_token `iss`/`aud`, so the override is transparent to it; the strict
  # validator is go-oidc in the services, which this satisfies. See oidc-integration.md §3.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-admin-audience
    identifiers: { name: "BeekeepingIT OAuth Mapping: admin issuer+audience (beekeepingit)" }
    attrs:
      name: "BeekeepingIT OAuth Mapping: admin issuer+audience (beekeepingit)"
      # Rides the always-requested `openid` scope: get_claims only evaluates a mapping when
      # its scope_name is among the token's requested scopes (the admin app requests
      # `openid profile email`). The managed openid mapping also runs — the two merge, and
      # only this one emits iss/aud, so there is no key collision.
      scope_name: openid
      description: "Aligns admin-app token iss/aud with the beekeepingit resource"
      expression: |
        # Derive `iss` by asking the PWA provider itself — pwa.get_issuer(http_req) is the
        # SAME call the services' expected issuer comes from, so the admin token's iss tracks
        # the pwa's byte-for-byte per environment AND survives any future change to the issuer
        # URL shape (a hardcoded path would silently diverge and break only admin login).
        # `request` is a PolicyRequest; the Django HttpRequest (with build_absolute_uri) is
        # request.http_request — None outside an HTTP context. If either the request or the pwa
        # provider is missing we emit no override (fail closed: the services' strict `iss` check
        # then rejects the admin's own-issuer token rather than a wrong issuer being accepted).
        from authentik.providers.oauth2.models import OAuth2Provider

        http_req = request.http_request
        pwa = OAuth2Provider.objects.filter(client_id="beekeepingit-pwa").first()
        if not http_req or not pwa:
            return {}
        return {
            "iss": pwa.get_issuer(http_req),
            "aud": ["beekeepingit-admin", "beekeepingit-pwa"],
        }

  # --- Platform-operator claim (#465, EPIC-18 #463, NFR-SEC-1, NFR-ROL-1) ---
  # EPIC-10 built the ORGANIZATION tier (an `admin` is a member of ONE org, per
  # organizations.memberships.role — auth.md §3.3/§5.3). EPIC-18 adds the PLATFORM
  # tier above it: the app owner administers EVERY organization. That authority must
  # come from the IdP, not from anything the client says — so it is minted here as a
  # VERIFIED claim derived from the caller's real `platform-operator` group
  # membership, and the services (#466) authorize on it.
  #
  # Contract (documented in oidc-integration.md §3.2 — #466 codes against it):
  #   claim `platform_operator`, a JSON BOOLEAN, present on every token minted by the
  #   `beekeepingit-admin` provider; ABSENT means "not a platform operator".
  # Deliberately NOT reusing the `groups` array: the managed `profile` scope mapping
  # already emits `groups` on BOTH providers, so a PWA (field-app) token lists
  # `platform-operator` for a member today. Authorizing on `groups` would therefore
  # hand platform authority to field-app tokens. A distinct boolean, attached ONLY to
  # the admin provider, keeps the two unambiguous (§3.2).
  #
  # Why it cannot be spoofed or requested by the client:
  #   - The value is read from the IdP's OWN database (`request.user`'s group
  #     memberships) inside the provider's token-minting path. Nothing from the
  #     authorization request — no scope, parameter, prompt or user attribute — feeds
  #     it, so a crafted /authorize or /token request cannot change it.
  #   - It rides `openid` (always requested), NOT a bespoke scope: a client cannot
  #     opt the mapping in or out. `get_claims` only evaluates mappings whose
  #     `scope_name` is among the requested scopes — the same trick the iss/aud
  #     override uses — and `openid` is mandatory for OIDC.
  #   - Group membership itself is only assignable by an IdP operator (blueprint or
  #     the authentik admin UI); `user_write` explicitly denies `groups` writes, so
  #     neither self-service registration (#366) nor the verification flow can grant
  #     it (auth.md §8.11's write-safety boundary).
  #   - The token is RS256-signed by the provider, so the claim cannot be edited in
  #     flight; the services validate the signature before reading any claim (§6).
  # Fail-closed by construction: an unauthenticated/absent user returns False, and if
  # the expression ever raises, authentik drops the mapping's claims entirely — the
  # claim is then ABSENT, which #466 must treat as "not an operator". There is no
  # error path that yields a true value.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-platform-operator
    identifiers: { name: "BeekeepingIT OAuth Mapping: platform-operator membership" }
    attrs:
      name: "BeekeepingIT OAuth Mapping: platform-operator membership"
      # Rides the always-requested `openid` scope (see above). The managed openid
      # mapping and the iss/aud override also run on this scope; the three merge and
      # only this one emits `platform_operator`, so there is no key collision.
      scope_name: openid
      description: "Platform-operator group membership (verified, admin app only)"
      expression: |
        # Real IdP group membership — read server-side from the user's own
        # memberships, never from anything the client sent.
        user = request.user
        if not user or not user.pk:
            return {"platform_operator": False}
        # `all_groups()` is authentik's own membership accessor (direct memberships
        # plus any inherited through a parent group) — the same notion its built-in
        # `groups` claim reports, so the boolean can never disagree with it. Falls
        # back to the raw M2M if a version bump renames the helper
        # (oidc-integration.md §8 watch-list). Deliberately ITERATED rather than
        # `.filter(...).exists()`: iteration works whether the accessor returns a
        # QuerySet or a plain list, so a shape change upstream can't turn this into
        # an AttributeError. A user's group count is tiny, so the full fetch is free.
        all_groups = getattr(user, "all_groups", None)
        groups = all_groups() if all_groups else user.ak_groups.all()
        # Emitted explicitly as False (not omitted) for a non-operator: a present
        # `false` proves the mapping RAN, so the e2e's negative case distinguishes
        # "evaluated, not an operator" from "mapping silently stopped applying".
        is_operator = any(getattr(group, "name", None) == "platform-operator" for group in groups)
        return {"platform_operator": is_operator}
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-beekeepingit-admin
    identifiers: { name: beekeepingit-admin }
    attrs:
      name: beekeepingit-admin
      client_type: public
      client_id: beekeepingit-admin
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # Same shared signing key as the PWA — LOAD-BEARING, not just convenience: the iss
      # override makes admin tokens claim the beekeepingit issuer, and they only verify because
      # this provider signs with the key the beekeepingit discovery/JWKS advertises. Giving the
      # admin provider its own cert would silently break admin login (401) — keep them shared
      # (oidc-integration.md §8 watch-list).
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: user_upn
      issuer_mode: per_provider
      # MUST stay true: the access token the services read is built from the id_token's
      # claims, so the iss/aud override only reaches it when claims are included.
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=15
      # Shorter than the PWA's 30d: the admin app is ONLINE-ONLY (NFR-ROL-2) and renews via a
      # silent iframe (it doesn't request offline_access, so no refresh token is issued today),
      # but a privileged admin session shouldn't carry a 30-day offline credential if that ever
      # changes — keep the refresh window tight (security review, #456).
      refresh_token_validity: hours=8
      # Explicit grant types — Authentik 2026.5.x defaults to [] (no grants). Admin app uses
      # auth-code + PKCE; refresh_token kept for parity (admin app renews via silent iframe).
      grant_types: [authorization_code, refresh_token]
      # Admin host by convention mirrors the PWA's app host: admin.beekeepingit.local:8443 in
      # dev, {{ .Values.global.adminOrigin }} per environment. Same three-entry shape as the
      # PWA: localhost for Vite dev, a host regex, and a STRICT bare-origin so Authentik's
      # redirect_uris-derived CORS allows the admin origin (an Origin has no path, so the
      # `…/.*` regex never matches it).
      redirect_uris:
        - { matching_mode: regex, url: "http://localhost:.*" }
        - { matching_mode: regex, url: '{{ .Values.global.adminOrigin | replace "." "\\." }}/.*' }
        - { matching_mode: strict, url: "{{ .Values.global.adminOrigin }}" }
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        # Same custom real-email_verified mapping the PWA uses (#361, NFR-SEC-1) — the admin
        # app requests the `email` scope, so it must get the genuine verification state too.
        - !KeyOf scope-email-verified
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-offline_access],
          ]
        # Issuer + audience alignment (defined above) — makes admin tokens land on the
        # beekeepingit issuer with beekeepingit-pwa in aud, so the services accept them.
        - !KeyOf scope-admin-audience
        # Verified platform-operator membership (#465, defined above). ADMIN PROVIDER
        # ONLY — never attach it to `provider-beekeepingit` (the PWA): a field-app
        # token must not be able to carry platform authority. Enforced in CI by
        # scripts/check-platform-operator-mapping.sh.
        - !KeyOf scope-platform-operator
  # The admin provider needs its OWN primary application: the interactive authorize flow
  # resolves the application via `provider.application` (the PRIMARY OneToOne). Its own
  # per_provider issuer (.../application/o/beekeepingit-admin/) is never validated by anyone
  # — the admin app discovers from the beekeepingit issuer and the token's iss is overridden
  # to match it — so a second application slug here breaks nothing.
  - model: authentik_core.application
    id: app-beekeepingit-admin
    identifiers: { slug: beekeepingit-admin }
    attrs:
      {
        name: BeekeepingIT Admin,
        slug: beekeepingit-admin,
        provider: !KeyOf provider-beekeepingit-admin,
      }

  # --- White-label the login as BeekeepingIT (not authentik) so end users never see the
  # IdP's branding. Applied live via the API during #193 login re-validation; recorded here
  # so a fresh deploy matches. ---
  - model: authentik_brands.brand
    identifiers: { domain: authentik-default }
    attrs:
      branding_title: BeekeepingIT
      # branding_logo only accepts a file path (not a data URI), so the authentik wordmark is
      # hidden and replaced by a text header in CSS; the "Powered by authentik" footer is
      # removed and the app's dark/amber theme applied.
      branding_custom_css: |
        .pf-c-brand img{display:none!important}
        .pf-c-brand::after{content:'BeekeepingIT';color:#E8B979;font-size:30px;font-weight:700;font-family:'Segoe UI',Roboto,sans-serif}
        .pf-c-login__footer{display:none!important}
        :root{--ak-global--background-image:none!important}
        .pf-c-background-image,.pf-c-background-image::before{background:#1a120b!important;background-image:none!important}
        .ak-static-page,body{background:#1a120b!important}
        .pf-c-button.pf-m-primary{background:#E8B979!important;border-color:#E8B979!important;color:#1a120b!important}
  # Flow header text: "Welcome to authentik!" -> "Sign in".
  - model: authentik_flows.flow
    identifiers: { slug: default-authentication-flow }
    attrs: { title: "Sign in" }

  # --- Email verification at login (#361, NFR-SEC-1, NFR-I18N-1) ---
  # Built when accounts were exclusively invite/admin-provisioned (registration
  # disabled), so verification couldn't ride an enrollment flow — it's injected
  # into the authentication flow instead: an unverified, non-superuser login is
  # gated on an email stage (one-time link, sent to the account's address), and a
  # user_write stage right after it stamps `attributes.email_verified: true` — the
  # exact attribute the custom scope mapping above emits. Binding orders 40/45 slot
  # between the default flow's mfa-validation (30) and user-login (100). Since
  # #366 (self-service registration section below) this same gate doubles as the
  # RECOVERY path for a registration abandoned before its emailed link was used:
  # the next login attempt re-sends a fresh link. Both flows reuse these stage
  # objects — keep them generic.
  #
  # i18n (NFR-I18N-1): the subject "Account Confirmation" is deliberately the
  # exact gettext msgid from Authentik's catalogs (pt_PT: "Confirmação de Conta")
  # so it stays translatable — a custom subject string would bypass translation
  # entirely. KNOWN LIMITATION, verified in the authentik source at the pinned
  # 2026.5.4: flow-triggered mail is translated per the REQUEST's negotiated
  # language, not the recipient's saved locale — stages/email/stage.py renders
  # with language=pending_user.locale(request), and core/models.py User.locale()
  # returns request.LANGUAGE_CODE whenever a request is present (the
  # attributes.settings.locale fallback only applies to non-request sends) — and
  # pt-PT can never negotiate: Django's default LANGUAGES has no pt-pt entry (so
  # an Accept-Language: pt-PT request activates plain "pt") while authentik ships
  # a pt_PT catalog but no "pt" one. Net effect: verification emails render in
  # English today regardless of user locale; the msgid subject keeps translation
  # engaged the moment an upstream fix (or a LANGUAGES override) lands. See
  # auth.md §8.10's limitation note.
  - model: authentik_stages_email.emailstage
    id: stage-email-verification
    identifiers: { name: beekeepingit-email-verification }
    attrs:
      name: beekeepingit-email-verification
      # Connection comes from the AUTHENTIK_EMAIL__* env (templates/config-secret.yaml)
      # — dev/CI: the Mailpit sink; staging/prod: a real relay whose credentials are
      # infra configuration, never in git (NFR-SEC-1).
      use_global_settings: true
      template: email/account_confirmation.html
      subject: Account Confirmation
      token_expiry: minutes=30
      # If an account was provisioned inactive, proving inbox control activates it.
      activate_user_on_success: true
  - model: authentik_stages_user_write.userwritestage
    id: stage-email-verification-write
    identifiers: { name: beekeepingit-email-verification-write }
    attrs:
      name: beekeepingit-email-verification-write
      user_creation_mode: never_create
  # Runs the email stage only for an unverified, non-superuser pending user.
  # Superuser bypass = operator-lockout guard: a broken SMTP path must never lock
  # akadmin out of the admin UI (superusers never log into the PWA, so their
  # cosmetically-false claim is irrelevant). On a policy ERROR the binding's
  # default failure_result (false) skips the stage — the login proceeds but the
  # claim stays false: fail-closed for the claim, fail-open only for the login.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-needs-email-verification
    identifiers: { name: beekeepingit-needs-email-verification }
    attrs:
      expression: |
        flow_plan = request.context.get("flow_plan")
        if not flow_plan:
            return False
        user = flow_plan.context.get("pending_user")
        if not user or not user.pk or user.is_superuser:
            return False
        return user.attributes.get("email_verified", False) is not True
  # Marks the address verified — but ONLY when the plan carries the proof the
  # emailed one-time link was actually used: `is_restored` is the FlowToken the
  # executor restores the plan from when the link is opened, and the email stage
  # itself already denies a token/user mismatch. Without that evidence (e.g. the
  # email stage was skipped by an evaluation error) nothing is written — the
  # attribute can never be set by merely reaching this point in the flow.
  # Injecting via prompt_data is the documented user_write contract; no prompt
  # stage participates in this flow, so nothing user-supplied is merged. The
  # write is MERGED into any existing prompt_data (setdefault + key assignment),
  # never assigned over it — assignment would silently discard whatever a
  # future stage placed in the plan (review finding on #361).
  - model: authentik_policies_expression.expressionpolicy
    id: policy-mark-email-verified
    identifiers: { name: beekeepingit-mark-email-verified }
    attrs:
      expression: |
        flow_plan = request.context.get("flow_plan")
        if not flow_plan:
            return False
        user = flow_plan.context.get("pending_user")
        if not user or not user.pk or user.is_superuser:
            return False
        if user.attributes.get("email_verified", False) is True:
            return False
        restore_token = flow_plan.context.get("is_restored")
        if not restore_token or restore_token.user != user:
            return False
        prompt_data = flow_plan.context.setdefault("prompt_data", {})
        prompt_data["attributes.email_verified"] = True
        return True
  # evaluate_on_plan: false + re_evaluate_policies: true on both bindings: at plan
  # time (flow start) there is no pending_user yet — identification only sets it
  # mid-execution — so the policies must run at stage time (same flags as
  # Authentik's own conditional-stage examples).
  - model: authentik_flows.flowstagebinding
    id: binding-auth-email-verification
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-email-verification
      order: 40
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    id: binding-auth-email-verification-write
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-email-verification-write
      order: 45
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-needs-email-verification
      target: !KeyOf binding-auth-email-verification
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-mark-email-verified
      target: !KeyOf binding-auth-email-verification-write
      order: 0

  # --- Self-service email change is DISABLED (#361) — the #170 shape one layer down ---
  # A verified user re-pointing their OWN IdP email at a victim's pending
  # invitation while keeping email_verified=true is blocked one level EARLIER
  # than any reset-on-change policy could act: the default user-settings flow's
  # own validation policy (default-user-settings-authorization) rejects an email
  # change with "Not allowed to change email address." unless
  # Tenant.default_user_change_email is enabled — and on the pinned Authentik
  # 2026.5.4 that setting defaults to FALSE (authentik/tenants/models.py lines
  # 64–66). The e2e proves the rejection live (verification.spec.ts drives the
  # real flow executor and asserts the error), so a version bump that flips the
  # default goes red instead of silently opening the path.
  #
  # This file deliberately carries NO entry pinning that setting: the Tenant
  # model subclasses InternallyManagedMixin, which blueprints/v1/importer.py's
  # is_model_allowed EXCLUDES from blueprint management (verified at 2026.5.4),
  # the field does not exist on authentik_brands.brand, and no AUTHENTIK_* env
  # configures it — the version pin + the live e2e + the oidc-integration.md §8
  # watch-list ARE the pin.
  #
  # An earlier revision of this branch carried a "reset email_verified on email
  # change" expression policy on the user-settings flow's write binding
  # (upstream binding identifiers verified against
  # blueprints/default/flow-default-user-settings-flow.yaml @ version/2026.5.4
  # lines 144–148: order 100). It was removed as DEAD config: the prompt stage's
  # validation rejects any email change before the write stage could ever see a
  # different address, so the policy could never fire. If
  # default_user_change_email is EVER deliberately enabled, that reset policy
  # becomes mandatory again — recover it from git history (PR #411) and
  # re-verify the binding identifiers against the then-current version first.
  # Admin-driven email changes (admin API/UI) bypass the settings flow and do
  # NOT reset verification — an accepted operator-trust boundary (auth.md §8.10).

  # --- Self-service registration (#366, FR-ONB-1/2/3, FR-AU-1, NFR-SEC-1) ---
  # Username/email/password enrollment, config-as-code, surfaced as the login
  # page's "Need an account? Sign up." link (the identification-stage update at
  # the end of this section). The trust anchor is UNCHANGED from #361: no path
  # issues a session — and therefore no token the app or the invitation
  # accept-on-login gate would trust — before inbox control is proven via an
  # emailed one-time link.
  #
  # A fresh registration is created ACTIVE but UNVERIFIED — deliberately NOT
  # the upstream example's inactive-until-verified: an abandoned registration
  # (verification link lost or expired past its 30 minutes) self-heals through
  # the authentication flow's own email stage (order 40 above) on the next
  # login attempt, instead of dead-ending an account that can neither log in
  # (inactive) nor re-register (unique username) with no recovery flow built
  # yet (EPIC-14 #15). The security outcome is identical either way: this
  # flow's email stage (order 30 below) holds enrollment before user_login,
  # and a direct login attempt is held by the authentication flow's stage.
  #
  # Write-safety (the #170 shape at enrollment): the prompt stage's declared
  # field list IS the write boundary. The prompt serializer only admits
  # declared field_keys (verified at 2026.5.4, stages/prompt/stage.py — extra
  # JSON keys never reach prompt_data), and user_write additionally blocks
  # groups/pk writes and discards unknown keys (stages/user_write/stage.py).
  # No declared field is an `attributes.*` key, so a registrant cannot inject
  # `attributes.email_verified` (or any other attribute): the attribute is
  # only ever written by policy-mark-email-verified above, which demands the
  # restored-flow-token proof. The upn policy below also strips any
  # `attributes.email_verified` from prompt_data as defense in depth.
  #
  # Collisions (account-existence posture, #366 AC): `type: username` rejects
  # a duplicate username at the form — the existence signal this leaks is
  # Authentik's own default for that field type, accepted as-is. A duplicate
  # EMAIL is allowed (also the upstream default — no uniqueness policy is
  # added, so no NEW existence signal either): it creates a second, unrelated
  # account that can never produce a verified session without inbox control,
  # and no account linking/matching exists to merge it with the original
  # (that's #364) — registering with an existing account's address grants
  # nothing (e2e-pinned in client/e2e/tests/registration.spec.ts).
  #
  # i18n (NFR-I18N-1): prompt labels/placeholders and the flow title are DB
  # strings Authentik renders as-is (no gettext lookup), and the flow
  # executor's own UI strings ("Need an account? Sign up.", "Continue", ...)
  # translate only into the web catalogs Authentik ships — which at the
  # pinned 2026.5.4 include pt-BR but NOT pt-PT — so the registration screens
  # render in English for a pt-PT browser today: the same limitation class as
  # the verification email (auth.md §8.10/§8.11, #412; re-check on version
  # bumps). The verification email itself is the SAME stage object as
  # login-time verification (msgid subject — see its entry above).
  - model: authentik_flows.flow
    id: flow-enrollment
    identifiers: { slug: beekeepingit-enrollment }
    attrs:
      name: beekeepingit-enrollment
      # Untranslated DB string, like the authentication flow's "Sign in" above.
      title: Create your account
      designation: enrollment
      # An already-authenticated user has no business re-enrolling.
      authentication: require_unauthenticated
  - model: authentik_stages_prompt.prompt
    id: prompt-enrollment-username
    identifiers: { name: beekeepingit-enrollment-field-username }
    attrs:
      name: beekeepingit-enrollment-field-username
      field_key: username
      label: Username
      # `username` type = text + reject-duplicate-usernames (upstream default
      # behavior; see the collision note above).
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0
  - model: authentik_stages_prompt.prompt
    id: prompt-enrollment-email
    identifiers: { name: beekeepingit-enrollment-field-email }
    attrs:
      name: beekeepingit-enrollment-field-email
      field_key: email
      label: Email
      type: email
      required: true
      placeholder: Email
      placeholder_expression: false
      order: 10
  - model: authentik_stages_prompt.prompt
    id: prompt-enrollment-password
    identifiers: { name: beekeepingit-enrollment-field-password }
    attrs:
      name: beekeepingit-enrollment-field-password
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 20
  - model: authentik_stages_prompt.prompt
    id: prompt-enrollment-password-repeat
    identifiers: { name: beekeepingit-enrollment-field-password-repeat }
    attrs:
      name: beekeepingit-enrollment-field-password-repeat
      field_key: password_repeat
      label: Password (repeat)
      # Two `password`-type fields on one prompt stage triggers the stage's
      # built-in equality validation. user_write has no `password_repeat`
      # field/setter, so the value is discarded at write time — it never lands
      # in attributes (verified at 2026.5.4, stages/user_write/stage.py).
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 30
  # Length-only static rule (no composition classes, per current NIST-style
  # guidance), deterministic and offline (HIBP/zxcvbn deliberately off: no
  # external calls, no probabilistic scoring in CI). Exact strength policy is
  # EPIC-14 (#15) security-review scope — this is the sane floor, not the
  # final word.
  - model: authentik_policies_password.passwordpolicy
    id: policy-enrollment-password
    identifiers: { name: beekeepingit-enrollment-password }
    attrs:
      name: beekeepingit-enrollment-password
      password_field: password
      check_static_rules: true
      length_min: 12
      error_message: Password must be at least 12 characters long.
  - model: authentik_stages_prompt.promptstage
    id: stage-enrollment-prompt
    identifiers: { name: beekeepingit-enrollment-prompt }
    attrs:
      name: beekeepingit-enrollment-prompt
      fields:
        - !KeyOf prompt-enrollment-username
        - !KeyOf prompt-enrollment-email
        - !KeyOf prompt-enrollment-password
        - !KeyOf prompt-enrollment-password-repeat
      validation_policies:
        - !KeyOf policy-enrollment-password
  - model: authentik_stages_user_write.userwritestage
    id: stage-enrollment-user-write
    identifiers: { name: beekeepingit-enrollment-user-write }
    attrs:
      name: beekeepingit-enrollment-user-write
      user_creation_mode: always_create
      # Active-but-unverified, NOT the upstream example's inactive-until-
      # verified — see the section comment for why (login-time self-healing;
      # the session gate is the email stages, not is_active).
      create_users_as_inactive: false
  # Assigns the app-facing subject at creation: sub_mode=user_upn (provider
  # above) reads `attributes.upn`, and oidc-integration.md §4 requires every
  # self-service enrollment to assign a UUID upn per user (this policy closes
  # that forward-requirement; the seed users' pinned upns above are the
  # dev/CI analogue). Without it Authentik would silently fall back to
  # user.uuid — functional, but an admin later setting a upn would CHANGE the
  # user's sub and orphan their app identity. setdefault keeps any re-run
  # idempotent; the pop strips a hypothetical email_verified injection as
  # defense in depth (the prompt field list already makes it unreachable).
  # On a policy ERROR the binding's default failure_result (false) SKIPS
  # user_write: no user is created and enrollment fails — fail closed, never
  # a upn-less account.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-enrollment-assign-upn
    identifiers: { name: beekeepingit-enrollment-assign-upn }
    attrs:
      expression: |
        from uuid import uuid4
        flow_plan = request.context.get("flow_plan")
        if not flow_plan:
            return False
        prompt_data = flow_plan.context.setdefault("prompt_data", {})
        prompt_data.pop("attributes.email_verified", None)
        prompt_data.setdefault("attributes.upn", str(uuid4()))
        return True
  # Stage order: prompt (10) → user_write/create (20, upn policy) → email
  # verification (30, REUSED stage from #361 — safe to share across flows:
  # at 2026.5.4 each send mints a FlowToken whose identifier embeds a fresh
  # uuid4, so enrollment and login-time verification links never collide) →
  # user_write/stamp (40, REUSED stage+policy — only writes
  # `attributes.email_verified: true` on restored-flow-token proof, exactly
  # as at login) → user_login (100, REUSED default stage so session behavior
  # matches a normal login). The email stage at 30 is deliberately
  # UNCONDITIONAL (no needs-verification policy): a fresh registration is
  # unverified by definition, and if the stage were ever skipped by an
  # evaluation error the account would simply stay unverified and be held at
  # the authentication flow's own gate — fail closed either way.
  - model: authentik_flows.flowstagebinding
    id: binding-enrollment-prompt
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-enrollment-prompt
      order: 10
  - model: authentik_flows.flowstagebinding
    id: binding-enrollment-user-write
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-enrollment-user-write
      order: 20
    attrs:
      # Stage-time evaluation (same flags/rationale as the #361 bindings
      # above): at plan time prompt_data doesn't exist yet, so the upn policy
      # must run when the stage is reached.
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    id: binding-enrollment-email
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-email-verification
      order: 30
  - model: authentik_flows.flowstagebinding
    id: binding-enrollment-email-write
    identifiers:
      target: !KeyOf flow-enrollment
      stage: !KeyOf stage-email-verification-write
      order: 40
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-enrollment-assign-upn
      target: !KeyOf binding-enrollment-user-write
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-mark-email-verified
      target: !KeyOf binding-enrollment-email-write
      order: 0
  - model: authentik_flows.flowstagebinding
    id: binding-enrollment-user-login
    identifiers:
      target: !KeyOf flow-enrollment
      stage:
        !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
  # Surfaces the flow: the identification stage renders "Need an account?
  # Sign up." (inside the login card's pf-c-login__main-footer-band — NOT the
  # pf-c-login__footer the brand CSS above hides), and at 2026.5.4 the link
  # preserves the executor's stored ?next query (reverse_with_qs on
  # SESSION_KEY_GET) — so a user who arrived via the app's OIDC authorize
  # redirect flows register → emailed link → auto-login → straight back into
  # the pending authorize request and lands in the app, no dead end at the
  # IdP. `user_fields` MUST be restated here even though this entry only
  # means to add enrollment_flow: the importer validates an update entry's
  # own data, and IdentificationStageSerializer's cross-field validation
  # rejects "no user fields and no source" — omitting it marks the WHOLE
  # blueprint invalid and nothing in this file applies (found live: the CI
  # bring-up's discovery 404, PR #414). The value pins upstream's default
  # ([email, username], flow-default-authentication-flow.yaml @ 2026.5.4) —
  # re-check on version bumps (oidc-integration.md §8 watch-list).
  - model: authentik_stages_identification.identificationstage
    identifiers: { name: default-authentication-identification }
    attrs:
      user_fields: [email, username]
      enrollment_flow: !KeyOf flow-enrollment
      # Federation sources shown on the login card (#363). Deliberately EMPTY
      # here and re-set by the conditional entry at the end of this file: an
      # environment WITHOUT federation credentials must end up with no source
      # bound, including one that had them before (removing the credentials
      # Secret must actually unbind the button, not leave a dead one). The
      # conditional entry runs LATER in this file, so when credentials ARE
      # present it wins. Dropping the built-in `authentik-built-in` source is
      # safe: its `ui_login_button` returns None (core/models.py) so it renders
      # nothing, and password login comes from `user_fields` + the password
      # stage bound at order 20, NOT from this M2M (verified at 2026.5.4).
      sources: []

  # === Google federation (#363, FR-ONB-1, FR-TEN-1, NFR-SEC-1, D-7, D-18) =====
  #
  # Google is added as an UPSTREAM federation source on Authentik. Domain
  # services are untouched: a federated login still resolves to a LOCAL
  # authentik user, and the provider still mints the same standard OIDC token
  # from OUR issuer with `sub` = that user's `attributes.upn` (sub_mode:
  # user_upn). That token invariance IS D-7's IdP-agnostic boundary
  # (auth.md §3.1) — see auth.md §8.13.
  #
  # ---------------------------------------------------------------------------
  # CREDENTIALS: not in git, and not in a ConfigMap either (NFR-SEC-1)
  # ---------------------------------------------------------------------------
  # The Google OAuth client id/secret arrive as PROCESS ENVIRONMENT via the
  # blueprint's own `!Env` tag, resolved by the authentik worker at import time
  # (blueprints/v1/common.py `class Env` — `getenv(key) or default`). They are
  # NOT Helm-interpolated: this file is rendered into a ConfigMap
  # (templates/blueprint-configmap.yaml), and a ConfigMap is not a Secret — a
  # `lookup`-interpolated client secret would be world-readable in-namespace and
  # visible in `helm get manifest`. Instead templates/config-secret.yaml merges
  # the out-of-band Secret `beekeepingit-authentik-google-credentials` (keys:
  # client-id, client-secret) into `beekeepingit-authentik-config` via `lookup`
  # — the exact cluster-state-not-git idiom #361 uses for the SMTP relay
  # credentials — and the upstream chart env-mounts every key of that Secret on
  # the server and the worker. Ops steps: infra/README.md.
  #
  # ---------------------------------------------------------------------------
  # WHY `conditions:` RATHER THAN A HELM `if` (this is load-bearing)
  # ---------------------------------------------------------------------------
  # `BlueprintEntry.conditions` are evaluated by `Importer._validate_single`
  # BEFORE the model is resolved or the serializer runs — an entry whose
  # conditions are falsy is skipped outright ("One or more conditions of this
  # entry are not fulfilled, skipping" -> `return None` -> `continue`). Two
  # consequences, both required:
  #   1. A cluster with no Google credentials deploys CLEANLY. `consumer_key` /
  #      `consumer_secret` are plain TextFields with no blank=True, so a rendered
  #      entry with empty credentials would raise a ValidationError — and one
  #      invalid entry marks the WHOLE blueprint invalid, so NOTHING in this file
  #      would apply (the PR #414 failure mode: OIDC discovery 404s forever).
  #   2. `OAuthSourceSerializer.validate` performs LIVE OUTBOUND HTTP for a
  #      `google` source — it falls back to the GoogleType's own
  #      `oidc_well_known_url`/`oidc_jwks_url` class constants even when this
  #      file sets neither, and fetches accounts.google.com + googleapis.com at
  #      apply time. Skipping the entry skips that fetch, so dev/CI bring-up
  #      never depends on Google being reachable.
  # Because the condition lives in the blueprint (not in Helm), THIS FILE STAYS
  # STATIC — `helm template` renders it byte-for-byte, which is what makes the
  # offline assertions in scripts/check-federation-source-posture.sh possible.
  #
  # ---------------------------------------------------------------------------
  # ACCOUNT POSTURE: invitation-only still holds, and identity keys on the
  # provider's stable SUBJECT — never on the email
  # ---------------------------------------------------------------------------
  #   * `enrollment_flow` is DELIBERATELY ABSENT. Verified at 2026.5.4,
  #     core/sources/flow_manager.py `handle_enroll`: with no enrollment flow it
  #     returns `bad_request_message(... "Source is not configured for
  #     enrollment.")` — an HTTP 400 — BEFORE `_prepare_flow`, and the
  #     UserSourceConnection is only persisted later by PostSourceStage. So an
  #     unknown Google identity creates NO User row and NO connection row.
  #     Opening registration via Google is #365, not this issue.
  #   * `user_matching_mode: identifier` (the model default, stated explicitly
  #     because it is a security decision). Matching keys on the upstream's
  #     stable subject, stored as `UserSourceConnection.identifier`.
  #     `email_link` is REJECTED and must not be set here: at 2026.5.4
  #     `sources/oauth/types/google.py` `get_base_user_properties` returns ONLY
  #     `{"email", "name"}` — Google's `verified_email` is dropped — so
  #     `email_link` would link an existing local account to an UNVERIFIED
  #     upstream address. That is the #170 account-takeover shape. Subject-keyed
  #     linking plus a known-email history is #364.
  #   * How a user gets linked TODAY: authentik's native "Connected services"
  #     page (`/if/user/#/settings;page-sources`, already the app's
  #     OIDC_ACCOUNT_URL target — auth.md §7). `get_action` returns LINK for an
  #     ALREADY-AUTHENTICATED session, and `handle_existing_link` saves the
  #     connection. Reaching that page requires a completed password login,
  #     which is exactly what already passes the #361 email-verification gate —
  #     so a federated login is, by construction, only ever available to an
  #     account that already proved inbox control. That is why this section adds
  #     NO email stage to the source-authentication flow.
  #   * `default-source-authentication` (upstream) is used UNCHANGED as the
  #     authentication_flow. It must be set: `handle_auth` passes it straight to
  #     `_prepare_flow`, which 400s with "Configured flow does not exist." when
  #     it is null. It contains only a user_login stage (at order **0**, so
  #     there is no room to slot stages before it from a blueprint anyway —
  #     `unique_together (target, stage, order)` means an upstream binding can't
  #     be moved, and an upgrade would re-assert it) and the `ak_is_sso_flow`
  #     guard. It has NO user_write stage, which is the property that guarantees
  #     Google can never overwrite the local user's `email`, `attributes.upn`
  #     (the app-facing `sub`) or `attributes.email_verified`.
  - model: authentik_sources_oauth.oauthsource
    id: source-google
    conditions:
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_ID, ""]
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_SECRET, ""]
    identifiers: { slug: google }
    attrs:
      # `name` feeds the rendered button: the identification stage builds
      # `UILoginButton(name=self.name, ...)` and the web UI labels the button
      # "Continue with {name}" — so this is "Google", NOT "Continue with
      # Google". It is a DB string, so authentik applies no gettext lookup to
      # it; the surrounding "Continue with …" template IS localized, but only
      # into the web catalogs authentik ships, which at 2026.5.4 include pt-BR
      # and NOT pt-PT — the same limitation class as the enrollment prompts
      # (auth.md §8.11) and tracked with them in #412. The app's OWN button is
      # fully EN/PT via gen-l10n.
      name: Google
      slug: google
      enabled: true
      # Prominent block button rather than a small icon beside the password
      # form (drops the icon, shows the label text, sorts first).
      promoted: true
      provider_type: google
      # GoogleType hardcodes authorization/token/profile/jwks URLs and is NOT
      # `urls_customizable`, so setting them here would be dead config.
      # ALWAYS give `!Env` a two-element [VAR, default] form. authentik's `Env`
      # tag constructor reads `node.value[1]` unconditionally for a sequence
      # node, so the one-element `!Env [VAR]` spelling raises IndexError while
      # the file is being PARSED — which kills `blueprints_discovery` for the
      # whole file (no BlueprintInstance row is created at all, so nothing even
      # reports the file as invalid; the only symptom is OIDC discovery 404ing
      # forever, the PR #414 shape again). Found the hard way by this PR's
      # first CI run. `scripts/check-federation-source-posture.sh` now fails on
      # any single-element `!Env`.
      consumer_key: !Env [BEEKEEPINGIT_GOOGLE_CLIENT_ID, ""]
      consumer_secret: !Env [BEEKEEPINGIT_GOOGLE_CLIENT_SECRET, ""]
      user_matching_mode: identifier
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      # enrollment_flow: intentionally UNSET — see the section comment.

  # --- Dev/CI federation stand-in (#363, NFR-TST-1) ---------------------------
  # A live e2e against real Google is not automatable (consent screen + bot
  # detection) and must never run in CI. This generic `openidconnect` source
  # exercises the SAME federation code path as Google — same source model, same
  # `OAuthRedirect` view, same `SourceFlowManager`, same matching mode, same
  # absent enrollment flow — so the wiring below (hint policy -> redirect stage
  # -> source redirect -> upstream authorize request) is genuinely proven in CI
  # rather than only asserted on paper. Only the upstream differs.
  #
  # Gated on BEEKEEPINGIT_FEDERATION_STUB_ENABLED, set from
  # `authentik.federationStub.enabled` (dev/CI true; staging/prod leave it
  # unset) — not on credentials, since there are none to hold.
  #
  # `openidconnect` IS `urls_customizable`, so all three URLs come from here.
  # With BOTH `oidc_well_known_url` AND `oidc_jwks_url` left empty,
  # `OAuthSourceSerializer.validate` makes ZERO outbound HTTP calls at apply
  # time (verified at 2026.5.4) — the stand-in is hermetic, unlike a `google`
  # entry. JWKS is only the id_token FALLBACK when the userinfo endpoint answers
  # nothing, so leaving it empty is safe for the outbound half this proves.
  #
  # The three URLs deliberately point at authentik's OWN liveness endpoint: a
  # reachable, side-effect-free URL on a host the e2e's host-map already
  # resolves. The spec asserts the BROWSER LANDS THERE carrying the correct
  # OAuth parameters (client_id / redirect_uri / scope / state) — the complete
  # proof of the outbound half of the flow. Nothing answers a token exchange,
  # and nothing is meant to: completing an upstream login needs a real upstream,
  # which is the manual verification checklist in infra/README.md.
  - model: authentik_sources_oauth.oauthsource
    id: source-federation-stub
    conditions:
      - !Env [BEEKEEPINGIT_FEDERATION_STUB_ENABLED, ""]
    identifiers: { slug: federation-stub }
    attrs:
      name: Stand-in IdP
      slug: federation-stub
      enabled: true
      promoted: true
      provider_type: openidconnect
      # Not credentials: no upstream ever validates these and no token exchange
      # is reached. They exist only because the serializer requires both fields
      # to be non-blank.
      consumer_key: beekeepingit-federation-stub
      consumer_secret: !Env [BEEKEEPINGIT_FEDERATION_STUB_CLIENT_SECRET, unused]
      authorization_url: "{{ .Values.federationStub.upstreamUrl }}"
      access_token_url: "{{ .Values.federationStub.upstreamUrl }}"
      profile_url: "{{ .Values.federationStub.upstreamUrl }}"
      # Identical posture to the Google source above — that is the whole point.
      user_matching_mode: identifier
      authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
      # enrollment_flow: intentionally UNSET.

  # --- One-hop "Continue with <source>" from the app (#363, D-18) -------------
  # The app's sign-in screen must offer "Continue with Google" as its OWN
  # action, and that action has to reach Google in ONE hop and come back INTO
  # the app. authentik has no IdP-hint parameter, and the source login URL
  # cannot carry the return context by itself:
  #   * `OAuthRedirect.get_redirect_url` (sources/oauth/views/redirect.py) reads
  #     NO `?next` query parameter — `request.GET` appears nowhere in that file;
  #   * `SourceFlowManager._prepare_flow` computes the post-login landing as
  #     `self.request.session.get(SESSION_KEY_GET, {}).get(NEXT_ARG_NAME,
  #     "authentik_core:if-user")` — session state, only ever written by
  #     `FlowExecutorView.dispatch`.
  # So a browser sent straight to /source/oauth/login/<slug>/ dead-ends on the
  # IdP's user page. The supported way in is to arrive through the flow executor
  # (which stores `next`) and be redirected onward from INSIDE the flow.
  #
  # That is what this does, from stock authentik pieces only:
  #   1. The app appends ONE extra parameter to the STANDARD OIDC authorize URL
  #      (`beekeepingit_idp=<source slug>`). The app therefore still knows
  #      nothing but the discovery document — no vendor URL scheme in client
  #      code, which is what oidc-integration.md §1 requires (contract: §7).
  #   2. The authorize view is unauthenticated, so `PolicyAccessView
  #      .handle_no_permission` redirects into the authentication flow with
  #      `next=self.request.get_full_path()` — the authorize path INCLUDING our
  #      parameter, and RELATIVE (which matters: the PLAN_CONTEXT_REDIRECT
  #      branch of `_flow_done` has no is_url_absolute guard) — and the executor
  #      stores it in SESSION_KEY_GET.
  #   3. The policy below reads that stored `next`, extracts the slug, and
  #      accepts it ONLY if it names an ENABLED OAuthSource (a DB whitelist, so
  #      a crafted value cannot redirect anywhere else). It then sets
  #      `redirect_stage_target`, which `RedirectStageView.get_challenge`
  #      prioritises over the stage's static target.
  #   4. The redirect stage (order 5, before identification at 10) emits an
  #      `xak-flow-redirect` challenge, which the web executor's
  #      `ak-stage-redirect` component auto-follows — one hop, no extra click.
  #   5. After the upstream returns, `SourceFlowManager` restores `next` from
  #      the same session key, so the user lands back on the pending authorize
  #      request and finishes in the app.
  #
  # REJECTED ALTERNATIVE (recorded so it isn't re-litigated): authentik's native
  # auto-redirect (`AutoRedirectController` fires when an identification stage
  # has empty `user_fields`, exactly one source and no passwordless flow) driven
  # by a SECOND OAuth2 provider whose `authentication_flow` points at such a
  # flow. It needs no policy — but a second provider means a second client_id
  # and a second per-provider issuer, so its tokens would carry the wrong
  # `aud`/`iss` for the domain services unless the admin-client-style iss/aud
  # override mapping were duplicated onto it. That is a change to the FROZEN
  # token contract plus another public client, for a UX detail. This issue must
  # not touch the token contract (D-7, oidc-integration.md §4).
  #
  # SAFETY. This binds a stage into the DEFAULT AUTHENTICATION FLOW, so a
  # mistake here would hijack every login. Four independent guards:
  #   * `evaluate_on_plan: false` + `re_evaluate_policies: true` — the policy is
  #     evaluated when the stage is REACHED, not at plan time (SESSION_KEY_GET
  #     does not exist yet at plan time: the plan is built by
  #     `handle_no_permission`, one request earlier). Identical flags and
  #     rationale to the #361 email-verification bindings above.
  #   * The policy returns False on ANY doubt — no HTTP request, no flow plan,
  #     no stored `next`, no parameter, more than one value, an unknown slug, a
  #     disabled source — and a raising expression policy evaluates to the
  #     binding's default failure_result (false). False SKIPS the stage,
  #     leaving an ordinary password login untouched.
  #   * `target_static` is a deliberately unresolvable path. It is dead config
  #     by construction (the policy always sets the override before the stage
  #     runs); if the override were ever lost the user gets a 404 and the login
  #     fails — fail closed, never a silent redirect somewhere useful.
  #   * CI proves the negative case live: the stand-in source above makes this
  #     stage REAL in dev/CI, and slice/verification/registration specs drive
  #     plain password logins through it on every run. A policy that started
  #     returning true would turn those red immediately.
  - model: authentik_policies_expression.expressionpolicy
    id: policy-idp-hint-redirect
    identifiers: { name: beekeepingit-idp-hint-redirect }
    attrs:
      name: beekeepingit-idp-hint-redirect
      expression: |
        from urllib.parse import parse_qs, urlsplit

        from authentik.flows.planner import PLAN_CONTEXT_REDIRECT_STAGE_TARGET
        from authentik.flows.views.executor import NEXT_ARG_NAME, SESSION_KEY_GET
        from authentik.sources.oauth.models import OAuthSource

        # The parameter the app appends to the standard OIDC authorize request.
        # Contract: docs/architecture/oidc-integration.md §7.
        HINT_PARAM = "beekeepingit_idp"

        flow_plan = request.context.get("flow_plan")
        http_req = request.http_request
        if not flow_plan or not http_req:
            return False

        # Written by FlowExecutorView.dispatch from the executor's `?query=`;
        # holds a QueryDict of the ORIGINAL authorize request's parameters.
        stored_get = http_req.session.get(SESSION_KEY_GET) or {}
        next_url = stored_get.get(NEXT_ARG_NAME, "")
        if not next_url:
            return False

        hints = parse_qs(urlsplit(next_url).query).get(HINT_PARAM, [])
        if len(hints) != 1:
            return False
        slug = hints[0]

        # DB whitelist: the hint may only ever name a source this deployment
        # actually enabled. An unknown or disabled slug is not an error to
        # report, it is simply not a hint — fall through to the normal
        # identification stage.
        if not OAuthSource.objects.filter(slug=slug, enabled=True).exists():
            return False

        flow_plan.context[PLAN_CONTEXT_REDIRECT_STAGE_TARGET] = f"/source/oauth/login/{slug}/"
        return True
  - model: authentik_stages_redirect.redirectstage
    id: stage-idp-hint-redirect
    identifiers: { name: beekeepingit-idp-hint-redirect }
    attrs:
      name: beekeepingit-idp-hint-redirect
      mode: static
      # Unreachable by construction — see the SAFETY note above. The serializer
      # rejects an empty target_static when mode is static, so this cannot be
      # blank; it is never used, because the policy always sets
      # `redirect_stage_target` first.
      target_static: /source/oauth/login/-unset-/
      keep_context: true
  - model: authentik_flows.flowstagebinding
    id: binding-auth-idp-hint-redirect
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf stage-idp-hint-redirect
      order: 5
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true
  - model: authentik_policies.policybinding
    identifiers:
      policy: !KeyOf policy-idp-hint-redirect
      target: !KeyOf binding-auth-idp-hint-redirect
      order: 0

  # --- Bind the enabled sources onto the login card (#363) --------------------
  # One conditional update entry PER COMBINATION of enabled sources, because
  # `!Find` resolves to None for a source whose own entry was skipped, and a
  # None in this M2M would invalidate the entry — and with it the whole
  # blueprint. Each entry therefore carries exactly the conditions of the
  # sources it names, and they are ordered least-specific first: entries apply
  # in file order and each one REPLACES `sources` wholesale (that is the same
  # mechanism the unconditional `sources: []` reset relies on), so the
  # both-enabled entry must come last to win.
  #
  # The both-enabled case is not hypothetical: following infra/README.md's
  # "Enabling Continue with Google" steps against the dev namespace turns Google
  # on in an environment where environments/dev.yaml already enables the
  # stand-in. Without the third entry the stand-in's would apply last and
  # silently unbind the Google button while leaving its source row enabled —
  # a failure whose only symptom is a missing button (review finding).
  #
  # All entries restate
  # `user_fields` and `enrollment_flow`: `IdentificationStageSerializer`
  # cross-validates "no user fields and no source" against the entry's OWN data,
  # and omitting `user_fields` is exactly what broke the blueprint in PR #414.
  # The unconditional entry earlier in this file resets `sources: []` first, so
  # an environment that loses its credentials also loses the button.
  # NOTE: `user_fields` must stay NON-empty here. An identification stage with
  # empty `user_fields` and exactly one source triggers authentik's
  # AutoRedirectController, which would send EVERY login straight to that source
  # with no way to reach the password form.
  - model: authentik_stages_identification.identificationstage
    conditions:
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_ID, ""]
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_SECRET, ""]
    identifiers: { name: default-authentication-identification }
    attrs:
      user_fields: [email, username]
      enrollment_flow: !KeyOf flow-enrollment
      sources:
        - !Find [authentik_core.source, [slug, google]]
  - model: authentik_stages_identification.identificationstage
    conditions:
      - !Env [BEEKEEPINGIT_FEDERATION_STUB_ENABLED, ""]
    identifiers: { name: default-authentication-identification }
    attrs:
      user_fields: [email, username]
      enrollment_flow: !KeyOf flow-enrollment
      sources:
        - !Find [authentik_core.source, [slug, federation-stub]]
  # Both enabled — must be LAST, so it wins over the two single-source entries
  # above. See this section's header comment.
  - model: authentik_stages_identification.identificationstage
    conditions:
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_ID, ""]
      - !Env [BEEKEEPINGIT_GOOGLE_CLIENT_SECRET, ""]
      - !Env [BEEKEEPINGIT_FEDERATION_STUB_ENABLED, ""]
    identifiers: { name: default-authentication-identification }
    attrs:
      user_fields: [email, username]
      enrollment_flow: !KeyOf flow-enrollment
      sources:
        - !Find [authentik_core.source, [slug, google]]
        - !Find [authentik_core.source, [slug, federation-stub]]
