# --- Cache policy for the admin bundle (#677, NFR-ROL-2, NFR-PER-1) ---
#
# Nothing here sent `Cache-Control` at all before, so every browser fell back to
# HEURISTIC caching — an implementation-defined freshness guess derived from
# Last-Modified, which can hold a stale admin bundle for an unbounded window
# after a release. That is the same gap #621 closed for the client bundle, but
# the ANSWER here is deliberately different, and the difference is the point.
#
# #621 served the WHOLE client bundle `no-cache`, because `flutter build web`
# emits ZERO content-hashed filenames (main.dart.js, flutter_bootstrap.js,
# canvaskit/*, … are stable names whose bytes change every release) — `immutable`
# there had no safe target and would pin users to a stale build. Vite is the
# opposite: `npm run build` emits `dist/assets/index-<hash>.js` and
# `dist/assets/index-<hash>.css` (verified against a real build), and
# `admin/vite.config.ts` overrides none of Vite's output naming. A new build is a
# NEW URL, so the bytes behind one of those names can never change and a year of
# `immutable` is exactly right for them. `index.html` — the unhashed document
# that NAMES them, and the SPA fallback for every client-side route — must
# revalidate, or a release would never be picked up.
#
# THIS `map` IS AT HTTP LEVEL, AND THAT IS THE ENTIRE POINT.
#
# Two values for one header is precisely the situation that tempts a
# `location ^~ /assets/ { add_header Cache-Control …; }`, and in nginx that is a
# trap: `add_header` is inherited from the enclosing level ONLY IF the current
# level declares NONE of its own, so one `add_header` inside a location CANCELS
# every server-level one. All four security headers below — nosniff,
# Referrer-Policy, X-Frame-Options and the Report-Only CSP — would silently
# vanish for every hashed asset, with `nginx -t` green and the pod Ready.
#
# The documented alternative is to re-declare all four inside that location. It
# is rejected: it turns one list of headers into two that must be kept in sync
# forever, and the failure mode of forgetting one is silent. A `map` keeps
# EXACTLY ONE place where headers are declared — the server level below — so the
# inheritance question never arises, and adding a fifth security header stays a
# one-line change. `admin/src/nginxConf.test.ts` gates both properties.
#
# Keyed on `$uri`, not `$sent_http_content_type`: the property that makes
# `immutable` safe is "this filename contains a content hash", and `/assets/` is
# exactly the prefix Vite puts hashed output under. Keying on the content type
# would mark ANY `.js`/`.css` immutable, hashed or not — the wrong criterion,
# and one that would silently start lying the day an unhashed script ships.
#
# `$uri` is the CURRENT request URI, evaluated when the header is written — i.e.
# AFTER `try_files`. So a client-side route (`/members`) or a missing asset
# internally redirects to `/index.html` and lands on `no-cache`, which is the
# safe direction: nothing can be pinned for a year by failing to exist.
map $uri $cache_control {
    default      "no-cache";
    "~^/assets/" "max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (EPIC-14 #89, NFR-SEC-1) ---
    #
    # The admin app is an online-only React SPA (D-5, NFR-ROL-2): unlike the Flutter PWA
    # client it uses NO PowerSync/wasm/SharedArrayBuffer, so it needs no COOP/COEP
    # cross-origin isolation.
    #
    # X-Content-Type-Options: stop MIME-sniffing into a more dangerous type than declared.
    add_header X-Content-Type-Options nosniff always;
    # Referrer-Policy: never leak the full URL (which can carry an OIDC `code`/`state` query
    # param mid-login) to a third-party origin; still send it same-origin for diagnostics.
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # X-Frame-Options: enforced clickjacking protection for an authenticated admin session.
    # The CSP `frame-ancestors 'none'` below is Report-Only during the first release, so this
    # is the actually-enforced anti-framing control in that window (defense in depth).
    add_header X-Frame-Options DENY always;

    # Content-Security-Policy, scoped to what this Vite/React build actually loads:
    #   - Vite emits hashed, same-origin JS/CSS bundles — `default-src 'self'`.
    #   - `script-src 'self'`: no eval, no CDN; React + oidc-client-ts run same-origin.
    #   - `style-src 'self' 'unsafe-inline'`: the stylesheet is same-origin; 'unsafe-inline'
    #     covers any runtime-injected inline styles (kept minimal).
    #   - `connect-src`: the app calls OIDC discovery/token on the auth host and the
    #     platform API on the app host. Today those are the local k3d hosts (the only real
    #     values in the repo); when a real non-local host ships, this file must become
    #     environment-templated (envsubst at container start) rather than hardcoded — same
    #     follow-up as the client's nginx.conf (#89).
    #   - `img-src 'self' data:`, `font-src 'self'`, `object-src 'none'`, `base-uri 'self'`,
    #     `frame-ancestors 'none'`: no plugins, no <base> injection, never framed.
    #
    # NOTE (rollout): shipped as Content-Security-Policy-Report-Only for the first release —
    # CI cannot exercise a real browser against the built app (no live cluster, #89), so the
    # policy is validated against a real browser (dev/staging) before flipping to the
    # enforcing `Content-Security-Policy` header (#89).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; connect-src 'self' https://auth.beekeepingit.local:8443 https://app.beekeepingit.local:8443; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # The split cache policy from the `map` above (#677), applied as ONE
    # server-level header so it is inherited by every location alongside the
    # four security headers — see that comment for why this is not a
    # `location /assets/` block.
    add_header Cache-Control $cache_control always;

    # SPA fallback: client-side routes resolve to index.html.
    #
    # NOTHING in here may be an `add_header`. This block inherits all five of
    # the server-level headers above, and a single `add_header` here would
    # cancel every one of them for every response the SPA serves (#89).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
