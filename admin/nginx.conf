server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (EPIC-14 #89, NFR-SEC-1) ---
    #
    # The admin app is an online-only React SPA (D-5, NFR-ROL-2): unlike the Flutter PWA
    # client it uses NO PowerSync/wasm/SharedArrayBuffer, so it needs no COOP/COEP
    # cross-origin isolation.
    #
    # X-Content-Type-Options: stop MIME-sniffing into a more dangerous type than declared.
    add_header X-Content-Type-Options nosniff always;
    # Referrer-Policy: never leak the full URL (which can carry an OIDC `code`/`state` query
    # param mid-login) to a third-party origin; still send it same-origin for diagnostics.
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # X-Frame-Options: enforced clickjacking protection for an authenticated admin session.
    # The CSP `frame-ancestors 'none'` below is Report-Only during the first release, so this
    # is the actually-enforced anti-framing control in that window (defense in depth).
    add_header X-Frame-Options DENY always;

    # Content-Security-Policy, scoped to what this Vite/React build actually loads:
    #   - Vite emits hashed, same-origin JS/CSS bundles — `default-src 'self'`.
    #   - `script-src 'self'`: no eval, no CDN; React + oidc-client-ts run same-origin.
    #   - `style-src 'self' 'unsafe-inline'`: the stylesheet is same-origin; 'unsafe-inline'
    #     covers any runtime-injected inline styles (kept minimal).
    #   - `connect-src`: the app calls OIDC discovery/token on the auth host and the
    #     platform API on the app host. Today those are the local k3d hosts (the only real
    #     values in the repo); when a real non-local host ships, this file must become
    #     environment-templated (envsubst at container start) rather than hardcoded — same
    #     follow-up as the client's nginx.conf (#89).
    #   - `img-src 'self' data:`, `font-src 'self'`, `object-src 'none'`, `base-uri 'self'`,
    #     `frame-ancestors 'none'`: no plugins, no <base> injection, never framed.
    #
    # NOTE (rollout): shipped as Content-Security-Policy-Report-Only for the first release —
    # CI cannot exercise a real browser against the built app (no live cluster, #89), so the
    # policy is validated against a real browser (dev/staging) before flipping to the
    # enforcing `Content-Security-Policy` header (#89).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; connect-src 'self' https://auth.beekeepingit.local:8443 https://app.beekeepingit.local:8443; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
