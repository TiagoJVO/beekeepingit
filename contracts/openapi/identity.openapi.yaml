# Identity service — client-facing REST contract.
# Profile creation + enforce completion (FR-ONB-1, #25). Profile is user-scoped, not
# org-scoped: it is read/written before any organization exists (auth.md §7,
# walking-skeleton.md §4.5), so — unlike organizations.openapi.yaml — there is no
# {orgId}-style path scoping here; the caller's identity comes entirely from the JWT.
# Stamped from ./_shared/components.openapi.yaml; conventions in
# docs/architecture/api-contracts.md.
openapi: 3.1.0
info:
  title: BeekeepingIT — Identity API
  version: 0.1.0
  description: >-
    The authenticated caller's own profile (name, email, locale). On first login the
    profile is get-or-created lazily with name/email SEEDED from the verified token
    claims; the client-side onboarding flow then completes the name if the provider
    emitted none. The email is the IdP-verified account address and is never set here.
    `profile_complete` is derived (name non-empty), never stored (FR-ONB-1).
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: /v1
    description: Served through the API gateway; major version in the path (ADR-0003).

security:
  - bearerAuth: []

tags:
  - name: Profile
    description: The authenticated caller's own user profile (FR-ONB-1).

paths:
  /profile:
    get:
      operationId: getProfile
      summary: Get (or lazily create) the caller's profile
      description: >-
        Resolves the profile for the authenticated caller (JWT `sub`). If no
        identity.users row exists yet, one is created with name/email seeded from the
        verified token claims, so a provider that supplies both completes onboarding's
        profile step immediately; a missing `name` leaves the field empty and the client
        prompts for it.
      tags: [Profile]
      responses:
        '200':
          description: The caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: './_shared/components.openapi.yaml#/components/responses/Unauthorized'
    patch:
      operationId: updateProfile
      summary: Update the caller's profile (partial)
      description: >-
        Accepts any subset of name/locale; omitted fields keep their current value.
        Always returns the full updated Profile representation. The email is owned by
        the identity provider and is rejected here with 422 `read_only` (FR-ONB-1, D-7).
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: './_shared/components.openapi.yaml#/components/responses/Unauthorized'
        '404':
          # Should not normally happen — onboarding always does a GET first,
          # which lazily creates the row (see getProfile above).
          $ref: './_shared/components.openapi.yaml#/components/responses/NotFound'
        '422':
          $ref: './_shared/components.openapi.yaml#/components/responses/UnprocessableEntity'

components:
  # bearerAuth must resolve locally for the top-level `security` name reference; the
  # canonical definition stays in _shared (single source of truth), pulled in by $ref.
  securitySchemes:
    bearerAuth:
      $ref: './_shared/components.openapi.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    Profile:
      type: object
      allOf:
        - $ref: './_shared/components.openapi.yaml#/components/schemas/Timestamps'
        - type: object
          properties:
            id:
              allOf:
                - $ref: './_shared/components.openapi.yaml#/components/schemas/Uuid'
              readOnly: true
            name:
              type: string
              maxLength: 200
            email:
              type: string
              format: email
              maxLength: 320
              readOnly: true
              description: >-
                The IdP-verified account address, carried on the token. Changed at the
                identity provider, never through this API (D-7).
            email_verified:
              type: boolean
              readOnly: true
              description: >-
                Whether the provider reports the account address as verified. Sensitive
                flows gate on this, never on the stored profile row (#170).
            locale:
              type: string
              description: >-
                BCP 47 language tag used for i18n — always `en-GB` or `pt-PT`. The app
                ships British English and European Portuguese only (D-34, #656):
                generic `en`/`pt` resolve to American/Brazilian conventions in CLDR, so
                they are neither returned nor stored (identity migration 00005 rewrote
                the rows that held them). Left as a plain string rather than an `enum`
                so that adding a locale is not a spec-breaking change.
            profile_complete:
              type: boolean
              readOnly: true
              description: Derived — true once name is non-empty. Never stored.
          required: [id, name, email, email_verified, locale, profile_complete]

    ProfileUpdate:
      type: object
      description: Partial update — any subset of fields; omitted fields are left unchanged.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        locale:
          type: string
          description: >-
            A supported BCP 47 tag (`en-GB` or `pt-PT`). A legacy or regional value of
            a supported LANGUAGE (`en`, `pt`, `pt-BR`, …) is accepted and normalized to
            the supported tag, so a client older than #656 keeps working; an
            unsupported language is a 422 with `locale`/`unsupported`.
      minProperties: 1
