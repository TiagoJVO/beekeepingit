# Dependency scanning half of the CI supply-chain story (EPIC-13 #88 / EPIC-14 #89): Dependabot
# opens a PR per update for each ecosystem below. It bumps the SHA-pinned `uses:` refs (and the
# version comment) for Actions, `go.mod`/`go.sum` for Go, and `pubspec.yaml`/`pubspec.lock` for
# the Flutter client, `package.json`/`package-lock.json` for the React admin app (#72), and
# base images for the per-service `Dockerfile`s.
#
# `commit-message.prefix` keeps PR titles Conventional-Commits-compliant so they pass the
# "PR Title Semantics" check (`ci:` for Actions, `build:` for app dependencies).
#
# `mise.toml`'s tool pins have no ecosystem here — Dependabot doesn't understand that pin
# format. They're bumped by Renovate instead (../renovate.json, #155).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "type/chore"

  # Go backend modules — the shared libraries (#85/#20) and each domain/platform
  # service (#23); every service is its own module.
  - package-ecosystem: "gomod"
    directories:
      - "/services/shared"
      - "/services/servicetemplate"
      - "/services/identity"
      - "/services/organizations"
      - "/services/apiaries"
      - "/services/sync"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "type/chore"

  # Flutter client (#21).
  - package-ecosystem: "pub"
    directory: "/client"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "type/chore"
    ignore:
      # `intl` is not ours to bump. flutter_localizations, from the pinned Flutter
      # SDK, depends on an EXACT intl version, so any bump fails `flutter pub get`
      # with "version solving failed" — the client then neither builds nor tests.
      # Dependabot cannot see an SDK-side pin, so it proposed 0.20.3 (#680), which
      # merged and broke main. Bumping it is a side effect of moving the Flutter pin
      # in mise.toml (Renovate's job, #521), never a standalone PR.
      - dependency-name: "intl"

  # React admin app (#72). Only the npm ecosystem here; the admin/ Dockerfile's base-image
  # bumps are tracked with the other Docker ecosystems (below is per-service; admin's is
  # deferred to the same follow-up that env-templates its nginx config, #89).
  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "type/chore"

  # Base images for the deployable components' Dockerfiles (#23). This list must hold
  # EVERY directory with a Dockerfile — each one publishes an image, and one left out is
  # an image whose base tag silently stops being watched. `admin`, `activities`,
  # `journeys` and `todos` were missing until 2026-09-05; admin is the reason it mattered,
  # having sat three Alpine branches behind on nginx:1.27-alpine without anything going
  # red (#719).
  #
  # This only catches a MOVED TAG. A vulnerability found inside the tag already pinned is
  # invisible here — image-rescan.yml is the timer that catches those (#718).
  - package-ecosystem: "docker"
    directories:
      - "/admin"
      - "/client"
      - "/services/activities"
      - "/services/apiaries"
      - "/services/identity"
      - "/services/journeys"
      - "/services/organizations"
      - "/services/sync"
      - "/services/todos"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "type/chore"
