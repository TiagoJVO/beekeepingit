# On-demand Scaleway Kapsule cluster operations (D-26): bring up, tear down,
# pause, or resume the staging/prod cluster from the Actions tab, running the
# SAME infra/cluster/scaleway-{up,down,scale-up,scale-down}.sh scripts used
# for manual local runs — the workflow only supplies credentials and tools, so
# the manual and CI paths can't drift.
#
# Four actions (#539):
#   - up          create the cluster (or reconcile an existing one) — the
#                 original, unchanged bring-up
#   - down        PERMANENTLY destroy the cluster, its volumes, and its Load
#                 Balancers — the original, unchanged full teardown
#   - scale-down  the routine "stop paying for compute between sessions" op:
#                 scales the node pool to 0, keeps the cluster (and every
#                 PersistentVolumeClaim) alive — nothing is destroyed
#   - scale-up    resumes a scale-down'd cluster; fails clearly if the
#                 cluster doesn't exist rather than silently creating one
#
# Secrets/variables (see infra/README.md#secrets--remote-cluster-operations for
# the full inventory + `gh secret set` commands):
#   - secrets: SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_PROJECT_ID,
#     SCW_DEFAULT_ORGANIZATION_ID, CF_API_TOKEN, CF_ZONE_ID, and (optional)
#     AUTHENTIK_EMAIL_USERNAME/AUTHENTIK_EMAIL_PASSWORD, and (#363/#364)
#     AUTHENTIK_GOOGLE_CLIENT_ID/AUTHENTIK_GOOGLE_CLIENT_SECRET. Store them scoped to
#     the gate ENVIRONMENTS (staging-gate/production-gate), not repo-wide: the
#     `run` job carries the gate environment, so `secrets.X` resolves the
#     environment copy first — and the ungated staging path then never holds
#     prod-capable credentials (use per-environment Scaleway IAM keys).
#     Repo-level secrets also work (single-maintainer fallback) but weaken
#     that separation.
#   - environment variables (non-secret, per gate environment): APP_HOST,
#     AUTH_HOST — scoped to `staging-gate`/`production-gate` so each
#     environment gets its own hostnames
#
# Gating reuses D-27's release-approval environments: staging -> `staging-gate`
# (no protection rules, runs immediately); prod -> `production-gate` (required
# reviewer) — this applies to all four actions, so a prod scale-down/scale-up
# still needs a human reviewer click. The `run` job itself carries the
# environment so ONE approval both unlocks the job and exposes the env-scoped
# variables. `down` additionally requires typing the exact cluster name into
# the `confirm` input — it PERMANENTLY deletes a real, billed cluster and its
# data — validated in the ungated `route` job so a typo fails fast, before any
# approval is spent. `scale-down` does NOT require `confirm`: it destroys
# nothing (see infra/README.md).
#
# D-26 scope guard: bringing up the prod *cluster* is allowed (empty cluster,
# no user data), but deployments stay staging-grade until DR (Q-DR) and GDPR
# export/erasure (#90) land.
name: cluster-ops

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, prod]
        required: true
        default: staging
      action:
        description: up (create) | down (DESTROY) | scale-down (pause, keeps data) | scale-up (resume)
        type: choice
        options: [up, down, scale-down, scale-up]
        required: true
        default: up
      confirm:
        description: For `down` only — type the exact cluster name (e.g. beekeepingit-staging) to confirm PERMANENT deletion
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  route:
    name: validate & route
    runs-on: ubuntu-latest
    outputs:
      gate: ${{ steps.r.outputs.gate }}
    steps:
      - name: Map environment to its approval gate; validate `down` confirmation
        id: r
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            staging) gate=staging-gate ;;
            prod) gate=production-gate ;;
            *) echo "::error::unknown environment '$ENVIRONMENT'"; exit 1 ;;
          esac
          # `type: choice` only constrains the Actions-UI dropdown, not a
          # dispatch via the REST API/`gh workflow run` — validate server-side
          # too, before any approval gate is spent.
          case "$ACTION" in
            up | down | scale-down | scale-up) ;;
            *) echo "::error::unknown action '$ACTION'"; exit 1 ;;
          esac
          cluster="beekeepingit-${ENVIRONMENT}"
          if [ "$ACTION" = "down" ] && [ "$CONFIRM" != "$cluster" ]; then
            echo "::error::'down' deletes the real, billed '$cluster' cluster — re-run with confirm=$cluster"
            exit 1
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "'$ACTION' on '$cluster' (approval gate: $gate)"

  run:
    name: ${{ inputs.action }} ${{ inputs.environment }} cluster
    needs: route
    runs-on: ubuntu-latest
    environment: ${{ needs.route.outputs.gate }}
    env:
      BK_CLUSTER_ENV: ${{ inputs.environment }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      AUTHENTIK_EMAIL_USERNAME: ${{ secrets.AUTHENTIK_EMAIL_USERNAME }}
      AUTHENTIK_EMAIL_PASSWORD: ${{ secrets.AUTHENTIK_EMAIL_PASSWORD }}
      AUTHENTIK_GOOGLE_CLIENT_ID: ${{ secrets.AUTHENTIK_GOOGLE_CLIENT_ID }}
      AUTHENTIK_GOOGLE_CLIENT_SECRET: ${{ secrets.AUTHENTIK_GOOGLE_CLIENT_SECRET }}
      APP_HOST: ${{ vars.APP_HOST }}
      AUTH_HOST: ${{ vars.AUTH_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the infra tools this job actually uses — a full `mise install`
      # would pull Flutter/Go/etc. for nothing.
      - name: Set up toolchains from mise.toml (infra tools only)
        id: mise
        continue-on-error: true
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: kubectl helm aqua:scaleway/scaleway-cli

      # Retried once. The mise setup downloads a release binary from GitHub and
      # has failed transiently in CI: release-deploy run 33490109770 lost an
      # otherwise-green rc12 build to `curl` exit 35 (TLS handshake) on a cold
      # cache, and because `open-pr` needs every publish job green, NO promotion
      # PR opened — a network blip silently cost a deploy. A `uses:` step cannot
      # use this repo's bash retry loop (see helm-e2e.yml's image import), so
      # this is the equivalent shape: attempt, tolerate the failure, attempt
      # again. A second failure fails the job, as it should.
      - name: Set up toolchains from mise.toml (infra tools only) (retry)
        if: steps.mise.outcome == 'failure'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: kubectl helm aqua:scaleway/scaleway-cli

      # flux isn't in mise.toml — same dedicated action helm-e2e.yml uses.
      - name: Install the flux CLI
        uses: fluxcd/flux2/action@16602fa989daa99762f1c6d1186ae2ad1c735815 # v2.9.3

      - name: Run scaleway-${{ inputs.action }}.sh
        env:
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          "infra/cluster/scaleway-${ACTION}.sh"
