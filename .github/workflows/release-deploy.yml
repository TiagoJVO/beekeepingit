# Release-triggered deploy pipeline (D-27, ADR-0018) — replaces the abandoned
# Flux image-automation. A published GitHub Release is a deliberate, human-decided
# promotion event, routed by its tag:
#
#   - tag contains `-rc` (e.g. v1.2.3-rc1) -> STAGING (fast, no approval gate)
#   - tag has no `-rc`  (e.g. v1.2.3)       -> PROD, gated behind the
#                                              `production-gate` GitHub Environment's
#                                              required reviewer
#
# CI builds + publishes that version's complete image set — every buildable Go
# service AND the PWA (compiled with the *target* environment's OIDC/gateway URLs,
# which are Dart compile-time constants — client/lib/core/config/app_config.dart)
# — then opens a promotion PR against the beekeepingit-gitops repo with
# GITOPS_PR_TOKEN (a fine-grained PAT scoped to that repo only). A human merges the
# PR and Flux reconciles. No standing git-write credential lives in Flux, and the
# PAT can only open a PR against the GitOps repo — it can't push to that repo's
# branch-protected `main`, nor touch this repo.
#
# That PR moves BOTH halves of the release — image tags AND the chart source ref —
# so a merge to `main` changes nothing on a live cluster; see the `open-pr` job.
#
# Gating: a single `approve` job references `environment:` (staging-gate ->
# auto-created and ungated; prod -> production-gate's required-reviewer gate), so
# a prod release takes ONE approval rather than one per service. The scan runs
# inside each publish job (build -> load -> Trivy -> push), so a failing scan
# blocks the push even after approval. `open-pr` runs only once every image is
# published.
#
# The `-gate` suffix keeps this repo's Deployments page free for the *real*
# deploy record: `staging`/`production` (no `-gate`) are left unprotected here so
# beekeepingit-gitops's notify-deploy workflow can create a deployment on THIS
# repo under that plain name when its tag-bump PR actually merges to `main` —
# the moment Flux picks up the change, not the moment this release was approved
# to publish. Without the split, the approval-gate environment and the real
# deploy-record environment would be the same name, and the Deployments page
# would show "deployed" the instant a release was approved, before the GitOps PR
# was even opened, let alone merged.
name: release-deploy

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  route:
    name: route by release tag
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.r.outputs.target }}
      environment: ${{ steps.r.outputs.environment }}
    steps:
      - name: Route -rc -> staging, otherwise prod
        id: r
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then echo "::error::release has no tag_name"; exit 1; fi
          case "$TAG" in
            *-rc*) target=staging; environment=staging-gate ;;
            *) target=prod; environment=production-gate ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "Release '$TAG' -> $target (GitHub Environment: $environment)"

  detect:
    name: detect buildable services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      has_work: ${{ steps.scan.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enumerate Go services (every Dockerfile'd Go module, excluding client)
        id: scan
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          include=""
          for dir in $(find . -type f -name Dockerfile \
            -not -path './.git/*' -not -path '*/.claude/*' -not -path '*/node_modules/*' \
            -printf '%h\n' | sed 's|^\./||' | sort -u); do
            # Go services only — the PWA is built by the build-client/publish-client
            # jobs below (it needs an environment-specific compile).
            if [ -f "$dir/go.mod" ]; then
              name="$(echo "$dir" | tr '/' '-')"
              image="ghcr.io/${owner}/beekeepingit/${name}"
              include="${include}{\"component\":\"${name}\",\"path\":\"${dir}\",\"image\":\"${image}\"},"
            fi
          done
          include="${include%,}"
          if [ -n "$include" ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"
            echo "Buildable Go services: [${include}]"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "No buildable Go services yet — nothing to release."
          fi

  # The single environment gate. staging -> `staging-gate` (auto-created, no
  # protection rules = runs immediately). prod -> `production-gate` (waits for the
  # required reviewer). Everything downstream `needs: approve`, so one approval
  # releases the whole prod publish, not one per matrixed service. Note this is
  # a *different* environment from the plain `staging`/`production` names — see
  # the file header comment for why.
  approve:
    name: approve ${{ needs.route.outputs.target }} publish
    needs: route
    runs-on: ubuntu-latest
    environment: ${{ needs.route.outputs.environment }}
    steps:
      - run: echo "Approved to publish the ${{ needs.route.outputs.target }} image set."

  publish:
    name: publish ${{ matrix.component }}
    needs: [route, detect, approve]
    if: needs.detect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains from mise.toml
        id: mise
        continue-on-error: true
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Retried once. The mise setup downloads a release binary from GitHub and
      # has failed transiently in CI: release-deploy run 33490109770 lost an
      # otherwise-green rc12 build to `curl` exit 35 (TLS handshake) on a cold
      # cache, and because `open-pr` needs every publish job green, NO promotion
      # PR opened — a network blip silently cost a deploy. A `uses:` step cannot
      # use this repo's bash retry loop (see helm-e2e.yml's image import), so
      # this is the equivalent shape: attempt, tolerate the failure, attempt
      # again. A second failure fails the job, as it should.
      - name: Set up toolchains from mise.toml (retry)
        if: steps.mise.outcome == 'failure'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Lint, test & build artifact (release can be cut from any commit)
        env:
          COMPONENT_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          task go:lint -- "$COMPONENT_PATH"
          task go:test -- "$COMPONENT_PATH"
          ( cd "$COMPONENT_PATH" && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o app . )

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image metadata (tag by release version)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Build image (load, no push — scan gates before publishing)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.path }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

      - name: Trivy image scan (blocks on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (scan passed; cache reused from the build step above)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.component }}

  publish-client:
    name: publish client (${{ needs.route.outputs.target }})
    needs: [route, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains from mise.toml
        id: mise
        continue-on-error: true
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Retried once. The mise setup downloads a release binary from GitHub and
      # has failed transiently in CI: release-deploy run 33490109770 lost an
      # otherwise-green rc12 build to `curl` exit 35 (TLS handshake) on a cold
      # cache, and because `open-pr` needs every publish job green, NO promotion
      # PR opened — a network blip silently cost a deploy. A `uses:` step cannot
      # use this repo's bash retry loop (see helm-e2e.yml's image import), so
      # this is the equivalent shape: attempt, tolerate the failure, attempt
      # again. A second failure fails the job, as it should.
      - name: Set up toolchains from mise.toml (retry)
        if: steps.mise.outcome == 'failure'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Compute image ref (ghcr requires a lowercased owner)
        id: img
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/beekeepingit/client" >> "$GITHUB_OUTPUT"

      - name: Lint, test & build the web bundle (target-env URLs baked in)
        env:
          TARGET: ${{ needs.route.outputs.target }}
        run: |
          set -euo pipefail
          # The PWA's OIDC/gateway/PowerSync URLs are Dart *compile-time* constants
          # (--dart-define), so one image can't serve every environment — the target
          # (from the release tag) picks which URLs are baked in. Keep these in sync
          # BY HAND with infra/helm/beekeepingit/environments/<env>.yaml
          # (global.appOrigin, gateway.appHost/authHost, services.oidc.issuerUrl) —
          # not derived from one source yet, but `task repo:deploy-urls`
          # (scripts/check-deploy-url-drift.sh, run by `task ci`) FAILS if the two
          # copies disagree, so drift can't ship silently (#369). prod's are placeholders
          # until a real prod domain exists (D-26); a bare (prod) release shouldn't
          # be cut until then.
          if [ "$TARGET" = "staging" ]; then
            DART_DEFINES="--dart-define=OIDC_ISSUER=https://auth.beekeepingit-rc.melargil.pt/application/o/beekeepingit/ --dart-define=GATEWAY_BASE_URL=https://beekeepingit-rc.melargil.pt --dart-define=OIDC_ACCOUNT_URL=https://auth.beekeepingit-rc.melargil.pt/if/user/#/settings --dart-define=POWERSYNC_URL=https://beekeepingit-rc.melargil.pt/sync-stream/"
          else
            DART_DEFINES="--dart-define=OIDC_ISSUER=https://auth.beekeepingit.example/application/o/beekeepingit/ --dart-define=GATEWAY_BASE_URL=https://app.beekeepingit.example --dart-define=OIDC_ACCOUNT_URL=https://auth.beekeepingit.example/if/user/#/settings --dart-define=POWERSYNC_URL=https://app.beekeepingit.example/sync-stream/"
          fi
          # $DART_DEFINES is intentionally unquoted below (word-splits into several
          # --dart-define flags), matching build-publish.yml's client build.
          task dart:l10n-check
          cd client
          flutter pub get
          dart run powersync:setup_web
          flutter analyze
          flutter test
          # shellcheck disable=SC2086
          flutter build web --release --no-web-resources-cdn $DART_DEFINES
          # Generate the app-shell precache manifest inside build/web's service
          # worker (#619). Nothing Flutter emits is content-hashed, so this is
          # what gives the worker a per-release cache key — without it the
          # deployed worker is inert and the app cannot start offline. Required
          # after EVERY `flutter build web`; scripts/check-app-shell-precache-wired.sh
          # fails the lint gate if a build site ever loses it.
          dart run tool/build_app_shell_cache.dart build/web

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image metadata (tag by release version)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Build image (load, no push — scan gates before publishing)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: client
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-client
          cache-to: type=gha,mode=max,scope=release-client

      - name: Trivy image scan (blocks on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (scan passed; cache reused from the build step above)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-client

  publish-admin:
    name: publish admin (${{ needs.route.outputs.target }})
    needs: [route, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains from mise.toml
        id: mise
        continue-on-error: true
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Retried once. The mise setup downloads a release binary from GitHub and
      # has failed transiently in CI: release-deploy run 33490109770 lost an
      # otherwise-green rc12 build to `curl` exit 35 (TLS handshake) on a cold
      # cache, and because `open-pr` needs every publish job green, NO promotion
      # PR opened — a network blip silently cost a deploy. A `uses:` step cannot
      # use this repo's bash retry loop (see helm-e2e.yml's image import), so
      # this is the equivalent shape: attempt, tolerate the failure, attempt
      # again. A second failure fails the job, as it should.
      - name: Set up toolchains from mise.toml (retry)
        if: steps.mise.outcome == 'failure'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Compute image ref (ghcr requires a lowercased owner)
        id: img
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/beekeepingit/admin" >> "$GITHUB_OUTPUT"

      - name: Lint, test & build the admin bundle (target-env URLs baked in)
        env:
          TARGET: ${{ needs.route.outputs.target }}
        run: |
          set -euo pipefail
          # The admin SPA's OIDC/API/account URLs are Vite *build-time* constants
          # (VITE_*, baked by `npm run build`), so one image can't serve every
          # environment — the target (from the release tag) picks which URLs are
          # baked in. The admin CLIENT id is constant (beekeepingit-admin, a public
          # Auth-Code+PKCE client, no secret). Keep these in sync BY HAND with
          # infra/helm/beekeepingit/environments/<env>.yaml
          # (gateway.appHost/authHost) — `task repo:deploy-urls`
          # (scripts/check-deploy-url-drift.sh, run by `task ci`) FAILS if they
          # disagree, so drift can't ship silently (#369/#449). prod's are
          # placeholders until a real prod domain exists (D-26); a bare (prod)
          # release shouldn't be cut until then.
          if [ "$TARGET" = "staging" ]; then
            export VITE_OIDC_ISSUER="https://auth.beekeepingit-rc.melargil.pt/application/o/beekeepingit/"
            export VITE_API_BASE_URL="https://beekeepingit-rc.melargil.pt"
            export VITE_ACCOUNT_URL="https://auth.beekeepingit-rc.melargil.pt/if/user/#/settings"
          else
            export VITE_OIDC_ISSUER="https://auth.beekeepingit.example/application/o/beekeepingit/"
            export VITE_API_BASE_URL="https://app.beekeepingit.example"
            export VITE_ACCOUNT_URL="https://auth.beekeepingit.example/if/user/#/settings"
          fi
          export VITE_OIDC_CLIENT_ID="beekeepingit-admin"
          cd admin
          npm ci
          npm run lint
          npm test
          npm run build

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Image metadata (tag by release version)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Build image (load, no push — scan gates before publishing)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: admin
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-admin
          cache-to: type=gha,mode=max,scope=release-admin

      - name: Trivy image scan (blocks on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (scan passed; cache reused from the build step above)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-admin

  open-pr:
    name: open tag-bump PR (${{ needs.route.outputs.target }})
    needs: [route, detect, publish, publish-client, publish-admin]
    runs-on: ubuntu-latest
    steps:
      # Check out the GitOps repo (not this one) with the fine-grained PAT so the
      # PR branch can be pushed there. Token scoped to contents+PR write on
      # beekeepingit-gitops only (D-27); it cannot merge (branch-protected main).
      - name: Check out beekeepingit-gitops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TiagoJVO/beekeepingit-gitops
          token: ${{ secrets.GITOPS_PR_TOKEN }}

      # Promotes both halves of the release: the component image tags in `apps/`,
      # and the chart source's `ref.tag` in `clusters/`. One `sed` covers both
      # because `tag:` is the key in each — and the sibling `beekeepingit-gitops`
      # source keeps `ref.branch` (it must stay on main, or the GitOps repo could no
      # longer update itself), so this expression cannot match it. The guard turns an
      # unconverted cluster file into a failed release rather than one silently still
      # tracking a branch. sed, not yq: it preserves both files' explanatory comments.
      # WHY the chart needs pinning, and why `reconcileStrategy` must stay `Revision`,
      # are in ADR-0018's 2026-08-31 addendum — deliberately not repeated here.
      - name: Promote the release (image tags + chart source ref)
        env:
          TARGET: ${{ needs.route.outputs.target }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cluster="clusters/${TARGET}/flux-system.yaml"
          if [ "$(grep -cE '^[[:space:]]*tag:[[:space:]]' "$cluster" || true)" != "1" ]; then
            echo "::error::${cluster} must carry exactly one \`tag:\` — the beekeepingit chart source. Convert it once by hand (ref.branch -> ref.tag); the beekeepingit-gitops source stays on ref.branch."
            exit 1
          fi
          for file in "apps/${TARGET}/beekeepingit-helmrelease.yaml" "$cluster"; do
            sed -i -E "s|^([[:space:]]*tag:)[[:space:]].*|\1 ${VERSION}|" "$file"
            echo "::group::promoted $file"
            grep -nE '^[[:space:]]*(tag|branch):' "$file"
            echo "::endgroup::"
          done

      - name: Open the promotion PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: deploy/${{ github.event.release.tag_name }}
          delete-branch: true
          commit-message: "chore(deploy): ${{ needs.route.outputs.target }} -> ${{ github.event.release.tag_name }}"
          title: "chore(deploy): ${{ needs.route.outputs.target }} -> ${{ github.event.release.tag_name }}"
          body: |
            Automated by `release-deploy.yml` (D-27, ADR-0018) for release
            **${{ github.event.release.tag_name }}** -> **${{ needs.route.outputs.target }}**.

            Promotes the whole release, both halves of it:

            - **Images** — every `tag:` in
              `apps/${{ needs.route.outputs.target }}/beekeepingit-helmrelease.yaml`.
            - **Chart** — the `beekeepingit` GitRepository's `ref` in
              `clusters/${{ needs.route.outputs.target }}/flux-system.yaml`, so the
              umbrella chart (templates, NetworkPolicies, the Authentik blueprint)
              is taken from this release rather than from whatever `main` happens to
              hold. The sibling `beekeepingit-gitops` source deliberately keeps
              tracking `main`.

            Until this PR merges, the cluster keeps running the previous release —
            **merging is the deploy**. Roll back by reverting the merge, which now
            reverts chart and images together.
