# Enforce the monorepo tooling in CI: everything must be format-clean, lint-clean, and
# passing tests. Runs `task ci` (lint + test): repo-hygiene checks (Prettier, Markdown,
# actionlint, shellcheck, gitleaks), per-language linters, and per-language tests — all
# no-op gracefully until a package exists for that language.
# Per-language, path-filtered build/test matrices are added in EPIC-13 (#88).
#
# Renamed from "lint" (#85): the job started running `task test` too, so a check named
# "lint" gating merges on test results was misleading.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for gitleaks
      - name: Set up toolchains from mise.toml
        id: mise
        continue-on-error: true
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Retried once. The mise setup downloads a release binary from GitHub and
      # has failed transiently in CI: release-deploy run 33490109770 lost an
      # otherwise-green rc12 build to `curl` exit 35 (TLS handshake) on a cold
      # cache, and because `open-pr` needs every publish job green, NO promotion
      # PR opened — a network blip silently cost a deploy. A `uses:` step cannot
      # use this repo's bash retry loop (see helm-e2e.yml's image import), so
      # this is the equivalent shape: attempt, tolerate the failure, attempt
      # again. A second failure fails the job, as it should.
      - name: Set up toolchains from mise.toml (retry)
        if: steps.mise.outcome == 'failure'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Lint + test
        run: task ci

      # --- Client↔server sync validation parity (#585, FR-OF-2, D-12, NFR-TST-1) ---
      #
      # The rules a queued sync op must satisfy live in ONE artifact
      # (contracts/validation/), evaluated by TWO independent implementations:
      # each owning service's validate*Op and the client's sync_op_validator.dart.
      # The tests that hold them together
      # (services/*/api/sync_validation_{parity,corpus}_test.go and
      # client/test/core/validation/) live inside those components, and every
      # deployable component is deliberately excluded from `task ci` above —
      # build-publish.yml tests them per-component, and its matrix only picks a
      # component up when a changed path is literally prefixed by that
      # component's own directory.
      #
      # A change to contracts/validation/ alone therefore matched NO component
      # and landed with not one of those suites run — a shared file that four
      # services and the client all depend on, and the one file whose whole
      # purpose is to stay in agreement with them. These two steps are the
      # fan-out that prefix rule cannot express. They are steps of THIS job
      # rather than a new job so no new required status check is introduced,
      # and they run only when something in the parity surface actually moved.
      - name: Detect changes to the sync-validation parity surface
        id: parity
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # Listed out flat rather than via a YAML anchor: `filters` is a literal
          # block string the action re-parses itself, and an alias in there would
          # produce a nested list, not a flat pattern list (see helm-e2e.yml).
          filters: |
            parity:
              - 'contracts/validation/**'
              - 'scripts/gen-sync-validation.sh'
              - 'services/shared/syncvalidation/**'
              - 'services/*/api/sync*.go'
              - 'services/apiaries/api/declarations.go'
              - 'client/lib/core/validation/**'
              - 'client/test/core/validation/**'
              # The save-time call site (#597) evaluates the same description
              # through the same evaluator, and its tests assert concrete
              # `(column, code)` verdicts — so a description-only change can
              # break them too, and they belong in this fan-out for the same
              # reason the pre-push ones do.
              - 'client/lib/core/sync/sync_op_draft.dart'
              - 'client/test/core/sync/sync_op_draft_test.dart'
              - '.github/workflows/ci.yml'

      - name: Sync-validation parity — the four owning services
        if: steps.parity.outputs.parity == 'true'
        # The CLI_ARGS form of `task go:test` bypasses the Dockerfile skip, which
        # is exactly what is wanted here: these are the components that own a
        # validate*Op the shared description claims to mirror.
        run: task go:test -- services/apiaries services/activities services/journeys services/todos

      - name: Sync-validation parity — the client evaluator
        if: steps.parity.outputs.parity == 'true'
        # Scoped to the validation tests: the client's full suite (plus analyze
        # and the web build) is build-publish.yml's job when client/ itself
        # changes. This is the half that replays the shared corpus through the
        # real Dart evaluator and byte-compares the embedded description against
        # contracts/validation/. No `powersync:setup_web` — that downloads wasm
        # for the WEB build; these tests run on the Dart VM.
        run: |
          cd client
          flutter pub get
          flutter test test/core/validation test/core/sync/sync_op_draft_test.dart
