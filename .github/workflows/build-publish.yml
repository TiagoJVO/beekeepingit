# Path-filtered per-component build → test → image-scan → publish for the monorepo (EPIC-13 #88;
# requirements NFR-TST-1, NFR-MNT-1, NFR-ARC-3; D-9 monorepo).
#
# DORMANT BY DESIGN until the first service/app ships a Dockerfile. A "component" is any directory
# containing a `Dockerfile`; the detect job emits a matrix of only the components touched by the
# change (path filtering — AC #1), so the build job self-discovers work and no-ops cleanly while
# the repo has no Dockerfiles yet (same "green before code" philosophy as ci.yml / taskfiles/*).
#
# On merge to main, images publish to ghcr.io tagged by commit SHA (AC #4) as build artifacts —
# they are NOT auto-deployed. Deploys come only from a published Release (D-27, ADR-0018,
# .github/workflows/release-deploy.yml). Container-image scanning gates the build (AC #3);
# repo-level dependency/secret scanning lives in security-scan.yml.
#
# macOS runners for iOS builds are intentionally NOT here at M0 — added at M5 by EPIC-15 (AC #6);
# see the disabled `ios-build` placeholder job at the bottom.
name: build-publish

on:
  pull_request:
  push:
    branches: [main]

# Publishing is opt-in per job; the default token is read-only.
permissions:
  contents: read

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: detect affected components
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.scan.outputs.has_work }}
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need history to diff against the base/previous commit

      - name: Compute changed components (dirs with a Dockerfile)
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Resolve the diff base: PR target for PRs, previous tip for pushes.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          # First push to a new branch has an all-zero "before"; fall back to the parent commit.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "${HEAD_SHA}~1" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"; echo "$changed"

          # Every directory holding a Dockerfile is a buildable component.
          components="$(find . -type f -name Dockerfile \
            -not -path './.git/*' -not -path '*/.claude/*' -not -path '*/node_modules/*' \
            -printf '%h\n' | sed 's|^\./||' | sort -u)"

          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          include=""
          for dir in $components; do
            # Affected if any changed file lives under the component directory.
            if echo "$changed" | grep -q "^${dir}/"; then
              name="$(echo "$dir" | tr '/' '-')"
              image="ghcr.io/${owner}/beekeepingit/${name}"
              # Every component (Go service, the Flutter PWA, or the React admin app) is one
              # build. The client is
              # built define-less here (AppConfig's dev defaults) as pure CI/artifact
              # validation — its real per-environment, deployable build is produced by
              # release-deploy.yml with the target env's URLs baked in (D-27, ADR-0018).
              # No per-environment client variants here anymore.
              include="${include}{\"component\":\"${name}\",\"path\":\"${dir}\",\"image\":\"${image}\"},"
            fi
          done
          include="${include%,}" # trim trailing comma

          if [ -n "$include" ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"
            echo "Affected components: [${include}]"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "No affected buildable components — build job will be skipped (no Dockerfiles yet)."
          fi

  build:
    name: build ${{ matrix.component }}
    needs: detect
    if: needs.detect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io on merge
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up toolchains from mise.toml
        id: mise
        continue-on-error: true
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # Retried once. The mise setup downloads a release binary from GitHub and
      # has failed transiently in CI: release-deploy run 33490109770 lost an
      # otherwise-green rc12 build to `curl` exit 35 (TLS handshake) on a cold
      # cache, and because `open-pr` needs every publish job green, NO promotion
      # PR opened — a network blip silently cost a deploy. A `uses:` step cannot
      # use this repo's bash retry loop (see helm-e2e.yml's image import), so
      # this is the equivalent shape: attempt, tolerate the failure, attempt
      # again. A second failure fails the job, as it should.
      - name: Set up toolchains from mise.toml (retry)
        if: steps.mise.outcome == 'failure'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      # AC #2: lint → test → build the deployable artifact, scoped to just this
      # component (#23) — the repo-wide hygiene + library-module checks run in
      # ci.yml. The artifact (a static Go binary, or the Flutter web bundle) is
      # produced here with the Go workspace / Flutter toolchain, then packaged
      # by the component's Dockerfile (which only COPYs the prebuilt artifact —
      # the per-component build context can't resolve sibling Go modules).
      - name: Lint, test & build artifact (affected component)
        env:
          COMPONENT_PATH: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if [ -f "$COMPONENT_PATH/go.mod" ]; then
            task go:lint -- "$COMPONENT_PATH"
            task go:test -- "$COMPONENT_PATH"
            ( cd "$COMPONENT_PATH" && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o app . )
          elif [ -f "$COMPONENT_PATH/pubspec.yaml" ]; then
            # `powersync:setup_web` downloads the wasm SQLite + sync workers into
            # web/ (gitignored) — required before the web build (#23).
            # `task dart:l10n-check` (#78 AC): regenerate lib/l10n/gen and fail
            # on malformed ARB, an EN/PT key mismatch, or stale committed
            # codegen output — before spending time on analyze/test/build.
            # No --dart-define: this is a pure-CI validation build, so it uses
            # AppConfig's dev defaults (client/lib/core/config/app_config.dart).
            # The real per-environment deployable PWA is built by release-deploy.yml
            # with the target env's URLs baked in (D-27, ADR-0018).
            # The trailing `build_app_shell_cache` step generates the app-shell
            # precache manifest inside build/web's service worker (#619).
            # Nothing Flutter emits is content-hashed, so that manifest is what
            # gives the worker a per-release cache key; without it the worker is
            # inert and the app cannot start offline. Required after EVERY
            # `flutter build web` — scripts/check-app-shell-precache-wired.sh
            # fails the lint gate if a build site ever loses it.
            ( task dart:l10n-check \
              && cd "$COMPONENT_PATH" && flutter pub get && dart run powersync:setup_web \
              && flutter analyze && flutter test \
              && flutter build web --release --no-web-resources-cdn \
              && dart run tool/build_app_shell_cache.dart build/web )
          elif [ -f "$COMPONENT_PATH/package.json" ]; then
            # npm component (the React admin app, #72/#449): lint → test → build the static
            # Vite bundle into dist/, which the component's Dockerfile then COPYs. Vite bakes
            # VITE_* at BUILD time (not read at deploy time — an earlier comment here was
            # wrong), so the dev hostnames must be present now, exactly like the PWA's
            # define-less `client:latest` carries AppConfig's dev defaults. This build
            # publishes `admin:latest` (dev URLs), which the dev cluster's Flux HelmRelease
            # pulls; the real per-environment (staging/prod) admin image is built by
            # release-deploy.yml's publish-admin job with that env's URLs baked in
            # (D-27, ADR-0018). These dev VITE_* mirror admin/.env.example and the dev
            # hostnames in infra/helm/beekeepingit/charts/gateway/values.yaml — the
            # `deploy-urls` check (scripts/check-deploy-url-drift.sh) guards the
            # staging/prod copies against the overlays. Repo-wide web lint/test also run in
            # ci.yml's `task web:*` fan-out; this scopes the same gates to the built artifact.
            # Only `npm run build` needs the VITE_* (Vite reads them at bundle time); lint/test
            # don't. Keep the dev values in one place via env for the build step.
            ( cd "$COMPONENT_PATH" \
              && npm ci && npm run lint && npm test \
              && VITE_OIDC_ISSUER="https://auth.beekeepingit.local:8443/application/o/beekeepingit/" \
                 VITE_OIDC_CLIENT_ID="beekeepingit-admin" \
                 VITE_API_BASE_URL="https://app.beekeepingit.local:8443" \
                 VITE_ACCOUNT_URL="https://auth.beekeepingit.local:8443/if/user/#/settings" \
                 npm run build )
          else
            echo "::error::unknown component type at $COMPONENT_PATH (no go.mod, pubspec.yaml, or package.json)"
            exit 1
          fi

      # PWA installability audit (#93 AC "passes an installability audit e.g. Lighthouse
      # PWA checks"). Scoped to the client component only, and to the `pwa` category's
      # installability audits specifically (installable manifest incl. service worker,
      # viewport, themed omnibox, maskable icon, splash screen) — not the full
      # performance/perf-budget score, so this gates a real installability regression
      # without being noisy about unrelated Lighthouse perf variance. Runs against the
      # static `build/web` artifact just produced above via a local static file server
      # (no live cluster/gateway needed) — see client/lighthouserc.json and
      # docs/client/pwa-installability.md.
      - name: PWA installability audit (Lighthouse CI, client only)
        if: startsWith(matrix.component, 'client')
        working-directory: ${{ matrix.path }}
        run: npx --yes @lhci/cli@0.13.0 autorun --config=./lighthouserc.json

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Image metadata (tag by commit)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          # `sha-<short>` on every build (AC #4 "tagged by commit"). On main, also a
          # timestamp-prefixed `<YYYYMMDDHHMMSS>-<sha>` tag and `latest`. These are
          # build artifacts for CI, not deployables — deploys come from a Release
          # (D-27, ADR-0018). The client publishes plain `client:latest` (dev-default
          # URLs), which the dev cluster's Flux HelmRelease pulls.
          tags: |
            type=sha,prefix=sha-
            type=raw,value={{date 'YYYYMMDDHHmmss'}}-{{sha}},enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build to the local daemon first so the image is scanned BEFORE it can be published —
      # a failing scan must block the push, not chase an already-published tag.
      - name: Build image (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.path }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-resolve the base image on every build, so a moved tag is picked up
          # rather than served from a cached FROM. Worth keeping on its own merit —
          # but NOT, as the comment added with it on 2026-09-05 claimed, what
          # unblocked the 7 HIGH util-linux CVEs (CVE-2026-53612 et al) on #716.
          #
          # The stale-`apk upgrade`-layer mechanism that comment described is real;
          # it just was not what happened. The build log of the very run that added
          # this line shows `RUN apk --no-cache upgrade` EXECUTING — 2 packages, both
          # apk-tools — so the layer was not cached and the util-linux fix simply was
          # not in Alpine's v3.24 repository to install. Nor was there a newer base
          # to move to: nginx:1.31-alpine and nginx:1.31.5-alpine3.24 are one digest.
          #
          # The actual cause was libuuid riding in as a transitive dependency of an
          # nginx module nothing loads. client/Dockerfile and admin/Dockerfile now
          # delete it, and scripts/check-web-image-hardening.sh keeps them doing so.
          # Recorded here so the next red scan is not spent re-diagnosing this step.
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (AC #3 — blocks on HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          # `meta.outputs.version` is the primary tag (`sha-<short>`) built above.
          image-ref: ${{ matrix.image }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Publish only on merge to main; PRs build + scan but never push.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (merge only; cache reused from build above)
        if: github.event_name == 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          cache-from: type=gha

  # Stable, always-reporting roll-up of the matrixed `build` job above, so the image
  # build + scan can be a REQUIRED status check on `main` (#368, D-27). The matrix
  # produces one context per affected component (`build client`, `build services-sync`,
  # …) — dynamic names that vary per PR and vanish entirely when nothing is affected, so
  # none of them can be named in branch protection. This job is the one fixed context.
  #
  # Two rules make it safe to require:
  #   * `if: always()` — a `needs:` job is itself SKIPPED when an upstream is skipped, and
  #     a skipped REQUIRED check leaves a PR "Expected" forever. `always()` guarantees this
  #     job runs (and therefore reports a conclusion) on every PR/push.
  #   * the results are evaluated EXPLICITLY below rather than implied by `needs:`, because
  #     with `always()` GitHub no longer fails this job when an upstream failed.
  #
  # `build` is legitimately skipped when `detect` finds no affected component (the matrix is
  # path-gated), so `skipped` must PASS; `failure`/`cancelled` must FAIL. `detect` itself has
  # no `if:` and so never legitimately skips — anything other than `success` there means the
  # matrix never got the chance to run, which must NOT be reported as green.
  build-images:
    name: build & scan images
    needs: [detect, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the build matrix to have passed (or legitimately skipped)
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "detect=${DETECT_RESULT} build=${BUILD_RESULT}"

          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::component detection did not succeed (${DETECT_RESULT}) — the build matrix never ran"
            exit 1
          fi

          case "$BUILD_RESULT" in
            success)
              echo "All affected components built and scanned clean."
              ;;
            skipped)
              echo "No affected buildable component for this change — nothing to build or scan."
              ;;
            *)
              echo "::error::image build/scan did not pass (${BUILD_RESULT})"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------------------------
  # PLACEHOLDER — NOT part of the M0 pipeline (AC #6). macOS runners for native iOS builds are
  # added only at M5 by EPIC-15 (platform rollout PWA → Android → iOS, D-10). Kept disabled so the
  # deferral is recorded in-pipeline; do not enable before EPIC-15.
  ios-build:
    name: iOS build (deferred to M5 / EPIC-15)
    # Always false at M0 (the `ENABLE_IOS_CI` repo variable is unset). EPIC-15 enables iOS/macOS
    # CI at M5 by defining it — no Apple Developer account / macOS runners exist before then.
    if: ${{ vars.ENABLE_IOS_CI == 'true' }}
    runs-on: macos-latest
    steps:
      - run: echo "Placeholder — iOS/macOS CI is added at M5 by EPIC-15, not at M0."
