name: Helm CI

# Validates the platform charts on every change: dependency build, `helm lint`,
# and a `helm template` dry-run — for the beekeepingit umbrella chart (base
# values + every per-environment overlay) and the observability chart (#87,
# base values only; per-environment config lives on its Flux HelmRelease's
# `values:`, not overlay files — ADR-0013). No live cluster is used here —
# deploying to the cluster is a separate concern (EPIC-13 #86/#88).
#
# This is a required status check on `main`, so the job runs on EVERY PR/push (no path filter
# on the trigger) — otherwise a PR that doesn't touch infra/helm/** would never get a run for
# this check and its "Expected" status would block merging forever. Path-relevance is instead
# checked inside the job (dorny/paths-filter) so the real helm steps are skipped — not
# absent — when irrelevant, and the check still reports success quickly.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-template:
    name: helm lint & template dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/helm/beekeepingit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            helm:
              - 'infra/helm/**'
              - '.github/workflows/helm-ci.yml'

      - name: Set up Helm
        if: steps.changes.outputs.helm == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.21.2"

      # Every subchart is a local file:// dependency (postgres/gateway are
      # hand-rolled; authentik/minio only hold supplementary Secrets/ConfigMaps
      # now — the actual vendored charts are separate Flux HelmReleases, see
      # ADR-0012/ADR-0016), so this never needs network access to a chart repo.
      - name: helm dependency build
        if: steps.changes.outputs.helm == 'true'
        run: helm dependency build .

      - name: helm lint (base values)
        if: steps.changes.outputs.helm == 'true'
        run: helm lint .

      - name: helm lint (per-environment overlays)
        if: steps.changes.outputs.helm == 'true'
        run: |
          for env in dev staging prod; do
            echo "::group::lint $env"
            helm lint . -f "environments/$env.yaml"
            echo "::endgroup::"
          done

      - name: helm template dry-run (base values)
        if: steps.changes.outputs.helm == 'true'
        run: helm template beekeepingit .

      - name: helm template dry-run (per-environment overlays)
        if: steps.changes.outputs.helm == 'true'
        run: |
          for env in dev staging prod; do
            echo "::group::template $env"
            helm template beekeepingit . -f "environments/$env.yaml"
            echo "::endgroup::"
          done

      # Negative half of the assertion the loop above makes positively (#556,
      # NFR-SEC-1). Staging's ACME renewal was wedged for five weeks by a
      # `400 urn:ietf:params:acme:error:rejectedIdentifier` — the gateway chart's
      # dev-default `admin.beekeepingit.local` had leaked into the deployed
      # Certificate's SAN because the gitops repo's values were never given
      # `gateway.adminHost` (D-27, ADR-0018). `gateway.assertPublicHostnames` now
      # refuses to render a `.local`/`.localhost` TLS host — or a `global.*Origin`
      # pointing at one — when cert-manager is on, so a future drift fails here
      # instead of silently in ACME five weeks later.
      #
      # The per-overlay loop ABOVE is the positive half and must stay: prod ships
      # `certManager.enabled: true` with `*.beekeepingit.example` hosts and has to
      # keep rendering (`.example` is a reserved TLD, but it's a deliberate
      # placeholder — the guard only rejects the loopback suffixes). Don't
      # "simplify" either step away; together they pin both directions.
      #
      # The first grep asserts the GUARD'S OWN invariant sentence, not a hostname:
      # any unrelated helm failure that happens to dump a rendered manifest would
      # contain `admin.beekeepingit.local` too, and which host is named first
      # depends on Go's map-key ordering — both make a host-only grep a false
      # signal. The second grep then confirms the offending host is still named,
      # with the dot escaped so it can't match an arbitrary character.
      - name: "helm template (negative: a .local host/origin must fail when cert-manager is on)"
        if: steps.changes.outputs.helm == 'true'
        run: |
          set -euo pipefail
          # Capture inside the `if` so the EXPECTED non-zero exit doesn't trip `set -e`.
          if out="$(helm template beekeepingit . --set gateway.certManager.enabled=true 2>&1)"; then
            echo "::error::helm template rendered base values with certManager.enabled=true, but the base gateway hosts/origins are *.beekeepingit.local — gateway.assertPublicHostnames did not fire."
            echo "$out"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'refusing to request a public'; then
            echo "::error::helm template failed as expected, but not with gateway.assertPublicHostnames' message — some other render error is masking the guard."
            echo "$out"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'beekeepingit\.local'; then
            echo "::error::the guard fired but did not name the offending hostname; an operator needs the offending key AND value to fix the drift."
            echo "$out"
            exit 1
          fi
          echo "Guard fired as expected:"
          echo "$out"

      # Unlike the umbrella above, this chart's four vendored dependencies are
      # remote (prometheus-community / grafana / open-telemetry chart repos), so
      # this step DOES need network access — same as any local `helm dependency
      # build` of it.
      - name: helm dependency build (observability)
        if: steps.changes.outputs.helm == 'true'
        working-directory: infra/helm/observability
        run: helm dependency build .

      - name: helm lint (observability)
        if: steps.changes.outputs.helm == 'true'
        working-directory: infra/helm/observability
        run: helm lint .

      - name: helm template dry-run (observability)
        if: steps.changes.outputs.helm == 'true'
        working-directory: infra/helm/observability
        run: helm template observability .
